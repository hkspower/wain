# النوخذة over HTTP/3 — nginx 1.25+ (QUIC support is built in from 1.25.0).
# Verify the binary has it:  nginx -V 2>&1 | grep -o with-http_v3_module

server {
    # HTTP/1.1 + HTTP/2 over TCP
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    # HTTP/3 over QUIC (UDP) — the firewall must allow UDP/443
    listen 443 quic reuseport;
    listen [::]:443 quic reuseport;

    server_name www.almuhallab-code.com;
    root /var/www/nokhatha;
    index index.html;

    ssl_certificate     /etc/letsencrypt/live/almuhallab-code.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/almuhallab-code.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;          # QUIC requires TLS 1.3
    ssl_early_data on;                       # 0-RTT resumption

    # Tell HTTP/1.1 and HTTP/2 clients that h3 is available here.
    add_header Alt-Svc 'h3=":443"; ma=86400' always;

    add_header X-Content-Type-Options   "nosniff" always;
    add_header X-Frame-Options          "SAMEORIGIN" always;
    add_header Referrer-Policy          "no-referrer" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    types { application/manifest+json webmanifest; }

    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Service-Worker-Allowed "/" always;
    }
    location ~* \.html$   { add_header Cache-Control "no-cache" always; }
    location ~* \.(svg|webmanifest)$ { add_header Cache-Control "public, max-age=86400" always; }

    error_page 404 /404.html;

    gzip on;
    gzip_types text/css text/javascript application/javascript application/manifest+json image/svg+xml;
}

server {
    listen 80;
    listen [::]:80;
    server_name almuhallab-code.com www.almuhallab-code.com;
    return 301 https://www.almuhallab-code.com$request_uri;
}

server {
    listen 443 ssl;
    listen 443 quic;
    server_name almuhallab-code.com;
    ssl_certificate     /etc/letsencrypt/live/almuhallab-code.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/almuhallab-code.com/privkey.pem;
    return 301 https://www.almuhallab-code.com$request_uri;
}
