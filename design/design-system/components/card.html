<!-- @dsCard group="Components" -->
<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>البطاقة | نظام تصميم المهلب كود</title>
<link rel="stylesheet" href="../tokens.css" />
<style>.card, .channel { transition: transform .22s ease, border-color .22s ease, box-shadow .22s ease; }
.card:hover { transform: translateY(-3px); border-color: var(--tint);
      box-shadow: 0 8px 24px rgba(230, 169, 92, .18); }
.card:hover .tile, .channel:hover .tile { background: var(--tint); }
.card:hover .tile .ic, .channel:hover .tile .ic { stroke: var(--on-tint); color: var(--on-tint); }
.card:hover .tile .ic, .channel:hover .tile .ic { transform: scale(1.14) rotate(-4deg); }
/* Arabic in Cairo needs line-height >= 1.35 at display sizes, or a damma
       collides with the line above. Measured: 18 headings sat at 1.2 — the
       browser default — including a 52px h1 that wraps to two lines. */
    h1, h2, h3, .num, h2.section, .product h3, .card h3 {
      line-height: 1.4;
    }
.card {
      background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 20px;
      display: flex; flex-direction: column; gap: 6px;
    }
.card h3 { margin: 0; font-size: 16px; display: flex; align-items: center; gap: 8px; }
.card p { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.65; }
.card .tile .ic { width: 21px; height: 21px; }
.card .chip { margin-top: auto;  line-height: var(--lh-ui); }
.card:hover ul.feats li { border-color: var(--tint); }
/* ═══════ each service explained by a drawing ═══════
       Seven scenes, one per service card, in the same idiom as the units':
       a page whose content fills, a device that installs, blocks that fit
       together, a model wired to its sources, a pen over an artboard, a
       cloud feeding its machines, and a game whose figure jumps. Every scene
       is complete at rest — motion only sets already-drawn parts moving — so
       a reduced-motion visitor, a print, and a screenshot all read the same
       explanation. */
    /* a card's scene is shorter than the 136px base: a rail card is narrow */
    .card > .scene { height: 108px; }
/* Measured on a 390×844 phone: one card filled a third of the fold,
         and the flagship row's drawing took 150 of its 302px. The drawings
         come down; nothing they explain is lost, because each still sits
         above the line of text that names it. */
      .card > .scene { height: 88px; }
.card { padding: 16px; }</style>
</head>
<body>
  <header class="ds-head">
    <h1>البطاقة</h1>
    <p>بطاقة موحّدة برأس أيقوني ورقاقات. هي وحدة البناء في كل شريط شرائح.</p>
  </header>
  <main class="ds-body">
    <div class="ds-row" style="align-items:stretch">
      <div class="card" style="max-width:280px">
        <h3>تطوير المواقع</h3>
        <p>مواقع تُبنى للسرعة ولمحركات البحث.</p>
        <ul class="feats"><li>مواقع شركات</li><li>متاجر إلكترونية</li></ul>
      </div>
      <div class="card" style="max-width:280px">
        <h3>تطوير الألعاب</h3>
        <p>ألعاب تُبنى لأجهزة الحاسوب.</p>
        <ul class="feats"><li>ويندوز</li><li>2D</li><li>3D</li></ul>
      </div>
    </div>
  </main>
</body>
</html>
