<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- النوخذة mark: the anchor, redrawn 2026-07 at the owner's request — ring,
       stock, shank, curved arms crowned with arrowhead flukes. Since the dark
       theme (2026-10-07) it wears the logo's colours: the amber #e6a95c on the
       logo's near-black ground #0a0908 (9.66:1), with the logo's soft amber
       glow. The company and the product stay marked differently: the anchor
       is النوخذة's, the AC monogram the company's. All art sits inside the
       maskable safe zone. -->
  <defs>
    <filter id="nokhatha-glow" filterUnits="userSpaceOnUse" x="0" y="0" width="512" height="512" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14" result="blur"/>
      <feFlood flood-color="#e6a95c" flood-opacity="0.32"/>
      <feComposite in2="blur" operator="in" result="halo"/>
      <feMerge><feMergeNode in="halo"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="116" fill="#0a0908"/>
  <g filter="url(#nokhatha-glow)">
    <g fill="none" stroke="#e6a95c" stroke-width="30" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="256" cy="118" r="40"/>
      <path d="M256 158v256"/>
      <path d="M172 232h168"/>
      <path d="M120 316c14 74 64 112 136 118 72-6 122-44 136-118"/>
    </g>
    <g fill="#e6a95c" stroke="#e6a95c" stroke-width="14" stroke-linejoin="round">
      <path d="M120 268 94 330l58-8z"/>
      <path d="M392 268l26 62-58-8z"/>
    </g>
  </g>
</svg>
