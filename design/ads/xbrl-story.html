<style>
  @font-face { font-family:"Cairo"; src:url("file:///home/user/wain/almuhallab/fonts/cairo-400.woff2") format("woff2"); font-weight:400; font-display:block; }
  @font-face { font-family:"Cairo"; src:url("file:///home/user/wain/almuhallab/fonts/cairo-500.woff2") format("woff2"); font-weight:500; font-display:block; }
  @font-face { font-family:"Cairo"; src:url("file:///home/user/wain/almuhallab/fonts/cairo-700.woff2") format("woff2"); font-weight:700; font-display:block; }
  @font-face { font-family:"Cairo"; src:url("file:///home/user/wain/almuhallab/fonts/cairo-800.woff2") format("woff2"); font-weight:800; font-display:block; }
  * { box-sizing:border-box; margin:0; padding:0; }
  /* The decorative mark is meant to bleed off the edge, so it must be
     clipped, not merely allowed to hang. Without this it widened the document
     to 1160px — and because the document is RTL, the scroll origin is the
     right edge, so the screenshot's window slid and every element was cut off
     on the right. The picture looked wrong in a way that pointed at the type,
     not at an eighty-pixel decoration behind it. Measured, not guessed:
     scrollWidth 1160 against a clientWidth of 1080. */
  html,body { width:1080px; height:1920px; overflow:hidden; }
  body { font-family:"Cairo",system-ui,sans-serif; background:#fff; color:#1b2430;
          display:flex; flex-direction:column; -webkit-font-smoothing:antialiased; }

  /* the masthead, the same brown bar the site wears */
  .top { height:210px; background:#6f3f1c; color:#fff;
          display:flex; align-items:center; gap:26px; padding:0 96px; flex:none; }
  .top svg { width:200px; height:100px; color:#fff; }
  .top .name { font-weight:800; font-size:46px; line-height:1.35; }
  .top .name small { display:block; font-weight:500; font-size:30px; opacity:.92; }

  .body { flex:1; padding:96px; display:flex; flex-direction:column;
           position:relative; overflow:hidden;
           justify-content:center; gap:34px; }
  .kicker { color:#7a4418; font-weight:700; font-size:34px; letter-spacing:2px; }
  h1 { font-size:92px; font-weight:500; line-height:1.35; letter-spacing:-1px; }
  h1 b { font-weight:800; color:#7a4418; }
  ul { list-style:none; display:flex; flex-direction:column; gap:26px;
        margin-top:17px; }
  li { display:flex; align-items:center; gap:18px; font-size:40px; color:#1b2430; }
  .dot { width:14px; height:14px; border-radius:50%; background:#7a4418;
          flex:none; }
  .proof { margin-top:34px; align-self:flex-start; background:#f1f4f8;
            border:2px solid #d0d7e1; border-radius:999px;
            padding:17px 42px; font-size:32px; color:#586981; }
  /* The sprite's icons are DRAWN, not filled: the site sets fill:none and
     strokes them with currentColor. Dropped in without that, each one renders
     as a solid silhouette — the anchor became a grey bowl and the document a
     grey rectangle, both of which read as a failed image rather than as a
     watermark. Same treatment as .ic on the site, at a weight that survives
     being blown up to 600px. */
  .art { position:absolute; opacity:.10; color:#7a4418;
          fill:none; stroke:currentColor; stroke-width:0.9;
          stroke-linecap:round; stroke-linejoin:round;
          bottom:250px; left:-90px; width:620px; height:620px; }

  /* the way to answer, which is the point of an advertisement */
  .cta { height:210px; background:#6f3f1c; color:#fff; flex:none;
          display:flex; align-items:center; justify-content:space-between;
          padding:0 96px; }
  .cta .wa { display:flex; align-items:center; gap:16px;
              font-size:42px; font-weight:800; }
  .cta .wa svg { width:50px; height:50px; stroke:#fff;
                  fill:none; stroke-width:1.8; stroke-linecap:round; }
  .cta .site { font-size:32px; opacity:.92; }
  .ltr { unicode-bidi:isolate; direction:ltr; }
</style></head><body>
