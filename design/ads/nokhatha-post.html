<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<style>
  @font-face { font-family:"Cairo"; src:url("../../almuhallab/fonts/cairo-400.woff2") format("woff2"); font-weight:400; unicode-range:U+0600-06FF,U+0750-077F,U+08A0-08FF,U+FB50-FDFF,U+FE70-FEFF; font-display:block; }
@font-face { font-family:"Cairo"; src:url("../../almuhallab/fonts/cairo-latin.woff2") format("woff2"); font-weight:400; unicode-range:U+0000-00FF,U+2000-206F; font-display:block; }
@font-face { font-family:"Cairo"; src:url("../../almuhallab/fonts/cairo-500.woff2") format("woff2"); font-weight:500; unicode-range:U+0600-06FF,U+0750-077F,U+08A0-08FF,U+FB50-FDFF,U+FE70-FEFF; font-display:block; }
@font-face { font-family:"Cairo"; src:url("../../almuhallab/fonts/cairo-latin.woff2") format("woff2"); font-weight:500; unicode-range:U+0000-00FF,U+2000-206F; font-display:block; }
@font-face { font-family:"Cairo"; src:url("../../almuhallab/fonts/cairo-700.woff2") format("woff2"); font-weight:700; unicode-range:U+0600-06FF,U+0750-077F,U+08A0-08FF,U+FB50-FDFF,U+FE70-FEFF; font-display:block; }
@font-face { font-family:"Cairo"; src:url("../../almuhallab/fonts/cairo-latin.woff2") format("woff2"); font-weight:700; unicode-range:U+0000-00FF,U+2000-206F; font-display:block; }
@font-face { font-family:"Cairo"; src:url("../../almuhallab/fonts/cairo-800.woff2") format("woff2"); font-weight:800; unicode-range:U+0600-06FF,U+0750-077F,U+08A0-08FF,U+FB50-FDFF,U+FE70-FEFF; font-display:block; }
@font-face { font-family:"Cairo"; src:url("../../almuhallab/fonts/cairo-latin.woff2") format("woff2"); font-weight:800; unicode-range:U+0000-00FF,U+2000-206F; font-display:block; }

  @font-face { font-family:"Chakra Petch"; src:url("../../almuhallab/fonts/chakrapetch-700.woff2") format("woff2"); font-weight:700; font-display:block; }
  @font-face { font-family:"JetBrains Mono"; src:url("../../almuhallab/fonts/jetbrainsmono-latin.woff2") format("woff2"); font-weight:400 800; font-display:block; }
  * { box-sizing:border-box; margin:0; padding:0; }
  /* The decorative mark bleeds off the edge, so it must be clipped: without
     this the RTL document widened to 1160px and the screenshot slid. */
  html,body { width:1080px; height:1080px; overflow:hidden; }
  body { font-family:"Cairo",sans-serif; background:#0a0908; color:#f4f4f4;
          display:flex; flex-direction:column; -webkit-font-smoothing:antialiased; }

  /* the masthead: the company's English logo on its own ground */
  .top { height:200px; display:flex; align-items:center; justify-content:center;
          flex:none; position:relative;
          background:radial-gradient(60% 70% at 50% 55%, rgba(230,169,92,.10), transparent 70%); }
  .top img { height:140px; }
  .top::after, .cta::before { content:""; position:absolute; left:76px; right:76px; height:2px;
          background:linear-gradient(90deg, transparent, #7f5d33, #e6a95c, #7f5d33, transparent); }
  .top::after { bottom:0; }

  .body { flex:1; padding:76px; display:flex; flex-direction:column;
           position:relative; overflow:hidden;
           justify-content:center; gap:22px; }
  .kicker { color:#e6a95c; font-weight:700; font-size:28px; }
  .kicker .p { font-family:"JetBrains Mono",monospace; margin-left:14px; }
  h1 { font-size:76px; font-weight:500; line-height:1.35; letter-spacing:-1px; }
  h1 b { font-weight:800; color:#e6a95c; }
  ul { list-style:none; display:flex; flex-direction:column; gap:14px;
        margin-top:11px; }
  li { display:flex; align-items:center; gap:18px; font-size:34px; color:#f4f4f4; }
  .dot { width:14px; height:14px; border-radius:2px; background:#e6a95c; flex:none; }
  .proof { margin-top:22px; align-self:flex-start; background:#242321;
            border:2px solid #363534; border-radius:999px;
            padding:11px 30px; font-size:26px; color:#f4f4f4; }
  /* sprite icons are drawn, not filled: stroke with currentColor */
  .art { position:absolute; opacity:.12; color:#e6a95c;
          fill:none; stroke:currentColor; stroke-width:0.9;
          stroke-linecap:round; stroke-linejoin:round;
          top:30px; left:-80px; width:430px; height:430px; }
  .anchor { position:absolute; left:76px; bottom:76px;
             width:190px; height:190px; }

  /* the way to answer, which is the point of an advertisement */
  .cta { height:160px; background:#141211; color:#f4f4f4; flex:none; position:relative;
          display:flex; align-items:center; justify-content:space-between;
          padding:0 76px; }
  .cta::before { top:0; }
  .cta .wa { display:flex; align-items:center; gap:16px;
              font-family:"JetBrains Mono",monospace; font-size:34px; font-weight:800; }
  .cta .wa svg { width:44px; height:44px; stroke:#e6a95c;
                  fill:none; stroke-width:1.8; stroke-linecap:round; }
  .cta .site { font-family:"JetBrains Mono",monospace; font-size:22px; color:#e6a95c; }
  .ltr { unicode-bidi:isolate; direction:ltr; }
</style></head><body>
  <div class="top"><img src="../logo-en/almuhallab-code-logo-for-dark.svg" alt="Almuhallab Code"></div>
  <div class="body">
    <img class="anchor" src="../../almuhallab/icon.svg" alt="">
    <div class="kicker"><bdi class="p" dir="ltr">&gt;_</bdi>من المهلب كود</div>
    <h1>نظامك المحاسبي كامل.<br><b>مجاناً.</b></h1>
    <ul><li><span class="dot"></span>المحفظة والقيمة السوقية</li><li><span class="dot"></span>الميزانية السنوية وملف XBRL</li><li><span class="dot"></span>الطلبات من الطلب حتى التسليم</li></ul>
    <div class="proof">يعمل بلا إنترنت · سجلاتك لا تغادر جهازك</div>
  </div>
  <div class="cta">
    <div class="wa"><svg viewBox="0 0 24 24"><path d="M6.19 3.69h2.62l1.62 4-2 1.5a12.5 12.5 0 0 0 6.38 6.38l1.5-2 4 1.62v2.62c0 1.38-1.12 2.5-2.5 2.5A18.25 18.25 0 0 1 3.69 6.19c0-1.38 1.12-2.5 2.5-2.5Z"/></svg>
      <span class="ltr">+965 6589 4110</span></div>
    <div class="site ltr">www.almuhallab-code.com</div>
  </div>
</body></html>
