<title>النوخذة | فيلم تعريفي</title>
<!--
  The film is a web page, not a video editor's project.

  Everything the site is made of is here already: the tokens, the drawn sprite,
  the bundled Cairo, hand-written CSS motion. Building the film the same way
  means it cannot drift from the product — the anchor on the title card is the
  same path النوخذة flies, the close is the logo-en lockup, and the amber
  is the same amber. (#i-boum stays in the sprite only because the suite
  pins that the film carries the site's own path; nothing draws it.)

  It is driven by ONE timeline. Every animation starts at t=0 with its own
  delay, runs once, and fills both ends; nothing loops and nothing depends on
  when the page happened to load. render.py then seeks frame by frame by
  setting currentTime on every animation, so the same second renders the same
  pixels on any machine, at any speed, however long the screenshot took. A
  film captured in real time is a film you cannot reproduce.

  Scenes stay in the DOM the whole way through and are hidden with opacity,
  never display:none — an element outside the render tree has no animations
  for getAnimations() to seek, and the scene would arrive frozen at frame one.
-->

  /* the site's dark logo theme (2026-10-07): the logo's near-black ground,
     cards one neutral step above it, amber as the one accent and always ink */
  :root {
    color-scheme: dark;
    --bg: #0a0908; --panel: #141211; --panel-2: #1a1918; --panel-3: #242321;
    --border: #363534; --border-input: #76706a;
    --text: #ececec; --muted: #a8aeb5;
    --tint: #e6a95c; --stripe: #7f5d33; --on-tint: #0a0908; --on-bar: #f4f4f4;
    --tint-strong: #0a0908; --on-bar-fill: #272625;
    --good: #37b671; --info: #66a3f0;
    --sans: "Cairo", system-ui, sans-serif;
    --display: "Chakra Petch", "Cairo", sans-serif;
    --mono: "JetBrains Mono", ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    width: 1920px; height: 1080px; overflow: hidden;
    background: radial-gradient(ellipse 60% 50% at 50% 42%, rgba(230,169,92,.07), transparent 70%), var(--bg);
    color: var(--text);
    font-family: var(--sans); font-weight: 500;
    -webkit-font-smoothing: antialiased;
  }
  .stage { position: relative; width: 1920px; height: 1080px; }

  /* ── every scene is a full frame, faded in and out by its own keyframes ── */
  .sc {
    position: absolute; inset: 0; opacity: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 64px 140px 186px;
    animation: scene 1ms linear both;   /* duration/delay set per scene below */
  }
  @keyframes scene {
    0%, 100% { opacity: 0; }
    6%, 94%  { opacity: 1; }
  }

  .ic { fill: none; stroke: var(--tint); color: var(--tint);
        stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

  h1 { font-size: 108px; font-weight: 800; line-height: 1.35; margin: 0; letter-spacing: -1px; }
  h2 { font-size: 62px;  font-weight: 800; line-height: 1.35; margin: 0; }
  .lede { font-size: 34px; color: var(--muted); line-height: 1.6; margin: 24px 0 0; max-width: 1400px; text-align: center; }
  .kicker { font-size: 30px; color: var(--tint); font-weight: 700; letter-spacing: 2px; }

  /* ── the caption band: the narration, written out ───────────────────────
     Burned in on purpose. The film is watched on a phone in a feed with the
     sound off more often than not, and a film that only speaks says nothing
     there. The band is the logo's own ground with light ink, and never moves. */
  .cap {
    position: absolute; left: 0; right: 0; bottom: 0; height: 150px;
    display: flex; align-items: center; justify-content: center;
    background: var(--tint-strong); color: var(--on-bar);
    border-top: 1px solid var(--on-bar-fill);
    box-shadow: 0 -1px 0 rgba(230,169,92,.18);
    font-size: 36px; font-weight: 500; line-height: 1.4; text-align: center;
    padding: 0 130px;
  }
  .cap span { position: absolute; opacity: 0; animation: line 1ms linear both; }
  @keyframes line { 0%, 100% { opacity: 0; } 8%, 92% { opacity: 1; } }

  /* the mark, drawn rather than shown */
  .mark { width: 300px; height: 300px; stroke: var(--tint); color: var(--tint);
          fill: none; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round;
          filter: drop-shadow(0 0 28px rgba(230,169,92,.28)); }
  /* the company's mark is the logo-en lockup itself, shown, not redrawn */
  .logo { width: 900px; height: auto; display: block; margin: -40px 0 -30px; }

  .word { font-size: 130px; font-weight: 800; color: var(--text); line-height: 1.35; }
  .sub  { font-size: 42px; color: var(--muted); margin-top: 8px; }

  /* ── generic motion, all single-shot ───────────────────────────────── */
  @keyframes rise  { from { opacity: 0; transform: translateY(46px); } to { opacity: 1; transform: none; } }
  @keyframes fade  { from { opacity: 0; } to { opacity: 1; } }
  @keyframes pop   { from { opacity: 0; transform: scale(.86); } to { opacity: 1; transform: none; } }
  @keyframes draw  { from { stroke-dashoffset: var(--len); } to { stroke-dashoffset: 0; } }
  @keyframes grow  { from { transform: scaleY(0); } to { transform: scaleY(1); } }
  @keyframes slidein { from { opacity: 0; transform: translateX(-70px); } to { opacity: 1; transform: none; } }
  @keyframes scatter { from { transform: none; opacity: 1; }
                       to { transform: translate(var(--dx), var(--dy)) rotate(var(--rot)); opacity: .6; } }
  @keyframes settle  { from { transform: translate(var(--dx), var(--dy)) rotate(var(--rot)); opacity: .3; }
                       to   { transform: none; opacity: 1; } }
  @keyframes count { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: none; } }


  /* ── the camera on the flow map ─────────────────────────────────────────
     The map is the one scene that is a diagram rather than a list, and it
     was the one scene where nothing moved once the wires had drawn: two
     cards, two lines, a circle, then eleven seconds of stillness.

     So a camera. It opens wide enough to show that there are two sources,
     pushes in on the core as the wires reach it — the point being made at
     exactly that moment — holds there while the second line is spoken, then
     pulls back out to leave the whole shape standing.

     The origin is off-centre towards the core, so the push travels toward
     the thing it is about instead of just growing. Scale only, on one
     element: composited, so it costs the same as not moving. And the extent
     is bounded — 1.06, not 1.2 — because the scene's content already very
     nearly fills the safe area, and a camera that pushes its own subject off
     the bottom of the frame is worse than no camera. --stills measures it. */
  .cam { transform-origin: 34% 50%; will-change: transform; }
  @keyframes camera {
    0%   { transform: scale(.92); }
    34%  { transform: scale(1.06); }
    70%  { transform: scale(1.06); }
    100% { transform: scale(.99); }
  }

  .cards { display: flex; gap: 32px; margin-top: 40px; }
  .card {
    width: 340px; padding: 26px; border: 2px solid var(--border);
    border-radius: 22px; background: var(--panel); text-align: center;
    opacity: 0; animation: rise 1ms cubic-bezier(.2,.7,.3,1) both;
  }
  .card .tile {
    width: 72px; height: 72px; margin: 0 auto 16px; border-radius: 22px;
    background: var(--panel-2); display: grid; place-items: center;
  }
  .card .tile svg { width: 38px; height: 38px; }
  .card b { display: block; font-size: 32px; font-weight: 800; }
  .card p { margin: 10px 0 0; font-size: 24px; color: var(--muted); line-height: 1.5; }

  /* the paper pile that scatters, then the same pile settling into one core */
  .paper { position: absolute; width: 210px; height: 140px; border-radius: 12px;
           background: var(--panel); border: 2px solid var(--border-input); }
  .paper i { position: absolute; left: 22px; right: 22px; height: 8px; border-radius: 4px;
             background: var(--border); display: block; }

  .drawn { stroke-dasharray: var(--len); stroke-dashoffset: var(--len);
           animation: draw 1ms ease both; }

  .bars { display: flex; align-items: flex-end; gap: 24px; height: 260px; margin-top: 32px; }
  .bars b { width: 70px; background: var(--tint); border-radius: 8px 8px 0 0;
            transform-origin: bottom; transform: scaleY(0); animation: grow 1ms cubic-bezier(.2,.7,.3,1) both; }

  .rows { width: 1020px; margin-top: 36px; }
  .row { display: flex; align-items: center; justify-content: space-between;
         padding: 20px 30px; border: 2px solid var(--border); border-radius: 18px;
         background: var(--panel); margin-bottom: 14px; font-size: 30px;
         opacity: 0; animation: slidein 1ms cubic-bezier(.2,.7,.3,1) both; }
  .row .amt { font-weight: 800; font-variant-numeric: tabular-nums; }
  .row.total { border-width: 3px; border-color: var(--tint); background: var(--panel-2); font-size: 34px; }

  .core { width: 250px; height: 250px; border-radius: 50%; background: var(--tint);
          color: var(--on-tint); box-shadow: 0 0 60px rgba(230,169,92,.3); display: grid; place-items: center; text-align: center;
          font-size: 30px; font-weight: 800; line-height: 1.4; padding: 24px;
          opacity: 0; animation: pop 1ms cubic-bezier(.2,.7,.3,1) both; }

  .facts { display: flex; gap: 56px; margin-top: 48px; }
  .fact { width: 370px; text-align: center; opacity: 0; animation: count 1ms cubic-bezier(.2,.7,.3,1) both; }
  .fact b { display: block; font-size: 72px; font-weight: 800; color: var(--tint); }
  .fact span { font-size: 27px; color: var(--muted); }

  .chans { display: flex; gap: 24px; margin-top: 40px; }
  .chan { display: flex; align-items: center; gap: 14px; font-size: 30px;
          padding: 18px 30px; border: 2px solid var(--border); border-radius: 999px;
          background: var(--panel); opacity: 0; animation: rise 1ms cubic-bezier(.2,.7,.3,1) both; }
  .chan svg { width: 34px; height: 34px; }
  .ltr { unicode-bidi: isolate; direction: ltr; }
  .amt, .chan .ltr { font-family: var(--mono); }
  .fact b { font-family: var(--display), var(--sans); }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <!--SPRITE-->
</svg>

<div class="stage">
  <!--SCENES-->
  <div class="cap"><!--CAPTIONS--></div>
</div>

<!-- The timeline is data, not scattered CSS: render.py and the voice script
     read it back out of the page, so the frame count, the subtitles and the
     narration cannot disagree with what is actually on screen. -->
<script type="application/json" id="timeline"><!--TIMELINE--></script>
<script>window.FILM = JSON.parse(document.getElementById("timeline").textContent);</script>
</body>
