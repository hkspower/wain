<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src * 'self' data: blob:; frame-src about: data: blob:; font-src 'self'; manifest-src 'self'; worker-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'" />
  <meta name="referrer" content="no-referrer" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#ffffff" />
  <link rel="preload" as="font" type="font/woff2" href="fonts/tajawal-400.woff2" crossorigin />
  <link rel="icon" type="image/svg+xml" href="icon.svg" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Almuhallab Code — Edit Code in Your Browser</title>
  <meta name="description" content="Almuhallab Code — a fast, offline, in-browser code editor with live preview for HTML, CSS, and JavaScript." />
  <style>
    /* Tajawal (SIL OFL) — bundled, never fetched from a CDN: the strict CSP
       forbids external origins, and a self-hosted face renders identically on
       every device instead of depending on what the OS happens to have.
       Arabic subset only; Latin and digits stay on the system face. */
    @font-face { font-family:"Tajawal"; font-style:normal; font-weight:400;
      font-display:swap; src:url("fonts/tajawal-400.woff2") format("woff2"); }
    @font-face { font-family:"Tajawal"; font-style:normal; font-weight:500;
      font-display:swap; src:url("fonts/tajawal-500.woff2") format("woff2"); }
    @font-face { font-family:"Tajawal"; font-style:normal; font-weight:600;
      font-display:swap; src:url("fonts/tajawal-500.woff2") format("woff2"); }
    @font-face { font-family:"Tajawal"; font-style:normal; font-weight:700;
      font-display:swap; src:url("fonts/tajawal-700.woff2") format("woff2"); }
    @font-face { font-family:"Tajawal"; font-style:normal; font-weight:800;
      font-display:swap; src:url("fonts/tajawal-800.woff2") format("woff2"); }
    :root {
      --bg: #ffffff;
      --panel: #ffffff;
      --panel-2: #f1f4f8;
      --border: #d0d7e1; --dot-js: #836407; --code-dim: #5e6979; --warn-bg: #ffffff; --info: #1964ce; --good: #02783d; --border-input: #858d99; --panel-3: #e6ebf1;
      --text: #1b2430;
      --muted: #586981;
      --tint: #7a4418;
      --tint-strong: #6f3f1c;
      --sand: #9e5603; --sand-vivid: #e3a556;
      --danger: #ce1925;
      --mono: ui-monospace, "SF Mono", "Cascadia Code", "JetBrains Mono", Menlo, Consolas, monospace;
      --sans: "Tajawal", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Header */
    header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 20px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 18px; }
    .brand .logo {
      width: 34px; height: 34px; border-radius: 10px;
      background: linear-gradient(135deg, var(--sand-vivid), var(--tint-strong));
      display: grid; place-items: center; font-size: 17px;
    }
    .brand small { display: block; font-weight: 500; color: var(--muted); font-size: 11px; margin-top: 1px; }
    header .spacer { flex: 1; }
    .btn {
      font-family: var(--sans);
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 7px 12px;
      cursor: pointer;
      transition: opacity .15s, background .15s;
    }
    .btn:hover { opacity: .85; }
    .btn:active { opacity: .7; }
    .btn.primary { background: var(--tint-strong); border-color: transparent; color: #fff; }
    .btn.ghost { background: transparent; }
    .btn.danger { color: var(--danger); }

    /* Layout */
    main { flex: 1; display: flex; min-height: 0; }
    .editors { display: flex; flex-direction: column; width: 50%; min-width: 0; border-right: 1px solid var(--border); }
    .preview-wrap { width: 50%; min-width: 0; display: flex; flex-direction: column; background: #fff; }

    .pane { display: flex; flex-direction: column; flex: 1; min-height: 0; border-bottom: 1px solid var(--border); }
    .pane:last-child { border-bottom: 0; }
    .pane-head {
      display: flex; align-items: center; gap: 8px;
      padding: 6px 12px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      font-family: var(--mono);
      font-size: 12px;
      color: var(--muted);
      flex-shrink: 0;
    }
    .dot { width: 9px; height: 9px; border-radius: 50%; }
    .dot.html { background: var(--sand); }
    .dot.css { background: var(--tint); }
    .dot.js { background: var(--dot-js); }
    .pane-head .count { margin-left: auto; font-size: 11px; }

    .code-scroll { position: relative; flex: 1; min-height: 0; overflow: auto; background: var(--panel-2); }
    .code-inner { display: flex; min-height: 100%; }
    .gutter {
      user-select: none;
      text-align: right;
      padding: 10px 8px;
      font-family: var(--mono);
      font-size: 12.5px;
      line-height: 20px;
      color: var(--code-dim);
      background: var(--panel-2);
      border-right: 1px solid var(--border);
      white-space: pre;
    }
    textarea {
      flex: 1;
      border: 0;
      outline: none;
      resize: none;
      padding: 10px 12px;
      background: transparent;
      color: var(--text);
      font-family: var(--mono);
      font-size: 12.5px;
      line-height: 20px;
      white-space: pre;
      overflow: hidden;
      tab-size: 2;
    }
    textarea::placeholder { color: var(--code-dim); }

    .preview-head {
      display: flex; align-items: center; gap: 8px;
      padding: 6px 12px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      color: var(--muted);
      font-size: 12px;
      flex-shrink: 0;
    }
    .live { display: flex; align-items: center; gap: 6px; }
    .live::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--tint); }
    iframe { flex: 1; border: 0; width: 100%; background: #fff; }

    /* Responsive: stack on narrow screens */
    @media (max-width: 820px) {
      main { flex-direction: column; }
      .editors, .preview-wrap { width: 100%; }
      .editors { border-right: 0; border-bottom: 1px solid var(--border); }
      .brand small { display: none; }
    }
    @media (max-width: 640px) {
      header { flex-wrap: wrap; gap: 8px; padding: 10px 12px; }
      .btn { min-height: 44px; }
      .editors { height: 55vh; }                 /* typing space first, preview below */
      .preview-wrap { min-height: 45vh; }
      textarea { font-size: 16px !important; }   /* < 16px makes iOS zoom on focus */
    }

    .toast {
      position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%) translateY(20px);
      background: var(--tint-strong); color: #fff; padding: 8px 16px; border-radius: 999px;
      font-size: 13px; font-weight: 600; opacity: 0; pointer-events: none;
      transition: opacity .2s, transform .2s;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <span class="logo">⚓</span>
      <div>
        محرر الأكواد
        <small>Almuhallab Code Editor — offline &amp; instant</small>
      </div>
    </div>
    <span class="spacer"></span>
    <a class="btn ghost" href="index.html" style="text-decoration:none;display:inline-flex;align-items:center;">← المهلب كود</a>
    <a class="btn ghost" href="nokhatha.html" style="text-decoration:none;display:inline-flex;align-items:center;">⚓ النوخذة</a>
    <label class="btn ghost" style="display:flex;align-items:center;gap:6px;">
      <input id="autorun" type="checkbox" checked style="accent-color: var(--tint);" />
      Auto-run
    </label>
    <button class="btn" id="run">▶ Run</button>
    <button class="btn" id="copy">Copy HTML</button>
    <button class="btn" id="download">Download</button>
    <button class="btn danger ghost" id="reset">Reset</button>
  </header>

  <main>
    <div class="editors">
      <section class="pane">
        <div class="pane-head"><span class="dot html"></span> index.html <span class="count" id="count-html"></span></div>
        <div class="code-scroll">
          <div class="code-inner">
            <div class="gutter" id="gutter-html">1</div>
            <textarea id="html" spellcheck="false" autocapitalize="off" autocomplete="off" placeholder="Write HTML…"></textarea>
          </div>
        </div>
      </section>
      <section class="pane">
        <div class="pane-head"><span class="dot css"></span> style.css <span class="count" id="count-css"></span></div>
        <div class="code-scroll">
          <div class="code-inner">
            <div class="gutter" id="gutter-css">1</div>
            <textarea id="css" spellcheck="false" autocapitalize="off" autocomplete="off" placeholder="Write CSS…"></textarea>
          </div>
        </div>
      </section>
      <section class="pane">
        <div class="pane-head"><span class="dot js"></span> script.js <span class="count" id="count-js"></span></div>
        <div class="code-scroll">
          <div class="code-inner">
            <div class="gutter" id="gutter-js">1</div>
            <textarea id="js" spellcheck="false" autocapitalize="off" autocomplete="off" placeholder="Write JavaScript…"></textarea>
          </div>
        </div>
      </section>
    </div>

    <div class="preview-wrap">
      <div class="preview-head"><span class="live">Live preview</span></div>
      <iframe id="preview" title="Live preview" sandbox="allow-scripts allow-modals"></iframe>
    </div>
  </main>

  <div class="toast" id="toast"></div>

  <script>
    (function () {
      "use strict";

      var STORAGE_KEY = "almuhallab-code-v1";

      var starter = {
        html:
          '<div class="card">\n' +
          '  <h1>Yalla, wain nrooh? 🇰🇼</h1>\n' +
          '  <p>Edit the code — the preview updates live.</p>\n' +
          '  <button id="pick">Pick a spot</button>\n' +
          '  <p id="out"></p>\n' +
          '</div>',
        css:
          ':root { color-scheme: light; }\n' +
          'body { font-family: system-ui, sans-serif; display: grid; place-items: center;\n' +
          '  min-height: 100vh; margin: 0; background: #f1f5f9; }\n' +
          '.card { background: #fff; padding: 32px; border-radius: 16px; text-align: center;\n' +
          '  box-shadow: 0 10px 30px rgba(15,23,42,.12); max-width: 320px; }\n' +
          'h1 { margin: 0 0 8px; color: #8a5122; font-size: 22px; }\n' +
          'p { color: #64748b; }\n' +
          'button { margin-top: 8px; border: 0; border-radius: 10px; padding: 10px 18px;\n' +
          '  background: #8a5122; color: #fff; font-weight: 700; cursor: pointer; }',
        js:
          'const spots = ["Kuwait Towers", "Souq Mubarakiya", "Marina Beach", "Grand Mosque"];\n' +
          'document.getElementById("pick").addEventListener("click", () => {\n' +
          '  const s = spots[Math.floor(Math.random() * spots.length)];\n' +
          '  document.getElementById("out").textContent = "Go to: " + s;\n' +
          '});'
      };

      var els = {
        html: document.getElementById("html"),
        css: document.getElementById("css"),
        js: document.getElementById("js")
      };
      var gutters = {
        html: document.getElementById("gutter-html"),
        css: document.getElementById("gutter-css"),
        js: document.getElementById("gutter-js")
      };
      var counts = {
        html: document.getElementById("count-html"),
        css: document.getElementById("count-css"),
        js: document.getElementById("count-js")
      };
      var preview = document.getElementById("preview");
      var autorun = document.getElementById("autorun");
      var toastEl = document.getElementById("toast");
      var toastTimer;

      function toast(msg) {
        toastEl.textContent = msg;
        toastEl.classList.add("show");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function () { toastEl.classList.remove("show"); }, 1600);
      }

      function load() {
        var saved;
        try { saved = JSON.parse(localStorage.getItem(STORAGE_KEY)); } catch (e) { saved = null; }
        var data = saved || starter;
        els.html.value = data.html || "";
        els.css.value = data.css || "";
        els.js.value = data.js || "";
      }

      function save() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify({
            html: els.html.value, css: els.css.value, js: els.js.value
          }));
        } catch (e) { /* storage unavailable — ignore */ }
      }

      function updateMeta(key) {
        var value = els[key].value;
        var lines = value.split("\n");
        var nums = [];
        for (var i = 0; i < lines.length; i++) nums.push(i + 1);
        gutters[key].textContent = nums.join("\n");
        counts[key].textContent = lines.length + (lines.length === 1 ? " line" : " lines");
      }

      var errorHandler =
        'window.onerror=function(m,s,l,c,err){' +
        'var pre=document.createElement("pre");' +
        'pre.style.cssText="color:#b91c1c;font:12px/1.5 monospace;padding:12px;white-space:pre-wrap;margin:0";' +
        'pre.textContent=(err&&err.stack)?err.stack:(m+" (line "+l+")");' +
        'document.body.appendChild(pre);return true;};';

      function buildDoc() {
        return '<!doctype html><html><head><meta charset="utf-8">' +
          '<style>' + els.css.value + '</style></head><body>' +
          els.html.value +
          '<' + 'script>' + errorHandler + els.js.value + '<' + '/script>' +
          '</body></html>';
      }

      function run() {
        preview.srcdoc = buildDoc();
      }

      function onInput(key) {
        updateMeta(key);
        save();
        if (autorun.checked) run();
      }

      Object.keys(els).forEach(function (key) {
        els[key].addEventListener("input", function () { onInput(key); });
        // Sync gutter scroll with textarea scroll.
        els[key].closest(".code-scroll").addEventListener("scroll", function () {});
        // Tab inserts two spaces instead of moving focus.
        els[key].addEventListener("keydown", function (e) {
          if (e.key === "Tab") {
            e.preventDefault();
            var start = this.selectionStart, end = this.selectionEnd;
            this.value = this.value.slice(0, start) + "  " + this.value.slice(end);
            this.selectionStart = this.selectionEnd = start + 2;
            onInput(key);
          }
        });
      });

      document.getElementById("run").addEventListener("click", run);
      document.getElementById("reset").addEventListener("click", function () {
        if (!confirm("Reset all code to the starter example?")) return;
        els.html.value = starter.html;
        els.css.value = starter.css;
        els.js.value = starter.js;
        Object.keys(els).forEach(updateMeta);
        save();
        run();
        toast("Reset to starter");
      });
      document.getElementById("copy").addEventListener("click", function () {
        var doc = buildDoc();
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(doc).then(
            function () { toast("Copied full HTML"); },
            function () { toast("Copy failed"); }
          );
        } else {
          els.html.focus();
          toast("Clipboard unavailable");
        }
      });
      document.getElementById("download").addEventListener("click", function () {
        var blob = new Blob([buildDoc()], { type: "text/html" });
        var url = URL.createObjectURL(blob);
        var a = document.createElement("a");
        a.href = url; a.download = "almuhallab-export.html";
        document.body.appendChild(a); a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        toast("Downloaded HTML");
      });

      // Ctrl/Cmd+S saves + runs instead of the browser save dialog.
      document.addEventListener("keydown", function (e) {
        if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "s") {
          e.preventDefault();
          save(); run(); toast("Saved");
        }
      });

      load();
      Object.keys(els).forEach(updateMeta);
      run();
    })();
  </script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("sw.js").catch(function () { /* offline install unavailable */ });
      });
    }
  </script>
</body>
</html>
