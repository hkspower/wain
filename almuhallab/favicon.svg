<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Almuhallab Code favicon: the company's boum on the brand gradient tile,
       so a browser tab shows the company mark and not النوخذة's anchor.
       The glyph is the square form — the wide drawing (logo.svg, #i-boum)
       cropped to one hull, one stem, one mast and one lateen sail, at heavier
       weights, because 16px is this form's real working size and the wide
       mark's detail is gone long before it. Kept in step with #i-sail. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e3a556"/>
      <stop offset="1" stop-color="#6f3f1c"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#g)"/>
  <g transform="translate(64 64) scale(16)" fill="#ffffff">
  <path d="M2.4 13.4C3.9 14.6 5.3 15.3 6.9 15.6 10.6 16.3 14.6 16.2 18.4 15.3L20.5 10.4 21.75 10.95 19.6 16.2C17.6 19 14.2 20.2 10.6 20.3 7.3 20.4 5.3 19.5 4.3 17.9Z"/>
  <path fill="none" stroke="#ffffff" stroke-width="1.3" stroke-linecap="butt" d="M11.6 16.15 12.9 8.8"/>
  <path fill="none" stroke="#ffffff" stroke-width="0.8" stroke-linecap="round" d="M4.6 3.4 17.2 11.6"/>
  <path d="M4.6 3.4 17.2 11.6 6.2 13.6Z"/>
  </g>
</svg>
