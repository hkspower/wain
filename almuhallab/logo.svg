<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 24" role="img" aria-label="المهلب — Almuhallab">
  <!-- The Almuhallab mark, full form: the Kuwaiti boum at her real proportions —
       wide and low, which a square can only compress. Drawn 2026-08-09 from the
       photograph of the ship, at the owner's direction. Parts, stern to bow:
       the tall transom; the hull with its sweeping sheer, a rubbing strake
       above the deck line and a hawse hole aft (a true hole via evenodd, so it
       reads on any surface); two forward-raked masts with raked lateen yards —
       raked, never square across a mast, which would read as a cross; three
       stays; the pennant at the main truck; the long raked stem with its
       finial; the water she stands in. Stroke weights are a discipline, not a
       accident: masts 1.0/0.9, yards .62/.58, strake .5, stays .32.
       The square companion (favicon.svg, #i-sail) serves browser tabs and any
       square hole; this file is the mark everywhere width allows. -->
  <path fill="none" stroke="currentColor" stroke-width="0.32" stroke-linecap="round" d="M21.7 2.8 41.3 12.1M21.6 2.8 4.4 10.5M31.3 5.4 39.3 12.9"/><path fill="none" stroke="currentColor" stroke-width="1.0" stroke-linecap="round" d="M19.6 15.3 21.8 2.5"/><path fill="none" stroke="currentColor" stroke-width="0.9" stroke-linecap="round" d="M29.8 14.9 31.4 4.9"/><path fill="none" stroke="currentColor" stroke-width="0.62" stroke-linecap="round" d="M12.9 10.6 25.9 3.5"/><path fill="none" stroke="currentColor" stroke-width="0.58" stroke-linecap="round" d="M25.8 10.8 35.4 5.4"/><path fill="currentColor" stroke="none" d="M21.8 2.4 24.5 2.9 21.9 3.8Z"/><path fill="currentColor" stroke="none" d="M2.0 10.0 3.6 9.7 4.8 15.2 3.1 15.5Z"/><path fill="currentColor" stroke="none" d="M38.6 14.6 44.6 6.2 45.6 6.9 40.0 15.0Z"/><circle fill="currentColor" stroke="none" cx="45.2" cy="6.1" r="0.75"/><path fill="none" stroke="currentColor" stroke-width="0.5" stroke-linecap="round" d="M5.0 13.1C14 15.3 28 15.4 38.8 12.9"/><path fill="currentColor" stroke="none" fill-rule="evenodd" d="M3.6 13.75C14 16 28 16 38.8 13.6L40.5 13.4C40 18.5 34 20.8 26 21.2 16 21.6 8 20.2 4.6 17.4Z M8.2 16.4A0.9 0.9 0 1 0 8.2 18.2 0.9 0.9 0 1 0 8.2 16.4Z"/><path fill="none" stroke="currentColor" stroke-width="0.55" stroke-linecap="round" d="M6.8 22.8C16 23.4 30 23.4 40.6 22.6"/>
