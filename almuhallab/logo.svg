<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" role="img" aria-label="المهلب — Almuhallab">
  <!-- The Almuhallab mark: a dhow's lateen sail over the water — the company's
       own mark, redrawn at the owner's request (2026-08) on a 24 grid with a
       2-unit optical margin. The yard runs straight from peak to tack, the
       leech falls in a long curve, and the foot arches up against the hull's
       belly so the two shapes leave a clean crescent of white between them and
       stay separate down to 16px. The hull's bow lifts to the right, which is
       what tells a boat from a smile. Two filled paths taking the brand brown
       from currentColor, so one drawing serves any surface. -->
  <path fill="currentColor" d="M20.4 2.4C21.08 1.9 21.95 2.5 21.7 3.3 20.75 6.8 19.5 10.2 17.95 13.45 17.75 13.87 17.35 14.1 16.9 14.1 12.5 13.5 8.2 13.6 4.35 14.35 3.45 14.35 3.2 13.2 3.83 12.65Z"/>
  <path fill="currentColor" d="M2.9 16.55C8.9 17.95 15.05 17.6 21.05 15.5 21.65 15.28 22.15 15.9 21.85 16.43 19.85 19.75 16.4 21.6 12.05 21.6 7.6 21.6 4.1 19.65 2.2 16.25 2.05 16.05 2.45 16.2 2.9 16.55Z"/>
</svg>
