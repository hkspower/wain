<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" role="img" aria-label="المهلب — Almuhallab">
  <!-- The Almuhallab mark: a Kuwaiti boum under way. Redrawn 2026-08-09 at the
       owner's direction, from a photograph of the real ship: the long hull with
       its sweeping sheer, the tall transom aft, the raked stem forward, two
       forward-raked masts, their lateen yards, and a pennant at the main truck.
       The yards are raked, never square across the mast — square ones read as a
       cross, which this mark must never do. Brand brown from currentColor. -->
  <path fill="none" stroke="currentColor" stroke-width="0.95" stroke-linecap="round" d="M9.7 15.4 11.0 3.2"/>
  <path fill="none" stroke="currentColor" stroke-width="0.9" stroke-linecap="round" d="M15.0 15.2 16.0 5.4"/>
  <path fill="none" stroke="currentColor" stroke-width="0.6" stroke-linecap="round" d="M7.4 9.6 13.3 3.9M12.9 10.4 17.9 5.6"/>
  <path fill="currentColor" d="M11.0 3.1 13.3 3.6 11.05 4.6Z"/>
  <path fill="currentColor" d="M2.45 14.8 1.85 10.9 3.45 10.7 4.0 14.6Z"/>
  <path fill="currentColor" d="M19.8 14.6 21.75 9.75 22.45 10.15 20.65 14.9Z"/>
  <path fill="currentColor" d="M2.5 14.4C8.6 16.15 15.0 15.95 20.5 14.05 20.15 16.3 19.0 18.0 17.1 19.0 14.8 20.15 12.0 20.5 9.4 20.5 6.6 20.5 4.3 19.65 3.05 18.15 2.4 17.3 2.2 15.3 2.5 14.4Z"/>
