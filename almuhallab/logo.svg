<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" role="img" aria-label="المهلب — Almuhallab">
  <!-- The Almuhallab mark: a dhow's lateen sail over the water. Redrawn 2026-08-09
       at the owner's ask for more of the real boat in it — four parts now, not two:
       the sail, the lateen YARD laid over its luff and protruding past the peak the
       way the real spar does, the MAST showing through the gap between foot and
       deck, and the hull with its STEM POST rising at the bow. The yard overlaps
       the luff rather than sitting beside it: a hairline gap there closes up at
       small sizes and reads as a scratch. Brand brown from currentColor. -->
