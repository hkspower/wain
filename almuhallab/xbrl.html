<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data:; font-src 'self'; base-uri 'none'; form-action 'none'; upgrade-insecure-requests" />
  <meta name="referrer" content="no-referrer" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta http-equiv="refresh" content="0; url=nizam.html#/xbrl" />
  <link rel="canonical" href="nizam.html#/xbrl" />
  <meta name="robots" content="noindex" />
  <title>XBRL — التقارير المالية — النوخذة</title>
  <style>
    /* Tajawal (SIL OFL) — bundled, never fetched from a CDN: the strict CSP
       forbids external origins, and a self-hosted face renders identically on
       every device instead of depending on what the OS happens to have.
       Arabic subset only; Latin and digits stay on the system face. */
    @font-face { font-family:"Tajawal"; font-style:normal; font-weight:400;
      font-display:swap; src:url("fonts/tajawal-400.woff2") format("woff2"); }
    @font-face { font-family:"Tajawal"; font-style:normal; font-weight:500;
      font-display:swap; src:url("fonts/tajawal-500.woff2") format("woff2"); }
    @font-face { font-family:"Tajawal"; font-style:normal; font-weight:600;
      font-display:swap; src:url("fonts/tajawal-500.woff2") format("woff2"); }
    @font-face { font-family:"Tajawal"; font-style:normal; font-weight:700;
      font-display:swap; src:url("fonts/tajawal-700.woff2") format("woff2"); }
    @font-face { font-family:"Tajawal"; font-style:normal; font-weight:800;
      font-display:swap; src:url("fonts/tajawal-800.woff2") format("woff2"); }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: #ffffff; color: #1b2430; text-align: center;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Kufi Arabic", sans-serif;
    }
    a { color: #7a4418; font-weight: 700; }
    h1 { font-size: 16px; font-weight: 500; line-height: 2; }
  </style>
<script>
  /* Scheme upgrade. "Enforce HTTPS" is a GitHub Pages repository setting and
     only that setting can 301 a plaintext request — a static file cannot send
     a redirect. So if a visitor arrives over http:// (typed it, followed an
     old link, or the setting is off), leave immediately for https. This runs
     before anything else on the page, and it cannot protect the first request
     itself; it stops every request after it. localhost is exempt so the test
     suite, which serves over http, is not sent somewhere that does not exist. */
  (function () {
    var h = location.hostname;
    if (location.protocol !== "http:") return;
    if (h === "localhost" || h === "127.0.0.1" || h === "[::1]") return;
    location.replace("https:" + location.href.slice(location.protocol.length));
  })();
</script>
</head>
<body>
  <!-- XBRL — التقارير المالية is now a tab of the unified system (nizam.html). One implementation,
       one data core; this stub keeps old links and bookmarks working. -->
  <h1>⚓ جارٍ التحويل إلى النظام الموحد…<br /><a href="nizam.html#/xbrl">اضغط هنا إذا لم يتم التحويل</a></h1>
  <script>location.replace("nizam.html#/xbrl");</script>
</body>
</html>
