<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'; upgrade-insecure-requests" />
<meta name="referrer" content="no-referrer" />
<!-- One page, one indexable address: this is an entry point, not a copy. -->
<meta name="robots" content="noindex, follow" />
<link rel="canonical" href="https://www.almuhallab-code.com/safi.html" />
<title>صافي — المهلب كود</title>
<!-- The extensionless address. `/‍safi` is a RewriteRule in .htaccess, which
     GitHub Pages ignores, so on that host the clean URL only exists because
     this directory does. The fragment is the reason this is a script and not
     only a <meta refresh>: a fragment never reaches the server and a refresh
     drops it, so /safi#/safi would land on the wrong tab. -->
<meta http-equiv="refresh" content="0; url=../safi.html" />
<script>
  location.replace("../safi.html" + location.search + location.hash);
</script>
</head>
<body>
  <p><a href="../safi.html">صافي — المهلب كود</a></p>
</body>
</html>
