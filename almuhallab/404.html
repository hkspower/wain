  <style>
    /* IBM Plex Sans Arabic — bundled, not fetched from a CDN: the strict CSP
       forbids external origins, and a self-hosted face renders identically on
       every device instead of depending on what the OS happens to have.
       Arabic subset only; Latin and digits stay on the system face. */
    @font-face {
      font-family: "Plex Arabic"; font-style: normal; font-weight: 400;
      font-display: swap; src: url("fonts/plex-arabic-400.woff2") format("woff2");
    }
    @font-face {
      font-family: "Plex Arabic"; font-style: normal; font-weight: 600;
      font-display: swap; src: url("fonts/plex-arabic-600.woff2") format("woff2");
    }
    @font-face {
      font-family: "Plex Arabic"; font-style: normal; font-weight: 700;
      font-display: swap; src: url("fonts/plex-arabic-700.woff2") format("woff2");
    }

    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: #0b1220; color: #e6edf6; text-align: center;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Kufi Arabic", sans-serif;
    }
    a { color: #dba97f; font-weight: 700; }
  </style>
</head>
