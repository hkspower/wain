# Q Arena web game, served at https://quiz.almuhallab-code.com through Traefik.
# The container downloads the single-file game from a commit-pinned GitHub URL when it starts.
# To ship a new version: build with `python3 -I src/build.py`, commit, push, then change the SHA below.
services:
  quiz:
    image: nginx:alpine
    container_name: quiz-clash-arena
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        wget -qO /usr/share/nginx/html/index.html https://raw.githubusercontent.com/hkspower/wain/9ed894211e9255cdaf337c4be9d036a22f55cb21/quiz-clash-arena/index.html && exec nginx -g 'daemon off;'
    labels:
      - traefik.enable=true
      - traefik.http.routers.quiz.rule=Host(`quiz.almuhallab-code.com`)
      - traefik.http.routers.quiz.entrypoints=websecure
      - traefik.http.routers.quiz.tls.certresolver=letsencrypt
      - traefik.http.services.quiz.loadbalancer.server.port=80
