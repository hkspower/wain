# Quiz Clash Arena: static site served by nginx.
# Run from this folder on the VPS:  docker compose up -d
services:
  quiz:
    image: nginx:alpine
    container_name: quiz-clash-arena
    restart: unless-stopped
    volumes:
      - ../index.html:/usr/share/nginx/html/index.html:ro
    # Option A (no domain): reachable at http://187.7.78.123:8080
    ports:
      - "8080:80"
    # Option B (domain through Traefik): remove "ports" above, uncomment the
    # block below, set your domain, and check the network name with:
    #   docker network ls
    # labels:
    #   - traefik.enable=true
    #   - traefik.http.routers.quiz.rule=Host(`quiz.YOURDOMAIN.com`)
    #   - traefik.http.routers.quiz.entrypoints=websecure
    #   - traefik.http.routers.quiz.tls.certresolver=letsencrypt
    #   - traefik.http.services.quiz.loadbalancer.server.port=80
    # networks: [traefik]
# networks:
#   traefik:
#     external: true
