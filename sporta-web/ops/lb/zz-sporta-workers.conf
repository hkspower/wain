# NOT APPLIED. Mounted read-only into each web container as /etc/apache2/conf-enabled/zz-sporta-workers.conf (see sporta.hardening.override.yml).
#
# conf-enabled/ is read AFTER mods-enabled/, so this overrides the image's own mpm_prefork.conf (MaxRequestWorkers 150) without editing it.
# Two containers at 75 each keep the SAME ceiling the single container has today (150 simultaneous requests, so at most 150 database connections,
# one per request: store_db() opens its own), instead of doubling it to 300 against a MariaDB whose max_connections was not measured.
# Raise it only after scripts/db-pool-probe.mjs has shown Max_used_connections far below max_connections.
<IfModule mpm_prefork_module>
    MaxRequestWorkers 75
</IfModule>
