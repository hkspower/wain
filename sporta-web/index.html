<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <!-- The tab icon is 16-32px, and this used to point at a 512x512 PNG —
         29 kB fetched on every page load, more than any category banner now
         costs and 18% of a phone's whole image budget. Declaring the sizes lets
         the browser take the 32px file for the tab and leave the big ones for
         the install prompt, which is what they are for.
         (A favicon.svg also sat here unreferenced, drawn as a teal-green Arial
         "S" from some template — the wrong mark in the wrong colour. Deleted.) -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <!-- viewport-fit=cover lets the page paint under the Dynamic Island and the
         home-indicator bar on modern phones; the layout then pulls itself back
         out of those zones with env(safe-area-inset-*). Without cover, the
         insets all report 0 and none of that CSS does anything. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <!-- Primary meta -->
    <title>Sporta — Sports &amp; Fitness Store in Kuwait | سبورتا</title>
    <meta
      name="description"
      content="Sporta (سبورتا) is a Kuwait sportswear store — activewear, gym clothing, hoodies, caps, and sports accessories from brands like Gymshark, RHEO &amp; more. Fast delivery, free returns, KNET checkout. Arabic &amp; English."
    />
    <meta name="keywords" content="Sporta, سبورتا, sportswear Kuwait, activewear Kuwait, gym clothes Kuwait, fitness apparel, hoodies Kuwait, gym accessories, Gymshark Kuwait, RHEO, Vanquish, sportswear GCC, activewear Middle East, ملابس رياضية الكويت, ملابس جيم, ملابس رياضية نسائية, ملابس رياضية رجالية, هوديز, إكسسوارات رياضية, تسوق اونلاين الكويت, كي نت, ملابس رياضية الخليج, KNET, الكويت" />
    <meta name="author" content="Sporta" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <!-- Colours the phone's status/URL bar. It has to match the sticky header
         (charcoal), not the brand orange — with viewport-fit=cover the header
         now runs right up under the status bar, and an orange strip above a
         charcoal header is a visible seam. -->
    <meta name="theme-color" content="#171A1E" />

    <!-- Add to Home Screen -->
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Sporta" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="canonical" href="https://www.sporta.com.kw/" />

    <!-- Geo targeting — Kuwait -->
    <meta name="geo.region" content="KW" />
    <meta name="geo.placename" content="Kuwait City" />
    <meta name="geo.position" content="29.3759;47.9774" />
    <meta name="ICBM" content="29.3759, 47.9774" />

    <!-- Language alternates (bilingual site) -->
    <link rel="alternate" hreflang="en" href="https://www.sporta.com.kw/" />
    <link rel="alternate" hreflang="ar" href="https://www.sporta.com.kw/" />
    <link rel="alternate" hreflang="x-default" href="https://www.sporta.com.kw/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Sporta" />
    <meta property="og:title" content="Sporta — Sports &amp; Fitness Store in Kuwait" />
    <meta property="og:description" content="Kuwait's destination for sports and fitness gear. Shop online in Arabic &amp; English with KNET checkout." />
    <meta property="og:url" content="https://www.sporta.com.kw/" />
    <meta property="og:image" content="https://www.sporta.com.kw/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="ar_AR" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Sporta — Sports &amp; Fitness Store in Kuwait" />
    <meta name="twitter:description" content="Kuwait's destination for sports and fitness gear. Arabic &amp; English, KNET checkout." />
    <meta name="twitter:image" content="https://www.sporta.com.kw/og-image.png" />

    <!-- Structured data for search + AI engines -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "OnlineStore",
          "@id": "https://www.sporta.com.kw/#store",
          "name": "Sporta",
          "alternateName": "سبورتا",
          "url": "https://www.sporta.com.kw/",
          "logo": "https://www.sporta.com.kw/logo.png",
          "image": "https://www.sporta.com.kw/og-image.png",
          "email": "cs@sporta.com.kw",
          "telephone": "+965-22091914",
          "description": "Sporta is a Kuwait sportswear store — activewear, gym clothing, hoodies, caps, and sports accessories from brands like Gymshark, RHEO and its own SPORTA label. Fast delivery, free exchange/return, bilingual Arabic/English with KNET payment.",
          "currenciesAccepted": "KWD",
          "paymentAccepted": "KNET, Visa, Mastercard",
          "priceRange": "KWD 3.500 - KWD 24.000",
          "areaServed": { "@type": "Country", "name": "Kuwait" },
          "address": { "@type": "PostalAddress", "addressCountry": "KW", "addressLocality": "Kuwait City" },
          "contactPoint": {
            "@type": "ContactPoint",
            "contactType": "customer service",
            "telephone": "+965-22091914",
            "email": "cs@sporta.com.kw",
            "availableLanguage": ["Arabic", "English"],
            "areaServed": "KW"
          },
          "brand": [
            { "@type": "Brand", "name": "SPORTA" },
            { "@type": "Brand", "name": "RHEO" },
            { "@type": "Brand", "name": "Vanquish" },
            { "@type": "Brand", "name": "ATE" },
            { "@type": "Brand", "name": "Gymshark" },
            { "@type": "Brand", "name": "Eyesportwear" }
          ],
          "knowsLanguage": ["ar", "en"],
          "sameAs": [
            "https://www.instagram.com/sporta.kw",
            "https://www.tiktok.com/@sporta.kw"
          ]
        },
        {
          "@type": "WebSite",
          "@id": "https://www.sporta.com.kw/#website",
          "url": "https://www.sporta.com.kw/",
          "name": "Sporta",
          "inLanguage": ["en", "ar"],
          "publisher": { "@id": "https://www.sporta.com.kw/#store" },
          "potentialAction": {
            "@type": "SearchAction",
            "target": "https://www.sporta.com.kw/shop?q={search_term_string}",
            "query-input": "required name=search_term_string"
          }
        }
      ]
    }
    </script>

    <!-- Site configuration, editable on the server without a rebuild.
         In <head> and classic (not a module) so it has definitely run before
         the app bundle: classic scripts execute at parse time, module scripts
         only after parsing finishes. -->
    <script src="/config.js"></script>

    <!-- Fonts are self-hosted; the @font-face rules live in the app stylesheet
         under styles/. The Google Fonts
         stylesheet used to sit here, which cost a DNS lookup, a TLS handshake
         and a render-blocking round trip to a third party before any heading
         could paint. These two preloads are the faces above the fold — the
         display weight for headings and the UI regular — so they start
         downloading with the HTML instead of after the CSS parses. The rest
         load on demand via unicode-range. -->
    <link rel="preload" as="font" type="font/woff2" crossorigin
          href="/fonts/alexandria-var-latin.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin
          href="/fonts/plex-400-latin.woff2" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
