         the browser take the 32px file for the tab and leave the big ones for
         the install prompt, which is what they are for.
         (A favicon.svg also sat here unreferenced, drawn as a teal-green Arial

    <!-- Site configuration, editable on the server without a rebuild.
         In <head> and classic (not a module) so it has definitely run before
         the app bundle: classic scripts execute at parse time, module scripts
         only after parsing finishes. -->
    <!-- Language and direction, BEFORE the first paint.
         ==========================================================
         Measured on a phone at 390pt: an Arabic visitor's CLS was 0.4448
         against 0.0058 in English — "poor" by a wide margin, and it hit the
         half of the customers this shop is built for first. One shift of 0.4128
         accounted for nearly all of it: this file is served with dir="ltr", and
         LanguageContext only switched it after React hydrated, so the whole
         page flipped from left-to-right to right-to-left in front of the reader.
         It also meant Arabic pulled EIGHT font files instead of four, because
         the Latin subsets were requested for the first render and the Arabic
         ones for the second.

         Reading the same localStorage key React reads, here, costs nothing and
         removes both problems. Wrapped in try/catch because localStorage throws
         in some privacy modes, and the fallback is exactly today's behaviour.

         The theme is set here too, for the same reason — see below.

         The two font files for that language are preloaded in the same breath.
         Without it they are discovered only after the stylesheet is parsed,
         which is one round trip later than it needs to be — and preloading the
         WRONG language's fonts would be worse than not preloading, which is why
         this could not be two static <link> tags. -->
    <script>
      (function () {
        try {
          var el = document.documentElement
          // THE LANGUAGE DECISION, MADE ONCE, HERE.
          //
          // It has to be synchronous: it sets <html dir>, which decides the
          // whole page layout, and it picks which font files to preload below.
          // Anything asynchronous — an IP lookup especially — can only land
          // after the first paint, so every Gulf visitor would watch an
          // English left-to-right page flip to Arabic right-to-left.
          //
          // Order: an explicit saved choice, then ?lang=, then the device's
          // languages, then its time zone. The reasoning for each, and why the
          // time zone stands in for "Middle East IP", is in the app module
          // i18n/detectLang.js — this is the same rule, inlined, because
          // it must run before any module loads. KEEP THE TWO IN STEP; there
          // is a test that asserts they agree.
          var saved = localStorage.getItem('lang')
          var lang = saved === 'ar' || saved === 'en' ? saved : null
          if (!lang) {
            var q = /[?&]lang=([A-Za-z-]{2,10})/.exec(location.search)
            if (q) {
              var tag = q[1].toLowerCase().split('-')[0]
              if (tag === 'ar' || tag === 'en') lang = tag
            }
          }
          // THE PHONE DECIDES. A language list is a setting a person chose;
          // a time zone is a guess about where they are. If the device says
          // anything at all, that is the answer and the zone is not consulted.
          if (!lang) {
            var langs = navigator.languages || []
            if (!langs.length && navigator.language) langs = [navigator.language]
            if (langs.length) {
              lang = 'en'
              for (var i = 0; i < langs.length; i++) {
                if (/^(ar|arz|ary|acm|apc|ajp|afb)\b|^ar-/i.test(langs[i] || '')) { lang = 'ar'; break }
              }
            }
          }
          // Only reached when the device reported no languages at all.
          if (!lang) {
            var tz = ''
            try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone || '' } catch (e2) {}
            // The Arabic-speaking time zones. Not "the Middle East": Tehran,
            // Istanbul and Jerusalem are in the region and are not Arabic, so
            // defaulting them to Arabic would be worse than English.
            if (/^(Asia\/(Kuwait|Riyadh|Dubai|Qatar|Bahrain|Muscat|Aden|Baghdad|Amman|Beirut|Damascus|Hebron|Gaza|Riyadh8[789])|Africa\/(Cairo|Tripoli|Tunis|Algiers|Casablanca|El_Aaiun|Khartoum|Juba|Nouakchott|Mogadishu|Djibouti))$/.test(tz)) {
              lang = 'ar'
            }
          }
          var ar = lang === 'ar'
          // NOT written back to localStorage. That key means "the visitor
          // chose this", and detection is not a choice — persisting it would
          // freeze a traveller into whichever language they first arrived in
          // and make the toggle the only way out.
          window.__SPORTA_LANG = ar ? 'ar' : 'en'
          el.lang = ar ? 'ar' : 'en'
          el.dir = ar ? 'rtl' : 'ltr'
          // Theme, for the same reason and with the same measurement behind it:
          // ThemeProvider sets data-theme in an effect after hydration, so a
          // dark-mode visitor got data-theme="(none)" at the first frame and at
          // DOMContentLoaded, and a flash of the beige light theme on every
          // single page load. Reading the saved choice — or the OS preference
          // when there is none — costs nothing here.
          var t = localStorage.getItem('sporta_theme')
          if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          el.dataset.theme = t
          el.style.colorScheme = t
          // THE HERO'S HEIGHT, BEFORE THE FIRST PAINT.
          //
          // The height is an owner setting that arrives with /api?r=slides —
          // i.e. AFTER the page has painted. Applying it on arrival resized
          // the hero and pushed the whole page down: measured 0.042 of layout
          // shift, all of it from one jump at 3.3s, and it is the single
          // largest CLS contributor on the site.
          //
          // So the last known value is cached and read here, the same way the
          // theme is two lines above. A visitor gets the right height from the
          // first frame; a change by the owner is picked up on the next load
          // rather than by moving the page under whoever is reading it.
          var HERO_H = { short: ['400px','460px'], tall: ['540px','640px'], full: ['85svh','90svh'] }
          var h = HERO_H[localStorage.getItem('sporta_hero_size')] || HERO_H.tall
          el.style.setProperty('--hero-h', h[0])
          el.style.setProperty('--hero-h-md', h[1])

          // THE HERO BANNER, requested here rather than in the markup above.
          //
          // It is the LCP element of the home page, and React does not ask for
          // it until it has parsed, run and mounted. But which file it is
          // depends on two things this script is the first to know: the
          // language (the headline is set INSIDE the picture, so there is an
          // -en and an -ar) and the viewport (a 2.53:1 desktop banner and a
          // 0.75:1 phone one). Two static <link rel=preload> tags would
          // download both languages; matchMedia and the resolved language pick
          // exactly one.
          //
          // Only on the home page. Every other route would be preloading an
          // image it never shows.
          if (location.pathname === '/' || location.pathname === '/index.html') {
            var dev = matchMedia('(min-width: 768px)').matches ? 'desktop' : 'mobile'
            var b = document.createElement('link')
            b.rel = 'preload'
            b.as = 'image'
            // Slide 1 only. Slides 2 and 3 are off-screen and lazy; preloading
            // them would triple the hero's cost for two pictures most visitors
            // never swipe to. `-rtl` is a different COMPOSITION, not a mirror,
            // so Arabic wants its own file — and if the server has no -rtl the
            // slide falls back to the base one on error, which costs a second
            // request only in that case.
            b.href = '/hero/' + dev + '/strength' + (ar ? '-rtl' : '') + '.webp'
            b.setAttribute('fetchpriority', 'high')
            document.head.appendChild(b)
          }

          var sub = ar ? 'arabic' : 'latin'
          ;['alexandria-var-' + sub, 'plex-400-' + sub].forEach(function (f) {
            var k = document.createElement('link')
            k.rel = 'preload'
            k.as = 'font'
            k.type = 'font/woff2'
            k.crossOrigin = 'anonymous'
            k.href = '/fonts/' + f + '.woff2'
            document.head.appendChild(k)
          })
        } catch (e) {}
      })()
    </script>

    <!-- defer, so this does not block the parser.
         As a plain blocking script it serialised the critical path: HTML ->
         config.js (no-cache, so always a real round trip) -> stylesheet and font
         preloads. Deferred, it still runs before main.jsx — a deferred classic
         script and a module script both execute in document order after parsing
         — so window.SPORTA_CONFIG is set before anything reads it, and the CSS
         is discovered a round trip sooner. -->
    <script src="/config.js" defer></script>

    <!-- Fonts are self-hosted; the @font-face rules live in the app stylesheet
         under styles/. The Google Fonts
         stylesheet used to sit here, which cost a DNS lookup, a TLS handshake
         and a render-blocking round trip to a third party before any heading
         could paint. These two preloads are the faces above the fold — the
         display weight for headings and the UI regular — so they start
         downloading with the HTML instead of after the CSS parses. The rest
         load on demand via unicode-range. -->
    <link rel="preload" as="image" href="/logo-white.webp" fetchpriority="high" />
    <!-- The hero banner is preloaded by the boot script below, NOT here, and
         the 29 kB /favicon.png preload that used to sit on this line is gone.
         Both for the same reason: the home page's largest element changed.

         It used to be the S mark, because the hero was a drawn scene with the
         mark in the middle of it. The hero is now a photograph, so the mark is
         no longer above the fold on the home page at all — preloading it was
         29 kB of a file the page had stopped asking for.

         The banner cannot be preloaded from static markup because WHICH file
         it is depends on the language, and the language is not known until the
         boot script has run. Two static preloads would download both. -->
    <link rel="preload" as="font" type="font/woff2" crossorigin
          href="/fonts/alexandria-var-latin.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin
          href="/fonts/plex-400-latin.woff2" />
    <!-- Critical CSS for the first paint, inlined so the shell below does not
         wait on the stylesheet (which lands ~1.5s later on a throttled phone).
         Nothing here is a duplicate of the design system: these are four boxes
         and two brand colours, and they exist only until React mounts. -->
    <style>
      html { background: #171a1e }
      /* The root type size, duplicated from index.css for the same reason
         body{margin:0} is below: the stylesheet does not block the paint, so
         anything NOT here is at the browser's default until it lands — and
         the root size multiplies every rem in the design. */
      html { font-size: clamp(16px, 15.5px + 0.104vw, 17px) }
      /* The stylesheet no longer blocks the paint, so the browser's OWN
         defaults are in force for the first ~1.5s — including body{margin:8px},
         which shifted the whole shell sideways and down when the reset landed.
         Measured: 0.0095 of layout shift, entirely from this. */
      body { margin: 0 }
      .boot { min-height: 100vh }
      .boot-bar  { height: 28px; background: #e0561c }
      /* 57px logo bar + 48px nav = the header's real height, so the sticky
         header does not push the hero down when it arrives. */
      .boot-head { height: 105px; background: #171a1e;
                   display: flex; align-items: flex-start; justify-content: center }
      /* 8px top = the real logo bar's padding, so the mark does not move. */
      .boot-head img { height: 32px; width: auto; margin-top: 12px }
      /* --hero-h is set by the script below, from the size the owner chose,
         BEFORE anything paints. The skeleton and the real hero read the same
         variable, so the real one drops into exactly this box. */
      .boot-hero { height: var(--hero-h, 540px); background: #171a1e }
      /* Only ever seen when the shell has become permanent — see the note by
         the <noscript> below. Plain, centred, no dependency on the stylesheet
         that also did not load. */
      .boot-msg { position: absolute; inset: 133px 0 auto; padding: 48px 24px;
                  text-align: center; color: #e2dbce; font: 16px/1.6 system-ui, sans-serif }
      .boot-msg code { display: block; margin-top: 16px; font-size: 12px;
                       color: #8a8a8a; word-break: break-all }
      @media (min-width: 768px) { .boot-hero { height: var(--hero-h-md, 640px) } }
    </style>
  </head>
  <body>
    <!-- ================================================================
         THE FIRST PAINT.
         =================================================================
         This is a SPA: nothing appears until ~260 kB of JavaScript has been
         fetched, parsed and executed. Measured on a mid-range phone (4x CPU
         throttle, 1.6 Mbps), that was 3.4 SECONDS of white screen — the
         react-vendor chunk alone takes 2.4s to arrive, and the paint waits
         on it.

         So the shell paints WITHOUT JavaScript. The markup below is the
         header bar and the hero box at their real sizes and real colours,
         styled by the handful of inlined rules above rather than by the
         77 kB stylesheet, so it appears as soon as the HTML is parsed.
         React replaces it on mount (createRoot clears the container).

         Deliberately NO TEXT in it. Copy here would be a second, untranslated
         copy of strings that live in the i18n files, and it would be wrong for
         half the visitors before it was ever wrong for the other half. Shape
         and colour carry the whole job: the page stops being blank, and
         because the boxes are already the right height, the real content
         drops into place without moving anything — this LOWERS layout shift
         rather than trading it for speed. -->
    <div id="root">
      <div class="boot" aria-hidden="true">
        <div class="boot-bar"></div>
        <div class="boot-head">
          <!-- The real header logo, at the size the real header uses. An image
               is CONTENTFUL where a coloured box is not, so this is what lets
               First Contentful Paint happen with the shell rather than 1.3s
               later with React — and it is not a placeholder, it is the same
               mark, in the same place, that replaces it. -->
          <img src="/logo-white.webp" alt="" width="132" height="41" fetchpriority="high" />
        </div>
        <div class="boot-hero"></div>
      </div>
    </div>
    <!-- WHAT THE SHELL SAYS WHEN IT IS NOT A SHELL ANY MORE.
         =================================================================
         Everything above is a placeholder React clears on mount. That is
         true for about 400ms — and if the bundle never arrives it is not
         true at all: the shell becomes the whole site, permanently, and a
         visitor gets an orange bar, a logo, and nothing else, forever. It
         does not look broken. It looks like a shop with nothing in it.

         So the shell is given a terminal state. This is the ONE place the
         "no text in the shell" rule is relaxed, and only for text that
         cannot exist in i18n: the i18n strings live in the bundle that, by
         the time anyone reads this, did not load. -->
    <noscript>
      <div class="boot-msg">
        <p>This shop needs JavaScript. Please enable it and reload.</p>
        <p dir="rtl" lang="ar">يحتاج هذا المتجر إلى جافاسكربت. فعّلها ثم أعد التحميل.</p>
      </div>
    </noscript>
    <script>
      // JavaScript ran but the app never mounted — a different failure from
      // the one above, and by far the more likely one: index.html and
      // assets/ disagreeing after a partial upload, so the module 404s.
      //
      // Ten seconds, because the budget suite measures LCP under 2s on a
      // throttled phone and a false alarm here would be its own bug. Paused
      // tabs are skipped: background timers are throttled, so a tab restored
      // after a minute would accuse a perfectly good server.
      (function () {
        var failed = ''
        addEventListener('error', function (e) {
          var t = e.target
          if (t && (t.src || t.href)) failed = t.src || t.href
        }, true)
        setTimeout(function () {
          if (window.__SPORTA_MOUNTED || document.visibilityState !== 'visible') return
          var ar = window.__SPORTA_LANG === 'ar'
          var d = document.createElement('div')
          d.className = 'boot-msg'
          d.setAttribute('dir', ar ? 'rtl' : 'ltr')
          d.innerHTML =
            '<p>' + (ar ? 'لم تكتمل عملية تحميل الصفحة.' : 'This page did not finish loading.') + '</p>' +
            '<p>' + (ar ? 'حدّث الصفحة. إذا تكرر ذلك، فقد تكون ملفات الموقع غير مرفوعة بالكامل.'
                        : 'Refresh the page. If it keeps happening, the site\'s files are probably not all on the server.') + '</p>' +
            (failed ? '<code>' + failed.replace(/[<&]/g, '') + '</code>' : '')
          document.getElementById('root').appendChild(d)
        }, 10000)
      })()
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
