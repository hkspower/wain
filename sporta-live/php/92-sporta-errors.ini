; Sporta — production error handling. Without this the web SAPI runs on PHP
; defaults (no php.ini): display_errors=1 prints file paths to visitors,
; log_errors=0 keeps nothing, expose_php=1 adds X-Powered-By.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr
expose_php = Off
