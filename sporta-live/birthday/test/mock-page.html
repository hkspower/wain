<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"></head><body><div id="root"></div>
<script>
window.calls=[]; window.saved=null;
window.fetch=function(url,opt){ calls.push([opt.method,url,opt.body||'',opt.headers['X-Sporta-Customer']||'']);
  var signed = window.signedIn;
  var body = !signed ? {error:'not_authenticated'} : (opt.method==='POST' ? (saved=JSON.parse(opt.body).birthday||null, {birthday:saved,gift:{percent:10,days:14}}) : {birthday:saved,gift:{percent:10,days:14}});
  return Promise.resolve({ok:!!signed,status:signed?200:401,json:function(){return Promise.resolve(body)}}); };
window.showSignup=function(){ document.getElementById('root').innerHTML='<form id="f"><div class="customer-account__field"><label>Name</label><input id="customer-name"></div><div class="customer-account__field"><input id="customer-email"></div><button>Create</button></form>';
  if(!window.rootWired){window.rootWired=1; document.getElementById('root').addEventListener('submit',function(e){e.preventDefault(); window.reactSubmitted=(window.reactSubmitted||0)+1;});} };
window.showDash=function(){ document.getElementById('root').innerHTML='<div class="account-dashboard"><section class="account-dashboard__panel"><input id="customer-profile-name"></section><section class="account-dashboard__panel">orders</section></div>'; };
</script><script src="../birthday.js"></script></body></html>
