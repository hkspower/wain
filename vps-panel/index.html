<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>لوحة الخوادم</title>
<style>
  :root { --bg:#f7f6f2; --card:#fff; --ink:#1d2326; --muted:#6b7478; --ok:#1f7a4d; --warn:#a86a00; --bad:#b3261e; --line:#e2e0da; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg:#15181a; --card:#1e2326; --ink:#eef0ee; --muted:#9aa3a7; --line:#2e3538; }
  }
  :root[data-theme="dark"] { --bg:#15181a; --card:#1e2326; --ink:#eef0ee; --muted:#9aa3a7; --line:#2e3538; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 system-ui, "Noto Sans Arabic", sans-serif; }
  header { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:16px; flex-wrap:wrap; }
  h1 { font-size:20px; margin:0; }
  main { padding:0 16px 32px; max-width:900px; margin:0 auto; }
  button { font:inherit; min-height:44px; min-width:44px; padding:8px 14px; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--ink); cursor:pointer; }
  button.danger { color:var(--bad); }
  button:disabled { opacity:.5; cursor:not-allowed; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:12px; }
  .row { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; flex-wrap:wrap; }
  .name { font-weight:600; direction:ltr; text-align:left; word-break:break-all; }
  .meta { color:var(--muted); font-size:14px; direction:ltr; text-align:left; }
  .state { display:inline-block; padding:2px 10px; border-radius:999px; font-size:14px; border:1px solid currentColor; }
  .state.running { color:var(--ok); } .state.stopped { color:var(--muted); } .state.other { color:var(--warn); }
  .actions { display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }
  .msg { min-height:24px; color:var(--muted); font-size:14px; padding:0 16px; }
  .msg.err { color:var(--bad); }
</style>
</head>
<body>
<header>
  <h1>لوحة الخوادم</h1>
  <button id="reload" type="button">تحديث</button>
</header>
<div id="msg" class="msg" role="status" aria-live="polite"></div>
<main id="list"><p class="meta">جاري التحميل…</p></main>

<script>
(() => {
  const list = document.getElementById("list");
  const msg = document.getElementById("msg");
  const reload = document.getElementById("reload");
  const STATE_AR = { running: "يعمل", stopped: "متوقف" };
  const LOCK_AR = { locked: "مقفل — عملية جارية" };

  function say(text, isErr) { msg.textContent = text; msg.className = "msg" + (isErr ? " err" : ""); }

  function el(tag, attrs = {}, text) {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v);
    if (text != null) n.textContent = text;
    return n;
  }

  function card(vm) {
    const c = el("section", { class: "card", "aria-label": vm.hostname });
    const row = el("div", { class: "row" });
    const info = el("div");
    info.append(el("div", { class: "name" }, vm.hostname));
    info.append(el("div", { class: "meta" }, `#${vm.id} · ${vm.plan ?? ""} · ${vm.cpus} CPU · ${Math.round(vm.memory_mb / 1024)} GB RAM · ${Math.round(vm.disk_mb / 1024)} GB`));
    info.append(el("div", { class: "meta" }, `${(vm.ipv4 || []).join(", ")}${vm.template ? " · " + vm.template : ""}`));
    const known = ["running", "stopped"].includes(vm.state);
    row.append(info, el("span", { class: "state " + (vm.state === "running" ? "running" : vm.state === "stopped" ? "stopped" : "other") }, STATE_AR[vm.state] ?? vm.state));
    c.append(row);
    if (vm.actions_lock && vm.actions_lock !== "unlocked") {
      c.append(el("div", { class: "meta" }, LOCK_AR[vm.actions_lock] ?? vm.actions_lock));
    }
    const actions = el("div", { class: "actions" });
    const locked = vm.actions_lock && vm.actions_lock !== "unlocked";
    const mk = (label, action, cls) => {
      const b = el("button", { type: "button", class: cls || "" }, label);
      b.disabled = locked || !known;
      b.addEventListener("click", () => run(vm, action, label));
      return b;
    };
    actions.append(
      mk("تشغيل", "start"),
      mk("إعادة تشغيل", "restart"),
      mk("إيقاف", "stop", "danger"),
    );
    c.append(actions);
    return c;
  }

  async function run(vm, action, label) {
    if (action === "stop" && !confirm(`إيقاف ${vm.hostname}؟ ما يوقف الفاتورة.`)) return;
    say(`${label}… ${vm.hostname}`);
    try {
      const r = await fetch(`/api/vms/${vm.id}/${action}`, { method: "POST" });
      if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || `HTTP ${r.status}`);
      say(`أُرسل: ${label} — ${vm.hostname}. حدّث بعد دقيقة للتأكد.`);
    } catch (e) {
      say(`فشل: ${e.message}`, true);
    }
  }

  async function load() {
    say("");
    list.replaceChildren(el("p", { class: "meta" }, "جاري التحميل…"));
    try {
      const r = await fetch("/api/vms");
      const data = await r.json();
      if (!r.ok) throw new Error(data.error || `HTTP ${r.status}`);
      if (!data.vms.length) { list.replaceChildren(el("p", { class: "meta" }, "ما فيه خوادم.")); return; }
      list.replaceChildren(...data.vms.map(card));
    } catch (e) {
      list.replaceChildren();
      say(`ما قدرنا نجيب الخوادم: ${e.message}`, true);
    }
  }

  reload.addEventListener("click", load);
  load();
})();
</script>
</body>
</html>
