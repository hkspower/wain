name: wain
description: >
  وين — the native Flutter app for the Kuwaiti place-discovery site.
  Shares no code with the Next.js site; the catalogue and design tokens are
  generated from it (see ../scripts/gen-flutter-*.mjs) so the two can never
  silently disagree about data or brand, even though the UI is written
  independently.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^18.0.2
  provider: ^6.1.5+1
  shared_preferences: ^2.5.5
  flutter_svg: ^2.3.0
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  url_launcher: ^6.3.2
  share_plus: ^13.3.0
  web_socket_channel: ^3.0.3
  permission_handler: ^12.0.1
  flutter_tts: ^4.2.5
  app_links: ^7.2.1
  elevenlabs_agents: ^0.6.1
  http: ^1.6.0
  audioplayers: ^6.8.1
  wakelock_plus: ^1.8.1
  connectivity_plus: ^7.3.2
  speech_to_text: ^7.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  # The simulator suite (integration_test/, run by flutter-ci.yml on dispatch).
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  vector_graphics: ^1.2.3
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  fonts:
    # One family, weight carries the hierarchy — exactly as on the site
    # (theme.css: «font-display … now selects weight, not a different
    # typeface»). Weight 400 is the Regular file; there is no Medium.
    - family: IBMPlexSansArabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700
    # The sun's two words only, as on the site (HomeHero.tsx says why and
    # how the subset was made): Marhey Bold, OFL, cut to «إلى وين؟ ابحث».
    - family: MarheyHero
      fonts:
        - asset: assets/fonts/MarheyHero-Bold.ttf
          weight: 700
  assets:
    - assets/art/
    - assets/art/category/
    - assets/art/place/
    - assets/art/mark/
    - assets/art/cat-icon/
    - assets/art/icon/
    - assets/img/

# The app icon is the site's own mark (ios-config/app-icon-1024.png, rendered by
# `npm run icon:app`); the adaptive foreground is the site's maskable PNG. Both
# have the same cream ground, so the adaptive layer is seamless. iOS rejects an
# icon with transparency at upload, hence remove_alpha_ios.
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/img/app-icon-1024.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#fdfaf3"
  adaptive_icon_foreground: "assets/img/app-icon-maskable-512.png"
  web:
    generate: true
    image_path: "assets/img/app-icon-1024.png"
    background_color: "#fdfaf3"
    theme_color: "#2277b4"

# The launch screen: the mark on the app's own sand, light AND dark, so there
# is no flash of white (iOS template) or black (Android's night theme) before
# the first frame. The image is rendered from the logo by
# `npm run icon:app` (scripts/gen-app-icon.mjs). Regenerate the native files
# with `dart run flutter_native_splash:create` after changing either.
flutter_native_splash:
  color: "#fdfaf3"
  image: assets/img/splash-mark.png
  color_dark: "#fdfaf3"
  image_dark: assets/img/splash-mark.png
  android_12:
    color: "#fdfaf3"
    image: assets/img/splash-mark.png
    color_dark: "#fdfaf3"
    image_dark: assets/img/splash-mark.png
  web: false
