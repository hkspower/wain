<script>
// Returns & Exchange — fully client-side. The request is composed into a
// prefilled WhatsApp message; nothing sends until the customer confirms there.
const RX = {
  en: {
    sub: 'Free within 14 days of delivery. Pick your items below, choose return or exchange, and send the request on WhatsApp — we arrange pickup in Kuwait.',
    hOrder: 'Order details', lOrder: 'Order / track number', pOrder: 'e.g. SP1A2B3C4D (optional)',
    lPhone: 'Phone (for pickup)', pPhone: 'e.g. 9XXXXXXX (optional)',
    hPick: 'Select your items', search: 'Search products…', add: '+ Add', added: 'Added',
    hReq: 'Your request', empty: 'No items selected yet — tap a product above to add it.',
    ret: 'Return', exc: 'Exchange', newSize: 'New size', size: 'Size', reason: 'Reason',
    reasons: { size: 'Wrong size', damaged: 'Damaged / defective', nad: 'Not as described', mind: 'Changed my mind', other: 'Other' },
    remove: 'Remove', decrease: 'Decrease quantity', increase: 'Increase quantity',
    items: (n) => `${n} item${n === 1 ? '' : 's'}`,
    send: 'Send request on WhatsApp',
    note: 'Opens WhatsApp with your request pre-filled — nothing is sent until you press Send there.',
    hPolicy: 'Policy',
    policy: ['Exchange and return are free within 14 days of delivery.',
      'Items must be unworn, unwashed, with original tags attached.',
      'Refunds go back to the original payment method (KNET / card).',
      'Exchanges ship the same day the pickup is received.'],
    waIntro: 'Return/Exchange request — Sporta', waOrder: 'Order', waPhone: 'Phone', none: 'not provided',
  },
  ar: {
    sub: 'مجاناً خلال ١٤ يوماً من الاستلام. اختر منتجاتك بالأسفل، حدّد إرجاع أو استبدال، وأرسل الطلب عبر واتساب — وننسّق الاستلام داخل الكويت.',
    hOrder: 'بيانات الطلب', lOrder: 'رقم الطلب / التتبع', pOrder: 'مثال: SP1A2B3C4D (اختياري)',
    lPhone: 'رقم الهاتف (للاستلام)', pPhone: 'مثال: 9XXXXXXX (اختياري)',
    hPick: 'اختر منتجاتك', search: 'ابحث عن منتج…', add: '+ أضف', added: 'أُضيف',
    hReq: 'طلبك', empty: 'لم تختر أي منتج بعد — اضغط على منتج بالأعلى لإضافته.',
    ret: 'إرجاع', exc: 'استبدال', newSize: 'المقاس الجديد', size: 'المقاس', reason: 'السبب',
    reasons: { size: 'المقاس غير مناسب', damaged: 'تالف / به عيب', nad: 'مختلف عن الوصف', mind: 'غيّرت رأيي', other: 'سبب آخر' },
    remove: 'إزالة', decrease: 'إنقاص الكمية', increase: 'زيادة الكمية',
    items: (n) => `${n} ${n === 1 ? 'منتج' : 'منتجات'}`,
    send: 'أرسل الطلب عبر واتساب',
    note: 'يفتح واتساب مع تفاصيل طلبك جاهزة — لا يُرسل شيء حتى تضغط إرسال هناك.',
    hPolicy: 'السياسة',
    policy: ['الاستبدال والإرجاع مجاني خلال ١٤ يوماً من الاستلام.',
      'يجب أن تكون القطع غير ملبوسة وغير مغسولة مع البطاقات الأصلية.',
      'يُعاد المبلغ إلى وسيلة الدفع الأصلية (كي نت / بطاقة).',
      'شحنة الاستبدال تخرج في نفس يوم استلام القطعة.'],
    waIntro: 'طلب إرجاع/استبدال — سبورتا', waOrder: 'رقم الطلب', waPhone: 'الهاتف', none: 'غير مذكور',
  },
}
const SIZED_CATS = new Set(['women', 'men', 'outerwear'])
const SIZES = ['S', 'M', 'L', 'XL']
const req = [] // { slug, qty, action, size, newSize, reason }
let query = ''

const pOf = (slug) => window.SPORTA_PRODUCTS.find((x) => x.slug === slug)
const esc = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;')

window.SPORTA_PAGE = (S, H) => {
  const x = RX[S.lang]
  document.title = (S.lang === 'ar' ? 'الاستبدال والإرجاع' : 'Returns & Exchange') + ' — Sporta'
  document.getElementById('rTitle').textContent = S.lang === 'ar' ? 'الاستبدال والإرجاع' : 'Returns & Exchange'
  for (const [id, val] of [['rSub', x.sub], ['hOrder', x.hOrder], ['lOrder', x.lOrder],
    ['lPhone', x.lPhone], ['hPick', x.hPick], ['hReq', x.hReq], ['hPolicy', x.hPolicy], ['sendNote', x.note]])
    document.getElementById(id).textContent = val
  document.getElementById('fOrder').placeholder = x.pOrder
  document.getElementById('fPhone').placeholder = x.pPhone
  document.getElementById('fSearch').placeholder = x.search
  document.getElementById('policyList').innerHTML = x.policy.map((l) => `<li>${l}</li>`).join('')
  document.getElementById('reqCount').textContent = `— ${x.items(req.length)}`

  // picker
  const list = window.SPORTA_PRODUCTS.filter((p) => {
    const s = query.trim().toLowerCase()
    return !s || p.name.en.toLowerCase().includes(s) || p.name.ar.includes(s)
  })
  document.getElementById('picker').innerHTML = list.map((p) => {
    const picked = req.some((i) => i.slug === p.slug)
    return `<button class="rx-item${picked ? ' picked' : ''}" data-pick="${p.slug}" ${picked ? 'disabled' : ''}>
      <img src="${p.image}" alt="${esc(p.name[S.lang])}" width="48" height="48" loading="lazy">
      <span class="rx-item-body"><b>${esc(p.name[S.lang])}</b><small>${H.money(p.price)}</small></span>
      <span class="rx-item-add">${picked ? x.added : x.add}</span>
    </button>`
  }).join('')

  // request list
  const el = document.getElementById('reqList')
  if (!req.length) {
    el.innerHTML = `<p class="rx-empty">${x.empty}</p>`
  } else {
    el.innerHTML = req.map((i) => {
      const p = pOf(i.slug)
      const sized = SIZED_CATS.has(p.category)
      const opts = (sel) => SIZES.map((s) => `<option${s === sel ? ' selected' : ''}>${s}</option>`).join('')
      const rOpts = Object.entries(x.reasons)
        .map(([k, v]) => `<option value="${k}"${k === i.reason ? ' selected' : ''}>${v}</option>`).join('')
      return `<div class="rx-line">
        <div class="rx-line-top">
          <img src="${p.image}" alt="${esc(p.name[S.lang])}" width="56" height="56" loading="lazy">
          <span class="rx-item-body"><b>${esc(p.name[S.lang])}</b><small>${H.money(p.price)}</small></span>
          <button class="line-remove" data-rm="${i.slug}" aria-label="${x.remove}">${H.icon('close', 16)}</button>
        </div>
        <div class="rx-controls">
          <span class="rx-seg" role="group">
            <button class="chip" data-act="${i.slug}:return" aria-pressed="${i.action === 'return'}">${x.ret}</button>
            <button class="chip" data-act="${i.slug}:exchange" aria-pressed="${i.action === 'exchange'}">${x.exc}</button>
          </span>
          <span class="stepper line-stepper">
            <button data-q="${i.slug}:-1" aria-label="${x.decrease}">${H.icon('minus', 14)}</button>
            <span>${i.qty}</span>
            <button data-q="${i.slug}:1" aria-label="${x.increase}">${H.icon('plus', 14)}</button>
          </span>
          ${sized ? `<label>${x.size} <select data-size="${i.slug}">${opts(i.size)}</select></label>` : ''}
          ${sized && i.action === 'exchange'
            ? `<label class="rx-new">${x.newSize} <select data-nsize="${i.slug}">${opts(i.newSize)}</select></label>` : ''}
          <label>${x.reason} <select data-reason="${i.slug}">${rOpts}</select></label>
        </div>
      </div>`
    }).join('')
  }

  // WhatsApp link
  const wrap = document.getElementById('sendWrap')
  wrap.hidden = !req.length
  if (req.length) {
    const order = document.getElementById('fOrder').value.trim() || x.none
    const phone = document.getElementById('fPhone').value.trim() || x.none
    const lines = [x.waIntro, `${x.waOrder}: ${order}`, `${x.waPhone}: ${phone}`, '',
      ...req.map((i) => {
        const p = pOf(i.slug)
        const act = i.action === 'exchange' ? x.exc : x.ret
        const sized = SIZED_CATS.has(p.category)
        const size = sized ? ` (${i.size})` : ''
        const swap = sized && i.action === 'exchange' ? ` -> ${i.newSize}` : ''
        return `- ${act} x${i.qty}: ${p.name[S.lang]}${size}${swap} — ${x.reason}: ${x.reasons[i.reason]}`
      })]
    const a = document.getElementById('waSend')
    a.textContent = x.send
    a.href = `https://wa.me/96522091914?text=${encodeURIComponent(lines.join('\n'))}`
  }
}

document.addEventListener('click', (e) => {
  const pick = e.target.closest('[data-pick]')
  if (pick && !req.some((i) => i.slug === pick.dataset.pick)) {
    const p = pOf(pick.dataset.pick)
    const sized = SIZED_CATS.has(p.category)
    req.push({ slug: p.slug, qty: 1, action: 'return',
      size: sized ? 'M' : null, newSize: sized ? 'L' : null, reason: 'size' })
    return window.SPORTA.render()
  }
  const rm = e.target.closest('[data-rm]')
  if (rm) { req.splice(req.findIndex((i) => i.slug === rm.dataset.rm), 1); return window.SPORTA.render() }
  const act = e.target.closest('[data-act]')
  if (act) {
    const [slug, a] = act.dataset.act.split(':')
    const i = req.find((r) => r.slug === slug); if (i) i.action = a
    return window.SPORTA.render()
  }
  const q = e.target.closest('[data-q]')
  if (q) {
    const [slug, d] = q.dataset.q.split(':')
    const i = req.find((r) => r.slug === slug)
    if (i) i.qty = Math.max(1, i.qty + Number(d))
    return window.SPORTA.render()
  }
})
document.addEventListener('change', (e) => {
  for (const [attr, key] of [['data-size', 'size'], ['data-nsize', 'newSize'], ['data-reason', 'reason']]) {
    const slug = e.target.getAttribute(attr)
    if (slug) {
      const i = req.find((r) => r.slug === slug); if (i) i[key] = e.target.value
      return window.SPORTA.render()
    }
  }
})
document.addEventListener('input', (e) => {
  if (e.target.id === 'fSearch') { query = e.target.value; window.SPORTA.render() }
  if (e.target.id === 'fOrder' || e.target.id === 'fPhone') window.SPORTA.render()
})
</script>
