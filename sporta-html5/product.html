<script>
let sel = null
const SIZED = new Set(['women', 'men', 'outerwear'])
window.SPORTA_PAGE = (S, H) => {
  const slug = new URLSearchParams(location.search).get('p')
  const p = window.SPORTA_PRODUCTS.find((x) => x.slug === slug)
  const d = document.getElementById('detail')
  if (!p) {
    d.innerHTML = '<p style="text-align:center;padding:4rem 0">Product not found. <a href="shop.html" style="color:var(--brand)">Shop</a></p>'
    return
  }
  document.title = `${p.name[S.lang]} — Sporta`

  // SEO: point canonical/og at this product's own URL and inject Product +
  // BreadcrumbList JSON-LD for search and AI engines that execute JS.
  const pageUrl = `https://www.sporta.com.kw/product.html?p=${p.slug}`
  document.querySelector('link[rel="canonical"]')?.setAttribute('href', pageUrl)
  document.querySelector('meta[property="og:url"]')?.setAttribute('content', pageUrl)
  document.querySelector('meta[property="og:title"]')?.setAttribute('content', `${p.name.en} — Sporta`)
  document.getElementById('pjsonld')?.remove()
  const ld = document.createElement('script')
  ld.type = 'application/ld+json'
  ld.id = 'pjsonld'
  ld.textContent = JSON.stringify({
    '@context': 'https://schema.org',
    '@graph': [
      {
        '@type': 'Product',
        name: p.name.en,
        alternateName: p.name.ar,
        description: p.desc?.en,
        category: p.category,
        brand: { '@type': 'Brand', name: 'Sporta' },
        offers: {
          '@type': 'Offer',
          price: p.price.toFixed(3),
          priceCurrency: 'KWD',
          availability: 'https://schema.org/InStock',
          itemCondition: 'https://schema.org/NewCondition',
          url: pageUrl,
        },
      },
      {
        '@type': 'BreadcrumbList',
        itemListElement: [
          { '@type': 'ListItem', position: 1, name: 'Home', item: 'https://www.sporta.com.kw/' },
          { '@type': 'ListItem', position: 2, name: 'Shop', item: 'https://www.sporta.com.kw/shop.html' },
          { '@type': 'ListItem', position: 3, name: p.name.en, item: pageUrl },
        ],
      },
    ],
  })
  document.head.appendChild(ld)

  const sizes = SIZED.has(p.category) ? ['S', 'M', 'L', 'XL'] : null
  const sizeBlock = sizes
    ? `<div style="margin:1rem 0"><b>${H.t().size}</b>
        <div style="display:flex;gap:.5rem;margin-top:.5rem" id="sizes">${sizes
          .map((s) => `<button class="chip" data-size="${s}" aria-pressed="${sel === s}" style="min-width:3rem">${s}</button>`)
          .join('')}</div>
        <p id="sizeErr" style="color:#e11d48;font-size:.85rem;display:none">${
          S.lang === 'ar' ? 'الرجاء اختيار المقاس' : 'Please choose a size'
        }</p></div>`
    : ''
  d.innerHTML = `<div style="display:grid;gap:2rem;grid-template-columns:1fr" class="pd">
    <img src="${p.image}" alt="${p.name[S.lang]}" width="600" height="600" style="border-radius:1.5rem">
    <div><h1 style="font-size:2rem;color:var(--brand-dark)">${p.name[S.lang]}</h1>
      <p style="color:var(--muted)">${p.desc[S.lang]}</p>
      <p class="price" style="font-size:1.5rem">${H.money(p.price)}</p>
      ${sizeBlock}
      <button class="btn btn-primary" id="addBtn">${H.t().add}</button>
      <div class="trust" style="margin-top:1.5rem">
        <div>${H.icon('truck', 18)}<span>${H.t().trust.d}</span></div>
        <div>${H.icon('lock', 18)}<span>${H.t().trust.p}</span></div>
        <div>${H.icon('ret', 18)}<span>${H.t().trust.r}</span></div>
      </div>
    </div></div>`
  document.getElementById('crossTitle').textContent = S.lang === 'ar' ? 'أكمل إطلالتك' : 'Complete the look'
  document.getElementById('cross').innerHTML = window.SPORTA_PRODUCTS
    .filter((x) => x.slug !== slug).slice(0, 4).map(H.productCard).join('')
  document.getElementById('addBtn').addEventListener('click', () => {
    if (sizes && !sel) {
      document.getElementById('sizeErr').style.display = 'block'
      return
    }
    window.SPORTA.addToCart(slug, sel, 1)
    location.href = 'cart.html'
  })
}
document.addEventListener('click', (e) => {
  const b = e.target.closest('[data-size]')
  if (b) { sel = b.dataset.size; window.SPORTA.render() }
})
</script>
<style>@media(min-width:768px){.pd{grid-template-columns:1fr 1fr!important}}</style>
