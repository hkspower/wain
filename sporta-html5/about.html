// FAQ — bilingual; the FAQPage JSON-LD in <head> mirrors the English strings.
const FAQ = [
  { q: { en: 'Do you deliver same-day in Kuwait?', ar: 'هل توصلون في نفس اليوم داخل الكويت؟' },
    a: { en: 'Yes — orders inside Kuwait are delivered the same day. Delivery updates are sent on WhatsApp.',

  { q: { en: 'What payment methods do you accept?', ar: 'ما طرق الدفع المتوفرة؟' },
    a: { en: 'KNET (Kuwait debit), Visa and Mastercard. All prices are in Kuwaiti Dinar (KWD).',
         ar: 'كي نت وفيزا وماستركارد، وجميع الأسعار بالدينار الكويتي.' } },
  { q: { en: 'Can I exchange or return an item?', ar: 'هل يمكن الاستبدال أو الإرجاع؟' },
    a: { en: 'Yes — exchange and return are free. Contact us on WhatsApp +965 2209 1914 to arrange it.',
         ar: 'نعم — الاستبدال والإرجاع مجانيان. تواصل معنا عبر واتساب \u200E+965 2209 1914 لترتيب ذلك.' } },
  { q: { en: 'Do you ship outside Kuwait (GCC / Middle East)?', ar: 'هل تشحنون خارج الكويت (الخليج / الشرق الأوسط)؟' },
    a: { en: 'Online checkout covers Kuwait. For GCC and Middle East orders, message us on WhatsApp and we will arrange it.',
         ar: 'الدفع عبر الموقع متاح داخل الكويت. لطلبات دول الخليج والشرق الأوسط راسلنا على واتساب وسنرتب الشحن.' } },
  { q: { en: 'Which brands do you carry?', ar: 'ما الماركات المتوفرة لديكم؟' },
    a: { en: 'RHEO, Vanquish, ATE, Gymshark, Eyesportwear and our own SPORTA label — activewear, hoodies and gym accessories.',
         ar: 'ريو، فانكويش، ATE، جيمشارك، آي سبورت وماركتنا الخاصة سبورتا — ملابس رياضية وهوديز وإكسسوارات جيم.' } },
]
window.SPORTA_PAGE = (S) => {
  document.getElementById('faqTitle').textContent =
    S.lang === 'ar' ? 'الأسئلة الشائعة' : 'Frequently asked questions'
  document.getElementById('faq').innerHTML = FAQ.map(
    (f) => `<details>
      <summary>${f.q[S.lang]}</summary>
      <p>${f.a[S.lang]}</p>
    </details>`,
  ).join('')
}
