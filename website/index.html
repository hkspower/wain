<main class="vo-main" id="main">

  <!-- الافتتاح: كلمةٌ واحدة، تُطوى عند أوّل رسالة -->
  <section class="vo-hero" id="voHero" aria-labelledby="voTitle">
    <h1 id="voTitle">اطلب</h1>
  </section>

  <!-- الحوار مع الوكيل -->
  <section class="vo-chat" id="voChat" aria-label="الحوار مع وكيل موصول" aria-live="polite" hidden></section>

  <!-- بطاقة الطلب الحيّة -->
  <aside class="vo-card" id="voCard" aria-label="ملخّص الطلب" hidden>
    <h2 class="vo-card__title">طلبك حتى الآن</h2>
    <ul class="vo-card__list" id="voHeard"></ul>
    <ul class="vo-card__missing" id="voMissing"></ul>
    <button class="btn btn--primary btn--lg vo-card__send" id="voSubmit" type="button" hidden>
      <svg class="ic" aria-hidden="true"><use href="#i-send"></use></svg>
      أرسل الطلب إلى موصول
    </button>
  </aside>

  <!-- التأكيد بعد الإرسال -->
  <section class="vo-done" id="voDone" aria-live="polite" hidden></section>

</main>

<!-- الملتقط: زرّ الصوت والكتابة — الطريقان الوحيدان في الصفحة -->
<div class="vo-composer" id="voComposer">
  <div class="vo-composer__inner">
    <button class="vo-mic" id="voMic" type="button" aria-pressed="false" aria-label="تكلّم بطلبك">
      <svg class="ic ic--lg" aria-hidden="true"><use href="#i-mic"></use></svg>
    </button>
    <form class="vo-typebar" id="voForm">
      <label class="sr-only" for="voInput">اكتب طلبك</label>
      <textarea id="voInput" name="text" rows="3" autocomplete="off"
                enterkeyhint="send"></textarea>
      <button class="vo-typebar__send" type="submit" aria-label="أرسل ما كتبت">
        <svg class="ic" aria-hidden="true"><use href="#i-send"></use></svg>
      </button>
    </form>
  </div>
  <p class="vo-composer__hint" id="voHint" aria-live="polite"></p>
</div>
