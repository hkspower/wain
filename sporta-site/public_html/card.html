<!doctype html>
<!--
  Sporta — بطاقة الولاء / the loyalty card.  Served at /card.

  WHY THIS IS A FLAT PAGE AND NOT A ROUTE IN THE APP.

  The storefront is a built React bundle whose source is not in this
  repository. Adding a screen to it means editing minified JavaScript by hand,
  which is how you get a shop that renders a blank page. This is one static
  file and one script; it can be deleted in two lines and nothing else moves.

  It is also the ONLY way a customer on the website can reach the loyalty card
  at all. The server has been able to issue one since api/wallet.php was
  written, and the native app has a button for it on the Account screen — but
  the website, which is what is actually live at sporta.com.kw, had no link,
  no page and no mention. The card existed and nobody could get it.

  NO INLINE SCRIPT, deliberately. .htaccess sets one Content-Security-Policy
  for the whole docroot, and its script-src lists a sha256 for each inline
  script in index.html; an inline script here would need its own hash added
  there, and would silently do nothing on the day someone edited this file
  without re-hashing. /assets/card.js is covered by `script-src 'self'` and
  needs no policy change at all.

  NOINDEX. There is nothing here for a search engine — the page is a form that
  asks for a phone number and shows a balance. It is not in the sitemap and it
  says so in its own head, which is more reliable than a robots.txt rule
  because it travels with the page.
-->
<html lang="ar" dir="rtl" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0d0e10">
<title>بطاقة الولاء — سبورتا</title>
<link rel="icon" href="/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
  /* The palette is assets/sporta-dark.css's, copied rather than imported: this
     page must render correctly on its own, and pulling in a 91 KB build
     stylesheet for eight colours would be the slower and more fragile of the
     two. The values are the ramp, and they are the only thing shared. */
  :root {
    --sp-black:  #0d0e10;
    --sp-panel:  #17191c;
    --sp-raise:  #212428;
    --sp-line:   #2f3338;
    --sp-silver: #9aa0a6;
    --sp-text:   #e6e8ea;
    --sp-ember:  #ff7b17;
    --sp-fill:   #e0561c;
    --sp-on-fill:#171a1e;
  }
  @font-face {
    font-family: Alexandria; font-style: normal; font-weight: 100 900; font-display: swap;
    src: url(/fonts/alexandria-var-arabic.woff2) format("woff2-variations");
    unicode-range: U+0600-06FF, U+0750-077F, U+FB50-FDFF, U+FE70-FEFF;
  }
  @font-face {
    font-family: Alexandria; font-style: normal; font-weight: 100 900; font-display: swap;
    src: url(/fonts/alexandria-var-latin.woff2) format("woff2-variations");
    unicode-range: U+0000-00FF, U+2000-206F, U+20AC;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px 16px 48px;
    background: var(--sp-black); color: var(--sp-text);
    font-family: Alexandria, system-ui, sans-serif;
    font-size: 16px; line-height: 1.6;
    -webkit-text-size-adjust: 100%;
  }
  main { max-width: 30rem; margin: 0 auto; }
  a { color: var(--sp-ember); }
  .brand { display: block; margin: 0 auto 28px; height: 34px; width: auto; }
  h1 { font-size: 1.5rem; font-weight: 700; margin: 0 0 6px; }
  .lede { color: var(--sp-silver); margin: 0 0 24px; }

  .card {
    background: var(--sp-panel); border: 1px solid var(--sp-line);
    border-radius: 16px; padding: 20px; margin-bottom: 16px;
  }
  label { display: block; font-size: .9rem; color: var(--sp-silver); margin: 0 0 6px; }
  input {
    width: 100%; padding: 13px 14px; margin-bottom: 16px;
    background: var(--sp-raise); color: var(--sp-text);
    border: 1px solid var(--sp-line); border-radius: 10px;
    font: inherit; font-size: 16px;   /* 16px or iOS zooms the page on focus */
  }
  input:focus-visible { outline: 2px solid var(--sp-ember); outline-offset: 1px; }
  .hint { font-size: .82rem; color: var(--sp-silver); margin: -10px 0 16px; }

  button {
    width: 100%; min-height: 48px; padding: 13px 18px;
    background: var(--sp-fill); color: var(--sp-on-fill);
    border: 0; border-radius: 10px;
    font: inherit; font-weight: 700; cursor: pointer;
  }
  button[disabled] { opacity: .55; cursor: default; }
  button.ghost { background: transparent; color: var(--sp-text); border: 1px solid var(--sp-line); }

  /* The balance, once it is known. */
  .points { font-size: 3rem; font-weight: 800; line-height: 1.1; color: var(--sp-ember); }
  .who { font-size: 1.15rem; font-weight: 700; margin: 0 0 2px; }
  .tier { display: inline-block; padding: 3px 12px; border-radius: 999px;
          background: var(--sp-raise); border: 1px solid var(--sp-line);
          font-size: .85rem; color: var(--sp-text); margin-top: 10px; }
  .bar { height: 6px; border-radius: 999px; background: var(--sp-raise); margin: 16px 0 8px; overflow: hidden; }
  .bar > i { display: block; height: 100%; background: var(--sp-ember); }
  .muted { color: var(--sp-silver); font-size: .88rem; }

  /* A refusal is text, in the language of the page. `role=alert` so a screen
     reader hears it — the form does not move, so nothing else announces it. */
  .error {
    background: #2a1614; border: 1px solid #5c2a1e; color: #ffb59a;
    border-radius: 10px; padding: 12px 14px; margin-bottom: 16px;
  }
  [hidden] { display: none !important; }
  footer { text-align: center; margin-top: 28px; }
</style>
</head>
<body>
<main>
  <img class="brand" src="/logo-white.webp" alt="سبورتا" width="140" height="34">

  <!-- THE LOOKUP -->
  <section id="ask">
    <h1>بطاقة الولاء</h1>
    <p class="lede">نقطة واحدة لكل ١٠٠ فلس تنفقها في سبورتا. أدخل رقمك ورقم أي طلب سابق لعرض رصيدك.</p>

    <div class="card">
      <div id="error" class="error" role="alert" hidden></div>

      <!-- A real <form>: Enter submits it, iOS shows a "Go" key, and password
           managers leave it alone. The script intercepts submit; without
           JavaScript it would post to itself and change nothing, which is a
           better failure than a button that does nothing. -->
      <form id="form" novalidate>
        <label for="phone">رقم الهاتف</label>
        <input id="phone" name="phone" type="tel" inputmode="numeric"
               autocomplete="tel" placeholder="٥٥٥١٢٣٤٥" required>

        <label for="track">رقم أي طلب سابق</label>
        <input id="track" name="track" type="text" inputmode="latin"
               autocomplete="off" spellcheck="false" placeholder="SP1A2B3C" required>
        <p class="hint">نطلبه مرة واحدة فقط، للتأكد أن الرقم رقمك. تجده في رسالة تأكيد الطلب أو على الفاتورة.</p>

        <button id="go" type="submit">عرض رصيدي</button>
      </form>
    </div>
  </section>

  <!-- THE BALANCE -->
  <section id="result" hidden>
    <div class="card">
      <p class="who" id="who"></p>
      <p class="muted" id="orders"></p>
      <p class="points"><span id="points">0</span> <span style="font-size:1rem;font-weight:400;color:var(--sp-silver)">نقطة</span></p>
      <span class="tier" id="tier"></span>
      <div id="progress" hidden>
        <div class="bar"><i id="bar" style="width:0%"></i></div>
        <p class="muted" id="next"></p>
      </div>
    </div>

    <div class="card">
      <div id="addwrap">
        <p class="muted" style="margin-top:0" id="addnote"></p>
        <button id="add" type="button">إضافة إلى Apple Wallet</button>
      </div>
      <button class="ghost" id="again" type="button" style="margin-top:12px">رقم آخر</button>
    </div>
  </section>

  <footer class="muted">
    <a href="/">العودة إلى المتجر</a>
  </footer>
</main>
<script src="/assets/card.js" defer></script>
</body>
</html>
