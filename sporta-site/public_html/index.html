         So the shell paints WITHOUT JavaScript. The markup below is the
         header bar and the hero box at their real sizes and real colours,
         styled by the handful of inlined rules above rather than by the
         77 kB stylesheet, so it appears as soon as the HTML is parsed.
         React replaces it on mount (createRoot clears the container).

         Deliberately NO TEXT in it. Copy here would be a second, untranslated
         copy of strings that live in the i18n files, and it would be wrong for
         half the visitors before it was ever wrong for the other half. Shape
         and colour carry the whole job: the page stops being blank, and
         because the boxes are already the right height, the real content
         drops into place without moving anything — this LOWERS layout shift
         rather than trading it for speed. -->
    <div id="root">
      <div class="boot" aria-hidden="true">
        <div class="boot-head">
          <!-- The real header logo, at the size the real header uses. An image
               is CONTENTFUL where a coloured box is not, so this is what lets
               First Contentful Paint happen with the shell rather than 1.3s
               later with React — and it is not a placeholder, it is the same
               mark, in the same place, that replaces it. -->
          <img src="/logo-white.webp" alt="" width="132" height="41" fetchpriority="high" />
        </div>
        <!-- THE BANNER, PAINTED BEFORE ANY JAVASCRIPT RUNS.
             =================================================================
             Measured on a throttled phone (4x CPU, 1.6 Mbps, 150ms RTT): the
             preload in the boot script lands this file at +416ms, and LCP did
             not fire until 3832ms. The bytes were decoded and waiting on the
             device for three and a half seconds while React downloaded, parsed
             and mounted — because nothing existed to show them in. The image
             was never the slow part.

             In the markup rather than created by that script, for the reason
             the first attempt failed: the script is in <head> and this element
             is not parsed yet, so it appended to null. The parser reaches this
             immediately, which is earlier than any script could manage anyway.

             <picture> with a media source, so a phone never downloads the
             1600px desktop banner. Same file the preload asked for, so this is
             the warmed copy and not a second request; same object-fit and the
             same box as the mounted hero, so React's own <img> lands exactly
             over it with nothing to see.

             Hidden when the owner has uploaded slides — that hero is served
             from /api?r=slide_image and its id is not knowable before the API
             answers, so painting the shipped banner there would be a picture
             the hero is about to swap for a different one. The boot script
             stamps data-hero-kind from the last visit. -->
        <div class="boot-hero"><div class="boot-hero-pic"></div></div>
        <script>
          // BUILT HERE, not written into the markup above, and not from the
          // <head> script either. Both were tried and both were wrong:
          //
          //   in <head>  — .boot-hero is not parsed yet, so querySelector
          //                answers null and this silently did nothing at all.
          //   in markup  — index.html serves EVERY route, so /shop and
          //                /product painted the home banner in front of their
          //                own content until React mounted, and downloaded
          //                21 kB they never show. Hiding it with display:none
          //                does NOT stop that download: an <img> in the markup
          //                is fetched whether or not it is displayed. The
          //                request budget caught it (/shop 19 -> 20); the eye
          //                would have called it a flicker.
          //
          // Here, one line below the element, it runs during body parse — as
          // early as anything can that is not the parser itself — and the
          // <head> preload has already started the download.
          (function () {
            var html = document.documentElement
            if (html.getAttribute('data-hero-shell') !== 'on') return
            var box = document.querySelector('.boot-hero-pic')
            if (!box) return
            var dev = matchMedia('(min-width: 768px)').matches ? 'desktop' : 'mobile'
            var img = document.createElement('img')
            img.src = '/hero/' + dev + '/bodybuilding-men.webp'
            img.alt = ''
            img.setAttribute('fetchpriority', 'high')
            img.setAttribute('decoding', 'sync')
            box.appendChild(img)
          })()
        </script>
      </div>
    </div>
    <!-- WHAT THE SHELL SAYS WHEN IT IS NOT A SHELL ANY MORE.
         =================================================================
         Everything above is a placeholder React clears on mount. That is
         true for about 400ms — and if the bundle never arrives it is not
         true at all: the shell becomes the whole site, permanently, and a
         visitor gets an orange bar, a logo, and nothing else, forever. It
         does not look broken. It looks like a shop with nothing in it.

         So the shell is given a terminal state. This is the ONE place the
         "no text in the shell" rule is relaxed, and only for text that
         cannot exist in i18n: the i18n strings live in the bundle that, by
         the time anyone reads this, did not load. -->
    <noscript>
      <div class="boot-msg">
        <p>This shop needs JavaScript. Please enable it and reload.</p>
        <p dir="rtl" lang="ar">يحتاج هذا المتجر إلى جافاسكربت. فعّلها ثم أعد التحميل.</p>
      </div>
    </noscript>
    <script>
      // JavaScript ran but the app never mounted — a different failure from
      // the one above, and by far the more likely one: index.html and
      // assets/ disagreeing after a partial upload, so the module 404s.
      //
      // Ten seconds, because the budget suite measures LCP under 2s on a
      // throttled phone and a false alarm here would be its own bug. Paused
      // tabs are skipped: background timers are throttled, so a tab restored
      // after a minute would accuse a perfectly good server.
      (function () {
        var failed = ''
        addEventListener('error', function (e) {
          var t = e.target
          if (t && (t.src || t.href)) failed = t.src || t.href
        }, true)
        setTimeout(function () {
          if (window.__SPORTA_MOUNTED || document.visibilityState !== 'visible') return
          var ar = window.__SPORTA_LANG === 'ar'
          var d = document.createElement('div')
          d.className = 'boot-msg'
          d.setAttribute('dir', ar ? 'rtl' : 'ltr')
          d.innerHTML =
            '<p>' + (ar ? 'لم تكتمل عملية تحميل الصفحة.' : 'This page did not finish loading.') + '</p>' +
            '<p>' + (ar ? 'حدّث الصفحة. إذا تكرر ذلك، فقد تكون ملفات الموقع غير مرفوعة بالكامل.'
                        : 'Refresh the page. If it keeps happening, the site\'s files are probably not all on the server.') + '</p>' +
            (failed ? '<code>' + failed.replace(/[<&]/g, '') + '</code>' : '')
          document.getElementById('root').appendChild(d)
        }, 10000)
      })()
    </script>

    <!-- The shop's phone, WhatsApp and email, made editable from /backends.
         Those three are hard-coded in seven of the built bundles; this reads
         the current values from the server and swaps them where they appear.
         It exits without touching the DOM whenever they match what was built
         in, which is every load until the owner changes one — so uploading it
         moves nothing on the page. Deleting this tag reverts the feature.
         `defer` because it must not delay first paint: a stale phone number
         for 200ms is nothing, a slower shop is not. -->
    <script src="/assets/contact.js" defer></script>
    <!-- The footer's prose, editable from /backends. Same technique as
         contact.js above: a text swap after render, empty means leave it. -->
    <script src="/assets/footer.js" defer></script>
    <!-- A small generic icon on the footer's existing KNET and Cash-on-
         delivery pills — no card-network artwork, and no method added beyond
         the two this shop actually accepts (see the file's own header for
         why Visa/Mastercard marks are deliberately not here). -->
    <script src="/assets/footer-payment-icons.js" defer></script>
    <!-- The owner's colours, fonts and corner radius, from /backends. Every
         field is empty by default and empty changes nothing, so a shop that
         has never opened the editor looks exactly as it does today. It cannot
         apply before first paint — the values come from a fetch — so the
         theme settles a moment after load rather than blocking the page. -->
    <script src="/assets/theme.js" defer></script>

    <!-- The brand logo on grid cards. The product page already draws its
         own; this is the missing half, in the same .brand-chip markup. -->
    <script src="/assets/brand-badge.js" defer></script>

    <!-- Puts a link to /returns/request (a flat page, like /card) on the
         /returns policy page. Same class of thing as contact.js: DOM surgery
         on a bundle whose source is not here. Deleting this line reverts it. -->
    <script src="/assets/returns-link.js" defer></script>

    <!-- The two bulk uploaders on the panel, and the helpers they share.
         ORDER MATTERS: admin-upload.js defines window.sportaUpload and the
         other two return immediately without it, so a half-published set is a
         missing card rather than a broken panel. `defer` scripts run in
         document order, which is what makes that guarantee hold.

         The app has screens for both of these and the website's panel is a
         different program, so they are done the way everything else here
         reaches that bundle: DOM surgery, adding a card and changing nothing
         that exists. Neither does anything on any page but /backends. -->
    <script src="/assets/admin-upload.js" defer></script>
    <script src="/assets/brand-logos.js" defer></script>
    <script src="/assets/product-photos.js" defer></script>

    <!-- The Extra CSS box on the panel's Settings screen. Same shape as the two
         above and the same dependency on admin-upload.js, so it goes after it.
         theme.js is what APPLIES what this saves — and deliberately does not
         apply it here, so a rule that hides the shop cannot hide the box that
         clears it. -->
    <script src="/assets/custom-css.js" defer></script>

    <!-- The Shop rules card, also on the panel's Settings screen: delivery, the
         returns window, the cash-on-delivery limit, the review reward, the
         discount cap, the delivery areas, and which sizes and fits are offered.
         Every one of those was a PHP constant until now, so changing one meant
         a code edit and a publish.

         It draws its lists from the server's own `allowed`, never from a list
         written in the file — sizes and fits are pinned by CHECK constraints on
         order_items, and a picker offering a size MySQL will refuse is a
         checkout that dies on its last step. -->
    <script src="/assets/rules.js" defer></script>

    <!-- A banner telling the owner to replace a cron-set temporary password.
         admin.php refuses every route but ?r=account and ?r=account_update
         with HTTP 428 once must_change_password is set — see
         store_require_admin()'s own comment — and this is the panel's only
         way to say why, since the bundle has no source here to teach it
         directly. Loaded on every page and gated on /backends internally,
         the same shape every other admin-only overlay uses. -->
    <script src="/assets/force-password-notice.js" defer></script>

    <!-- A working "create the first admin account" form on the "No sign-in
         has been created yet" screen, replacing the bundle's own instructions
         to visit /api/setup-admin.php — a file that has never existed in
         this repository and does not exist on the server. Calls the same
         ?r=register the app's /backends already uses, which can only ever
         fire once. -->
    <script src="/assets/first-admin.js" defer></script>

    <!-- The website panel's Settings screen: the contact-details card the
         bundle has no editor for (the app's panel has had one all along), and
         the repair of two instructions on that screen which name files this
         server deliberately does not have. Panel-only; it does nothing on any
         other screen and nothing at all on the storefront. -->
    <script src="/assets/panel-settings.js" defer></script>

    <!-- The website panel's Settings screen: an editor for Privacy, Terms and
         Returns, which had none — writes the same `legal` row
         legal-pages.js reads on the storefront. Panel-only. -->
    <script src="/assets/legal-editor.js" defer></script>

    <!-- The website panel's Settings screen: the KNET Tranportal ID editor and
         the CBK gateway's own readiness (pay/config.php) — the app's panel has
         had this since admin.php's ?r=knet route was built, and the bundle
         had no editor for it at all. Read-only for the three CBK credentials
         (booleans only, never the values); the Tranportal ID is the one field
         this can write, same validation as the app's screen. Panel-only. -->
    <script src="/assets/payment.js" defer></script>

    <!-- The website panel, on a touchscreen: every button and checkbox
         label under 44px grows to a proper tap target under
         `pointer: coarse`, and the one chart's 10px axis labels grow to
         11px unconditionally. Nothing changes for a mouse. Panel-only. -->
    <script src="/assets/admin-mobile.js" defer></script>

    <!-- /checkout, on a touchscreen: "Change", "Edit bag", the quantity
         steppers and "Remove" all grow to a proper tap target under
         `pointer: coarse`. The payment-method radios need nothing — their
         real tap target is already a 316x64 label. Checkout-only. -->
    <script src="/assets/checkout-tap-targets.js" defer></script>

    <!-- Removes the home page's "Shop the essentials" section outright —
         sporta-ui.css hides the main menu itself; this is the other half
         of the same request. -->
    <script src="/assets/essentials.js" defer></script>

    <!-- The main menu: "About us" becomes a plain link to /terms, because a
         React Router Link's href cannot be repointed by editing the DOM —
         see the file's own header. Storefront-wide, since the header is on
         every page; sporta-ui.css hides "Shop" outright and hides "About"
         only once this script has a working replacement in place. -->
    <script src="/assets/nav-menu.js" defer></script>

    <!-- A row of brand logos on the home page, right under the hero carousel
         — the hero is `section[aria-roledescription]`, a stable selector
         across languages (measured: the value stays "carousel" in Arabic
         too). Renders nothing until an active brand has a logo; the live
         shop has none yet. -->
    <script src="/assets/brand-strip.js" defer></script>

    <!-- Three trust icons on the home page, right after the hero (and after
         brand-strip.js's own row if a brand has a logo) — returns/exchange,
         reading the live return window from ?r=slides rather than a typed-in
         number, delivery coverage, and a marketing authenticity claim. -->
    <script src="/assets/trust-strip.js" defer></script>

    <!-- An owner-editable body for Privacy, Terms and Returns — swaps in
         panel-written text below the "Last updated" line on Privacy/Terms,
         and the one descriptive paragraph above the order-lookup card on
         Returns. Renders nothing until an owner has written something; the
         live shop has no override yet. -->
    <script src="/assets/legal-pages.js" defer></script>

    <!-- "Sign in with Google" on /backends, beside the password form rather
         than instead of it. Google sign-in can fail for reasons this shop
         cannot see or fix — an outage, a blocked script, a corporate policy,
         the wrong account signed in — and a panel whose only door depends on
         somebody else's service is a panel that can be locked.

         It does nothing on any other page: the script returns immediately
         unless the path is /backends, so the storefront pays a download and no
         request. Google's own script is fetched only once a configured client
         id has come back from the server, so a shop that has not set one loads
         nothing third-party at all.

         The CSP in .htaccess names accounts.google.com for /backends ONLY —
         script-src, frame-src and connect-src, because the button is a script
         that draws an iframe and calls home. Under the storefront policy it
         fails three times over and silently. -->
    <script src="/assets/google-signin.js" defer></script>

    <!-- Same reasoning, same scoping, for Apple: the CSP names
         appleid.cdn-apple.com and appleid.apple.com for /backends only. -->
    <script src="/assets/apple-signin.js" defer></script>

    <!-- /track's one field carries no `required`, so pressing Track on an
         empty box did nothing at all — no message, no hint, no outline. This
         adds the attribute the bundle cannot be edited to include, and the
         browser does the rest in the visitor's own language. Same class of
         thing as the two above. Deleting this line reverts it. -->
    <script src="/assets/track-guard.js" defer></script>

    <!-- The home page's women's tile carries the ENGLISH composition in Arabic
         — figure and baked-in copy on the wrong side — while the men's tile
         beside it is correct. The bundle names exactly one tile as having an
         Arabic frame and it is not this one, and there is no source for it
         here. The artwork now exists at both crops; this points the tile at it,
         and reverts itself on any load error so the worst case is today's
         picture rather than a blank tile. Deleting this line reverts it. -->
    <script src="/assets/tile-art.js" defer></script>

    <!-- The website panel's order-detail drawer: a link to the archived PDF
         invoice. api/invoice-pdf.php, api/cron-invoice.php and
         api/invoice-file.php already built, swept and served the document —
         nothing in either panel bundle linked to it, so it could only be
         opened by typing the URL from memory. Needs no credential of its own:
         invoice-file.php is gated by the session cookie alone, deliberately,
         because a download is a plain navigation. Panel-only; does nothing on
         the storefront or anywhere the order-detail drawer is not open. -->
    <script src="/assets/invoices.js" defer></script>

    <!-- The سبورتا AI launcher and its open panel: a dedicated black-robot
         icon (carrying the same orange S mark) instead of the site favicon
         reused as-is. Matched structurally, not by the launcher's
         aria-label text, which differs between the two languages — see the
         file's own header for why. Reverts itself if assistant-bot.webp is
         ever missing: the swap happens only after the new file's own load
         succeeds. -->
    <script src="/assets/assistant-icon.js" defer></script>
  </body>
</html>
