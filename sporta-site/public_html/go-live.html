<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Sporta — go-live check</title>
<script src="/config.js"></script>
<style>
  :root { color-scheme: light dark; }
  body { font: 15px/1.5 system-ui, -apple-system, sans-serif; margin: 0; padding: 24px 16px 64px;
         background: #E2DBCE; color: #171A1E; }
  main { max-width: 720px; margin: 0 auto; }
  h1 { font-size: 26px; margin: 0 0 4px; }
  .sub { color: #6b6257; margin: 0 0 24px; }
  .verdict { border-radius: 14px; padding: 16px 18px; font-weight: 700; margin-bottom: 22px; }
  .verdict.live { background: #d9f5e3; color: #0f5132; }
  .verdict.no   { background: #fde2e2; color: #8a1c1c; }
  .verdict.busy { background: #fff3cd; color: #6b5300; }
  .row { background: #fff; border-radius: 12px; padding: 12px 14px; margin-bottom: 8px;
         display: grid; grid-template-columns: 26px 1fr; gap: 10px; align-items: start; }
  .row b { display: block; }
  .row small { color: #6b6257; display: block; margin-top: 2px; }
  .fix { background: #fff8e6; border-inline-start: 3px solid #E0561C; padding: 8px 10px;
         margin-top: 8px; border-radius: 6px; font-size: 14px; }
  code { background: rgba(0,0,0,.06); padding: 1px 5px; border-radius: 4px; font-size: .92em; }
  .mark { font-size: 19px; line-height: 1.2; }
  footer { margin-top: 26px; color: #6b6257; font-size: 13px; }
  @media (prefers-color-scheme: dark) {
    body { background: #171A1E; color: #e8eaed; }
    .row { background: #1b2026; } .sub, .row small, footer { color: #9aa3ae; }
    code { background: rgba(255,255,255,.1); } .fix { background: #241d12; }
  }
</style>
</head>
<body>
<main>
  <h1>Sporta — go-live check</h1>
  <p class="sub"><span dir="rtl">فحص الجاهزية — كل خطوة تُختبر فعلياً، لا مجرد افتراض.</span><br>
     Every check below actually calls the thing it names.</p>

  <div id="verdict" class="verdict busy">Checking…</div>
  <div id="rows"></div>

  <footer>
    This page reveals configuration state. <b>Delete <code>go-live.html</code></b> from the
    server once every line is green.<br>
    <span dir="rtl">احذف هذا الملف بعد أن تصبح كل النتائج خضراء.</span>
  </footer>
</main>

<script>
// Self-contained on purpose: this must work on a server where nothing else has
// been verified yet, so it has no build step, no imports and no dependencies.
const cfg = window.SPORTA_CONFIG || {}
const rows = document.getElementById('rows')
const API = (cfg.phpApiUrl || '/api').replace(/\/$/, '')

let failures = 0
function report(okState, title, detail, fix) {
  if (!okState) failures++
  const el = document.createElement('div')
  el.className = 'row'
  el.innerHTML =
    `<span class="mark">${okState ? '✅' : '❌'}</span>` +
    `<span><b>${title}</b><small>${detail}</small>` +
    `${!okState && fix ? `<div class="fix">${fix}</div>` : ''}</span>`
  rows.appendChild(el)
}

// The backend is /api on this same origin. Nothing here needs a key: the
// catalogue and stock are shop-window data, and the only write this page makes
// is a deliberately invalid order it expects to be refused.
const api = (route, init = {}) =>
  fetch(API + '/api.php?r=' + route, {
    ...init,
    headers: { 'Content-Type': 'application/json', ...(init.headers || {}) },
  })

// Each check is isolated: a thrown error becomes a failed line, not a blank
// page. A checker that stops early is worse than no checker, because it looks
// like the remaining steps passed.
async function step(fn) {
  try { await fn() } catch (e) { report(false, 'Check failed to run', String(e && e.message || e), '') }
}

async function run() {
  // ---- 1. the backend answers --------------------------------------------
  // /api is the whole backend: catalogue, stock, orders, invoices, admin. If
  // it does not answer, nothing below it can, so this runs first and stops.
  let productCount = null
  try {
    const r = await api('products')
    if (r.status === 200) {
      const body = await r.json().catch(() => null)
      productCount = Array.isArray(body?.products) ? body.products.length : 0
      report(true, 'Backend reachable (/api)', 'api.php answered.')
    } else if (r.status === 503) {
      report(false, 'Backend reachable (/api)', 'HTTP 503 — PHP ran but the database refused.',
        'Check the four <code>mysql_*</code> values in <code>public_html/api/config.php</code> ' +
        'against hPanel → Databases → Management.')
    } else if (r.status === 404) {
      report(false, 'Backend reachable (/api)', 'Nothing is answering at /api/api.php.',
        'The <code>api/</code> folder was not uploaded. Upload it from the package, then create ' +
        '<code>api/config.php</code> from <code>config.example.php</code>.')
    } else {
      report(false, 'Backend reachable (/api)', 'HTTP ' + r.status + ' from api.php.',
        'Open <code>api/config.php</code> and check it parses — a stray character makes PHP 500.')
    }
  } catch (e) {
    report(false, 'Backend reachable (/api)', 'Could not connect: ' + e.message,
      'Upload the <code>api/</code> folder and create <code>api/config.php</code>.')
  }
  if (productCount === null) return finish()

  await step(async () => {
  // ---- 2. the database has a catalogue to price from ----------------------
  report(productCount > 0, 'Products loaded',
    productCount + ' product(s) in the database.',
    'Import ONE file — <code>api/install.mysql.sql</code> (all four parts, right order) in ' +
    'hPanel → Databases → phpMyAdmin. Orders are priced from this table, so while it is ' +
    'empty <b>every checkout is refused</b>.')

  // Order creation must reject an empty cart. That it rejects it with the
  // documented token — rather than 404 — proves the endpoint exists, the
  // database is writable, and the server is the one deciding the price.
  try {
    const r = await api('order', {
      method: 'POST',
      body: JSON.stringify({ track_id: 'GOLIVECHK', items: [], customer: {} }),
    })
    const body = await r.json().catch(() => ({}))
    const good = r.status !== 404 && typeof body?.error === 'string'
    report(good, 'Checkout endpoint (create order)',
      good ? 'Present — it rejected an empty cart, as it should.' : 'Not answering.',
      'Upload <code>api/store.php</code> with the rest of the folder, then import ' +
      '<code>api/schema.mysql.sql</code>. Without it every shopper hits an error on Pay.')
  } catch (e) {
    report(false, 'Checkout endpoint (create order)', e.message,
      'Upload the <code>api/</code> folder and import <code>api/schema.mysql.sql</code>.')
  }

  })

  await step(async () => {
  // ---- 3. server ----------------------------------------------------------
  // A deep route returning HTML proves .htaccess is present and rewriting.
  try {
    const r = await fetch('/shop', { headers: { Accept: 'text/html' } })
    const html = await r.text()
    const good = r.status === 200 && html.includes('<div id="root">')
    report(good, 'Deep routes work (.htaccess)', good ? '/shop served the app.' : 'HTTP ' + r.status,
      '<code>.htaccess</code> is missing from <code>public_html/</code>. It is a <b>hidden</b> file — ' +
      'turn on "show hidden files" in File Manager and upload it. Without it there is no HTTPS ' +
      'redirect, no security headers, and /shop shows 404.')
  } catch (e) { report(false, 'Deep routes work (.htaccess)', e.message, 'Upload the hidden <code>.htaccess</code> file.') }

  // Deep routes working only proves SOME .htaccess is there — an older one
  // rewrites fine while leaving every dotfile readable. So ask the server
  // directly for the files that must never be served. This is not theoretical:
  // .env and .DS_Store were both sitting in public_html from an earlier deploy.
  try {
    // Every path here was photographed in the live public_html.
    const SECRET = ['/.env', '/.DS_Store', '/.deploy-manifest.json', '/.git/config',
                    '/deploy.config.json', '/deployhostinger.mjs', '/package.json',
                    '/knet.log', '/config-dist.php', '/knet-config.php',
                    '/knet/config.php', '/config.php', '/sporta-deploy.php',
                    '/sporta-deploy-config.php', '/sporta-dist.zip', '/vite.config.ts',
                    '/README-knet.md', '/smoke-cbk.mjs']
    const exposed = []
    for (const path of SECRET) {
      const r = await fetch(path, { headers: { Accept: 'text/plain' } }).catch(() => null)
      if (!r || r.status !== 200) continue
      const body = await r.text().catch(() => '')
      // A 200 that is really the SPA fallback is fine; anything else is the
      // file itself. config.php is exempt from the body test — PHP executes it,
      // so an empty 200 means it ran, not that it leaked.
      if (path.endsWith('.php')) { if (body.trim() && !body.includes('<div id="root">')) exposed.push(path) }
      else if (!body.includes('<div id="root">')) exposed.push(path)
    }
    report(exposed.length === 0, 'Private files are not downloadable',
      exposed.length ? 'READABLE BY ANYONE: ' + exposed.join(', ') : 'Every dotfile and config file is blocked.',
      'Delete these from <code>public_html/</code> in File Manager now, then upload the current ' +
      '<code>.htaccess</code> (8 KB — an older one does not block dotfiles). ' +
      '<b>If <code>.env</code> or a <code>config.php</code> was listed, treat every secret in it as ' +
      'compromised and rotate it</b> — the database password in hPanel, Tranportal and T-Pay ' +
      'credentials with your bank.')
  } catch (e) { report(false, 'Private files are not downloadable', e.message, '') }

  // The single most informative check: asking pay.php for an order that cannot
  // exist. A 404 proves PHP runs, config.php parses, the service key works and
  // the fail-closed lookup is doing its job — all at once.
  try {
    const r = await fetch('/knet/pay.php?trackid=GOLIVECHECK000', { redirect: 'manual' })
    const text = await r.text().catch(() => '')
    let title = 'Payment endpoint', detail, ok = false, fix = ''
    // A missing knet/ folder ALSO returns 404 — and read as a pass, that is the
    // exact class of silent failure this page exists to catch. pay.php answers
    // with the words "Unknown order."; Apache's own 404 does not.
    if (r.status === 404 && /unknown order/i.test(text)) {
      ok = true; detail = 'pay.php refused an unknown order (404) — exactly right.'
    } else if (r.status === 404) {
      detail = 'Nothing is answering at /knet/pay.php.'
      fix = 'The <code>knet/</code> folder was not uploaded. Upload it from the package, then ' +
            'create <code>knet/config.php</code> from <code>config.example.php</code>.'
    } else if (/<\/html>/i.test(text) && r.status === 200) {
      detail = 'PHP is not executing — the file was served as text.'
      fix = 'PHP is disabled for this folder, or the file was uploaded with the wrong extension. ' +
            'Check the PHP version setting in hPanel.'
    }
    else if (r.status === 503) { detail = 'Cannot reach the orders database (503).'; fix = 'Check the four <code>mysql_*</code> values in <code>knet/config.php</code> — they must match <code>api/config.php</code>.' }
    else if (r.status === 500) { detail = 'Server error (500).'; fix = 'Usually a resource key that is not exactly 16 bytes. Open <code>/knet/selftest.php</code> — it names the problem.' }
    else if (r.status === 0 || r.type === 'opaqueredirect') { detail = 'Redirected to the bank for an order that does not exist.'; fix = '<b>Serious:</b> the orders database is not configured in <code>knet/config.php</code>, so the browser could set its own price. Fill in the <code>mysql_*</code> values.' }
    else { detail = 'Unexpected HTTP ' + r.status + '.'; fix = 'Open <code>/knet/selftest.php</code> for detail.' }
    report(ok, title, detail, fix)
  } catch (e) {
    report(false, 'Payment endpoint', 'Not reachable: ' + e.message,
      'Upload the <code>knet/</code> folder, then create <code>knet/config.php</code> from ' +
      '<code>config.example.php</code> and set its permissions to 600.')
  }

  })

  await step(async () => {
  // ---- 4. discoverability -------------------------------------------------
  for (const [file, label] of [['/sitemap.xml', 'Sitemap'], ['/robots.txt', 'robots.txt'], ['/site.webmanifest', 'Web app manifest']]) {
    try {
      const r = await fetch(file)
      report(r.ok, label, r.ok ? file + ' served.' : 'HTTP ' + r.status, 'Re-upload <code>' + file + '</code>.')
    } catch { report(false, label, 'not reachable', 'Re-upload <code>' + file + '</code>.') }
  }

  })

  finish()
}

function finish() {
  const v = document.getElementById('verdict')
  if (failures === 0) {
    v.className = 'verdict live'
    v.innerHTML = '🎉 Sporta is live and can take orders.<br>' +
      '<span dir="rtl" style="font-weight:600;display:block">سبورتا جاهز لاستقبال الطلبات.</span>' +
      '<span style="font-weight:400">Do a real 0.100 KWD test payment, then confirm the order shows as ' +
      '<b>paid</b> in the admin — not just that the browser showed a tick. Then delete this file, ' +
      '<code>knet/selftest.php</code> and <code>knet/setup-config.php</code>.</span>'
  } else {
    v.className = 'verdict no'
    v.textContent = failures + ' thing' + (failures === 1 ? '' : 's') +
      ' still to fix — see below. The store cannot take orders until they are green.'
  }
}

run()
</script>
</body>
</html>
