# Traefik dynamic configuration: the rules public/.htaccess carries, moved to
# the proxy in front of the VPS (`wain-www` / `wain-apex` routers, Docker
# project `apache`, service `wain`).
#
# DRAFT, NOT APPLIED. Written 18 November from public/.htaccess, because the
# .htaccess may never run on the VPS (see CLAUDE.md, the 31 October scan:
# nothing here shows whether the container's Apache honours AllowOverride).
# Nothing on the server has been changed. Applying it means editing the labels
# or a file provider on the VPS and restarting the `apache` project, which
# also restarts sporta, almuhallab and mawsoool. That needs the owner's yes.
#
# Load as a file provider (a *.yml under Traefik's dynamic directory), then
# attach `wain-security@file` to the wain-www and wain-apex routers.
#
# What does NOT translate, and why it is listed rather than faked:
#   - Cache-Control per file type (rules 1, 2a–2c): Traefik's headers middleware
#     sets one value per router, so the per-type split needs one router per type
#     (PathRegexp on the extension). Left out here; the origin must keep sending
#     these headers, or the split is lost.
#   - The 403/404 deny rules for storage files, dotfiles and backups: Traefik
#     routes requests, it does not serve a 404 body. These need a service that
#     answers 404, or they stay on the origin. Left out here.
#   - Compression: Traefik's compress middleware is available, but whether the
#     origin already compresses is not known. Not added.
#   - The 308 apex redirect already exists in the router `wain-apex`.

http:
  middlewares:
    wain-security:
      headers:
        customResponseHeaders:
          X-Content-Type-Options: "nosniff"
          Referrer-Policy: "strict-origin-when-cross-origin"
          Permissions-Policy: "camera=(), geolocation=(self), microphone=(self)"
          X-Frame-Options: "DENY"
          Strict-Transport-Security: "max-age=31536000"
          # Same policy as public/.htaccess, copied verbatim. If the two drift,
          # the file in the repository is the one to keep.
          Content-Security-Policy: "default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self'; frame-ancestors 'none'; img-src 'self' data: blob: https://tile.openstreetmap.org https://storage.googleapis.com/eleven-public-cdn/images/; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' blob: https://cdn.jsdelivr.net/npm/@alexanderolsen/libsamplerate-js@2.1.2/dist/libsamplerate.worklet.js; connect-src 'self' https://api.elevenlabs.io https://api.us.elevenlabs.io wss://api.elevenlabs.io wss://api.us.elevenlabs.io; frame-src https://www.openstreetmap.org; media-src 'self' blob: https://api.elevenlabs.io; worker-src 'self' blob:; manifest-src 'self'"
          # Strip any cookie the host or a proxy might add (see the .htaccess
          # comment on Set-Cookie). An empty value removes the header in Traefik.
          Set-Cookie: ""

    wain-apex-redirect:
      redirectRegex:
        regex: "^https?://wainkw\\.com/(.*)"
        replacement: "https://www.wainkw.com/${1}"
        permanent: true

    wain-shoug-redirect:
      redirectRegex:
        regex: "^https?://www\\.wainkw\\.com/shoug(/.*)?$"
        replacement: "https://www.wainkw.com/find/"
        permanent: true
