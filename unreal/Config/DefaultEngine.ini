[/Script/EngineSettings.GameMapsSettings]
GameDefaultMap=/Engine/Maps/Entry.Entry
GlobalDefaultGameMode=/Script/GulfRoadNights.GRNGameMode

[/Script/Engine.RendererSettings]
; UE5 night-city defaults: Lumen GI + reflections carry the sodium
; lighting, virtual shadow maps keep the lamp shadows crisp, TSR
; upscales so the game holds frame rate at 4K.
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.Lumen.Reflections.Allow=1
; Hardware ray tracing feeds Lumen where the GPU has it; software
; Lumen remains the automatic fallback everywhere else.
r.SkinCache.CompileShaders=True
r.RayTracing=True
r.Lumen.HardwareRayTracing=True
r.Lumen.HardwareRayTracing.LightingMode=1
r.Nanite=True
r.Nanite.ProjectEnabled=True
r.Shadow.Virtual.Enable=1
r.AntiAliasingMethod=4
r.DefaultFeature.AutoExposure.Method=1
r.DefaultFeature.AutoExposure.Bias=0.6
r.DefaultFeature.Bloom=True
r.BloomQuality=4
r.DefaultFeature.MotionBlur=False
r.ToneMapper.Sharpen=0.4
; Stays on. Lumen's software path traces the global distance field
; built from these, and so does MegaLights' software fallback on a GPU
; without hardware ray tracing.
r.GenerateMeshDistanceFields=True
; Full-precision everything at project level; GRNGraphics::ApplyMax
; drives the runtime dials (native res, cinematic scalability) at boot.
r.SupportSkyAtmosphere=True
r.VolumetricFog=True

; MegaLights (production-ready in 5.8): shadowed local lights priced per
; pixel rather than per light. The street lamps and headlights only turn
; their shadows on when this is on AND r.MegaLights.Allow says so for the
; current scalability rung (DefaultScalability.ini) — see
; GRNGraphics::MegaLightsActive. Off, they are the unshadowed lamps this
; project always had, which is the only affordable kind without it.
r.MegaLights.EnableForProject=True

; Substrate, for the car paint's clear coat (GRNPaint.h). Read-only at
; runtime: changing either line means an editor restart and a full shader
; recompile. 0 is the Blendable GBuffer, which the v1 paint graph's Simple
; Clear Coat node is designed for; 1 (Adaptive) is only needed by a true
; two-slab coat and costs more per pixel. With Substrate off the game
; draws the basic-shape paint it always did, and GRN.Paint.Status says so.
r.Substrate=True
r.Substrate.ProjectGBufferFormat=0

[/Script/Engine.CollisionProfile]
; Track-space gameplay needs no physics collision; everything moves on
; the spline model. Leave defaults.

[/Script/Engine.PhysicsSettings]
bEnableEnhancedDeterminism=False

; ---- NVIDIA / RTX -----------------------------------------------------
; There used to be a [/Script/Engine.RendererSettings.RayTracing] section
; here with r.RayTracing.Shadows, r.RayTracing.AmbientOcclusion and
; r.RayTracing.Reflections.MaxRoughness in it. No such config section
; exists, so none of the three was ever read: removing it changes nothing
; that ran. Two of them were dead twice over — legacy ray-traced AO only
; ever ran with Lumen GI off, and the legacy ray-traced reflections went
; with it in 5.4. Ray-traced shadows are set at runtime, where they are
; actually applied, by GRNGraphics::ApplyNvidia.

; DLSS/Reflex are plugin-provided. Listing them here is harmless when the
; plugins are absent — unknown keys are ignored — and means a build that
; ships with them comes up correct without touching code.
[SystemSettings]
; Comfort: cap bloom smear the same way the web build's grade does
r.Bloom.Cross=0.0
r.NGX.Enable=1
r.NGX.DLSS.Enable=1
r.NGX.DLSS.Quality=3
t.Reflex.Enable=1

; 4K needs a bigger shadow atlas and streaming pool than 1440p; the
; runtime scales these per preset in GRNGraphics::ApplyPreset, these are
; the safe 4K-capable starting values.
r.Shadow.Virtual.MaxPhysicalPages=8192
r.Streaming.PoolSize=6144
