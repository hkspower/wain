[/Script/EngineSettings.GameMapsSettings]
GameDefaultMap=/Engine/Maps/Entry.Entry
GlobalDefaultGameMode=/Script/GulfRoadNights.GRNGameMode

[/Script/Engine.RendererSettings]
; UE5 night-city defaults: Lumen GI + reflections carry the sodium
; lighting, virtual shadow maps keep the lamp shadows crisp, TSR
; upscales so the game holds frame rate at 4K.
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.Lumen.Reflections.Allow=1
r.Shadow.Virtual.Enable=1
r.AntiAliasingMethod=4
r.DefaultFeature.AutoExposure.Method=1
r.DefaultFeature.AutoExposure.Bias=0.6
r.DefaultFeature.Bloom=True
r.BloomQuality=4
r.DefaultFeature.MotionBlur=False
r.ToneMapper.Sharpen=0.4
r.GenerateMeshDistanceFields=True

[/Script/Engine.CollisionProfile]
; Track-space gameplay needs no physics collision; everything moves on
; the spline model. Leave defaults.

[/Script/Engine.PhysicsSettings]
bEnableEnhancedDeterminism=False

[SystemSettings]
; Comfort: cap bloom smear the same way the web build's grade does
r.Bloom.Cross=0.0
