; What the cooker must take although nothing hard-references it.
;
; The cook follows references out from the maps, and this project's only
; map is /Engine/Maps/Entry — everything is spawned from code and found by
; string path at runtime. So the cooker would leave out:
;
; - /Game/GRN/Generated: the Substrate car paint (GRNPaint::MaterialPath),
;   built by GulfRoadNightsEditor. Left out, a packaged build would draw
;   the basic-shape fallback while every editor session drew the coat.
; - /Game/VehicleVarietyPack: the Fab hero art GRNHeroArt.cpp names by
;   string. The same gap, and it predates the paint — a packaged build
;   would have built primitive cars in a project that had the art.
;
; A directory that does not exist (no Fab pack imported) simply cooks
; nothing. scripts/check-unreal-project.mjs derives both paths from the
; code and fails if this list stops covering them.
[/Script/UnrealEd.ProjectPackagingSettings]
+DirectoriesToAlwaysCook=(Path="/Game/GRN/Generated")
+DirectoriesToAlwaysCook=(Path="/Game/VehicleVarietyPack")
