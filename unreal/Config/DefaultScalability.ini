; Night Racer scalability. The game boots at Cinematic (level 4 via
; GRNGraphics::ApplyMax); these overrides keep even the lower rungs
; looking like the night corniche instead of a flat fallback.

; MegaLights per rung. r.MegaLights.Allow is the scalability switch (the
; project switch is in DefaultEngine.ini), and the street lamps and
; headlights read it when they are built: on, ~170 sodium lamps and the
; cars' beams cast shadows at a fixed per-pixel cost; off, they are the
; unshadowed lamps this project always had. Low and Medium say off — a
; GPU on those rungs is not one to hand a stochastic light sampler.
; In ShadowQuality because what it switches is shadowing; if 5.8's
; BaseScalability.ini sets it in another group that applies later, that
; group wins, and the MegaLights view mode is the check.
[ShadowQuality@0]
r.MegaLights.Allow=0

[ShadowQuality@1]
r.MegaLights.Allow=0

[ShadowQuality@2]
r.MegaLights.Allow=1

[ShadowQuality@3]
r.Shadow.Virtual.Enable=1
r.MegaLights.Allow=1

[GlobalIlluminationQuality@3]
r.Lumen.ScreenProbeGather.RadianceCache.ProbeResolution=32

[ReflectionQuality@3]
r.Lumen.Reflections.Allow=1

[GlobalIlluminationQuality@Cine]
r.Lumen.ScreenProbeGather.RadianceCache.ProbeResolution=48
r.LumenScene.Radiosity.ProbeSpacing=1

[ReflectionQuality@Cine]
r.Lumen.Reflections.MaxRoughnessToTrace=0.8

[ShadowQuality@Cine]
r.Shadow.Virtual.ResolutionLodBiasLocal=-1
r.MegaLights.Allow=1
