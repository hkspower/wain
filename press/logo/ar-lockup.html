<meta charset="utf-8">
<title>ليالي شارع الخليج — lockup</title>
<style>
  @font-face { font-family:"PlexAr"; src:url("fonts/IBMPlexSansArabic-Bold.woff2") format("woff2"); font-weight:700; }
  @font-face { font-family:"PlexAr"; src:url("fonts/IBMPlexSansArabic-Regular.woff2") format("woff2"); font-weight:400; }
  @font-face { font-family:"Shoulders"; src:url("file:///root/.claude/skills/synced/canvas-design/canvas-fonts/BigShoulders-Bold.ttf"); font-weight:700; }
  @font-face { font-family:"Mono"; src:url("file:///root/.claude/skills/synced/canvas-design/canvas-fonts/GeistMono-Regular.ttf"); }
  @font-face { font-family:"Kana"; src:url("file:///usr/share/fonts/truetype/fonts-japanese-gothic.ttf"); }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1600px; height:900px; }
  body { background:#05070e; font-family:"Mono",monospace; -webkit-font-smoothing:antialiased; overflow:hidden; }
  body.bare { background:transparent; }
  body.bare .field, body.bare .vignette { display:none; }
  #stage { position:relative; width:1600px; height:900px; overflow:hidden; }
  .field { position:absolute; inset:0;
    background:
      radial-gradient(80% 58% at 50% 44%, rgba(255,176,60,0.095) 0%, rgba(0,0,0,0) 66%),
      linear-gradient(180deg,#070b16 0%,#05070e 52%,#04060c 100%); }
  .vignette { position:absolute; inset:0;
    background: radial-gradient(74% 66% at 50% 48%, rgba(0,0,0,0) 42%, rgba(0,0,0,0.56) 100%); }
  svg.art { position:absolute; inset:0; }
  .row { position:absolute; left:0; right:0; text-align:center; }
  /* Arabic is never sheared. A synthetic oblique on a cursive script
     breaks the joins and tilts the counters against the pen's own
     angle; the script carries its diagonal already. The energy comes
     from weight and from the colour split instead. */
  .ar {
    font-family:"PlexAr", serif; font-weight:700; direction:rtl;
    font-size:112px; line-height:1.24; letter-spacing:0;
    font-synthesis:none;
  }
  .ar .lay { color:#ffb03c; }   /* ليالي — the amber word, as NIGHTS is */
  .ar .st  { color:#e8ecf4; }
  .lat { font-family:"Shoulders",sans-serif; font-weight:700; transform:skewX(-11deg);
         font-size:44px; letter-spacing:0.30em; text-indent:0.30em; text-transform:uppercase;
         color:rgba(232,236,244,0.60); }
  .kana { font-family:"Kana",sans-serif; font-size:17px; letter-spacing:0.70em; text-indent:0.70em;
          color:rgba(232,236,244,0.34); }
  .tag { font-family:"Mono",monospace; font-size:11px; letter-spacing:0.46em; text-indent:0.46em;
         text-transform:uppercase; color:rgba(232,236,244,0.28); }
</style>
<div id="stage">
  <div class="field"></div>
  <svg class="art" width="1600" height="900" viewBox="0 0 1600 900" fill="none">
    <defs>
      <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#ffb03c" stop-opacity="0"/>
        <stop offset="0.5" stop-color="#ffb03c" stop-opacity="0.55"/>
        <stop offset="1" stop-color="#ffb03c" stop-opacity="0"/>
      </linearGradient>
      <filter id="soft"><feGaussianBlur stdDeviation="6"/></filter>
    </defs>
    <g id="lamps"></g>
  </svg>
  <div class="row" style="top:196px;"><span class="kana">ガルフロード・ナイツ</span></div>
  <div class="row" style="top:286px;">
    <div class="ar"><span class="lay">ليالي</span> <span class="st">شارع الخليج</span></div>
  </div>
  <div class="row" style="top:596px;"><span class="lat">Gulf Road Nights</span></div>
  <div class="row" style="top:690px;"><span class="tag">Kuwait Xtreme Racer</span></div>
  <div class="vignette"></div>
</div>
<script>
if (new URLSearchParams(location.search).has("bare")) document.body.classList.add("bare");
const NS="http://www.w3.org/2000/svg";
const el=(n,a)=>{const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);return e;};
let seed=20240517; const rnd=()=>(seed=(seed*1664525+1013904223)%4294967296)/4294967296;
{
  const g=document.getElementById("lamps");
  const N=88, x0=470, x1=1130, baseY=524, cx=800, cy=-1400, r=1900;
  g.appendChild(el("rect",{x:x0,y:baseY,width:x1-x0,height:0.8,fill:"url(#rule)"}));
  for(let i=0;i<N;i++){
    const t=i/(N-1), x=x0+t*(x1-x0);
    const dx=x-cx, drop=r-Math.sqrt(Math.max(0,r*r-dx*dx));
    const y=baseY-drop*0.055;
    const swell=0.5+0.5*Math.sin(t*Math.PI);
    const H=(9+swell*24)*(0.9+rnd()*0.2);
    const edge=Math.min(1,Math.min(t,1-t)/0.2), o=swell*edge;
    g.appendChild(el("rect",{x:x.toFixed(2),y:(y-H).toFixed(2),width:0.8,height:H.toFixed(2),
      fill:"#ffb03c","fill-opacity":(o*0.22).toFixed(3)}));
    g.appendChild(el("circle",{cx:x.toFixed(2),cy:(y-H).toFixed(2),r:1.5,
      fill:"#ffd7a0","fill-opacity":(0.28+o*0.6).toFixed(3)}));
    if(i%4===0) g.appendChild(el("circle",{cx:x.toFixed(2),cy:(y-H).toFixed(2),r:8,
      fill:"#ffb03c","fill-opacity":(o*0.12).toFixed(3),filter:"url(#soft)"}));
  }
}
</script>
