<meta charset="utf-8">
<title>متسابق الليل — lockup</title>
<style>
  @font-face { font-family:"PlexAr"; src:url("fonts/IBMPlexSansArabic-Bold.woff2") format("woff2"); font-weight:700; }
  @font-face { font-family:"PlexAr"; src:url("fonts/IBMPlexSansArabic-Regular.woff2") format("woff2"); font-weight:400; }
  @font-face { font-family:"Shoulders"; src:url("fonts/BigShoulders-Bold.ttf"); font-weight:700; }
  @font-face { font-family:"Mono"; src:url("fonts/GeistMono-Regular.ttf"); }
  /* Japanese gothic, vendored — see the note in lockup.html. Neither the
     local() nor the url() this used to name resolved on this image, so
     every mark had been quietly setting its kana in IPA Gothic; it is
     vendored under its own name now so the result is the same on any
     checkout. */
  @font-face { font-family: "Kana"; src: url("fonts/IPAGothic.ttf"); }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1600px; height:900px; }
  body { background:#05070e; font-family:"Mono",monospace; -webkit-font-smoothing:antialiased; overflow:hidden; }
  body.bare { background:transparent; }
  body.bare .field, body.bare .vignette { display:none; }
  #stage { position:relative; width:1600px; height:900px; overflow:hidden; }
  .field { position:absolute; inset:0;
    background:
      radial-gradient(80% 58% at 50% 44%, rgba(255,176,60,0.095) 0%, rgba(0,0,0,0) 66%),
      linear-gradient(180deg,#070b16 0%,#05070e 52%,#04060c 100%); }
  .vignette { position:absolute; inset:0;
    background: radial-gradient(74% 66% at 50% 48%, rgba(0,0,0,0) 42%, rgba(0,0,0,0.56) 100%); }
  svg.art { position:absolute; inset:0; }
  .row { position:absolute; left:0; right:0; text-align:center; }
  /* Arabic is never sheared. A synthetic oblique on a cursive script
     breaks the joins and tilts the counters against the pen's own
     angle; the script carries its diagonal already. The energy comes
     from weight and from the colour split instead. */
  .ar {
    font-family:"PlexAr", serif; font-weight:700; direction:rtl;
    font-size:112px; line-height:1.24; letter-spacing:0;
    font-synthesis:none;
  }
  /* The amber word leads on the RIGHT, where the reader starts, and it
     is the same word the Latin sets in amber: متسابق is RACER. The two
     hierarchies agree without either being a translation of the other's
     layout. */
  .ar .lay { color:#ffb03c; }
  .ar .st  { color:#e8ecf4; }
  .lat { font-family:"Shoulders",sans-serif; font-weight:700; transform:skewX(-11deg);
         font-size:44px; letter-spacing:0.30em; text-indent:0.30em; text-transform:uppercase;
         color:rgba(232,236,244,0.60); }
  .kana { font-family:"Kana",sans-serif; font-size:17px; letter-spacing:0.70em; text-indent:0.70em;
          color:rgba(232,236,244,0.34); }
  .tag { font-family:"Mono",monospace; font-size:11px; letter-spacing:0.46em; text-indent:0.46em;
         text-transform:uppercase; color:rgba(232,236,244,0.28); }
</style>
<div id="stage">
  <div class="field"></div>
  <svg class="art" width="1600" height="900" viewBox="0 0 1600 900" fill="none">
    <defs>
      <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#ffb03c" stop-opacity="0"/>
        <stop offset="0.5" stop-color="#ffb03c" stop-opacity="0.55"/>
        <stop offset="1" stop-color="#ffb03c" stop-opacity="0"/>
      </linearGradient>
      <filter id="soft"><feGaussianBlur stdDeviation="6"/></filter>
    </defs>
    <g id="lamps"></g>
  </svg>
  <div class="row" style="top:196px;"><span class="kana">ナイトレーサー</span></div>
  <div class="row" style="top:286px;">
    <div class="ar"><span class="lay">متسابق</span> <span class="st">الليل</span></div>
  </div>
  <div class="row" style="top:596px;"><span class="lat">Night Racer</span></div>
  <div class="row" style="top:690px;"><span class="tag">Kuwait Xtreme Racer</span></div>
  <div class="vignette"></div>
</div>
<script>
if (new URLSearchParams(location.search).has("bare")) document.body.classList.add("bare");
const NS="http://www.w3.org/2000/svg";
const el=(n,a)=>{const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);return e;};
{
  // The same night the Latin lockup surveys, at this composition's
  // height. See lockup.html for why the motif is an hour and not a road.
  const g=document.getElementById("lamps");
  const x0=470, x1=1130, y=524, W=x1-x0;
  const OPEN=0, CLOSE=5+50/60;                 // src/game/clock.ts
  const at=(h)=>x0+(h/24)*W;
  const txt=(x,yy,str,a)=>{const t=el("text",{x,y:yy,...a});t.textContent=str;return t;};
  g.appendChild(el("rect",{x:x0,y:y,width:W,height:0.8,fill:"#46c9ee","fill-opacity":0.20}));
  for(let h=0;h<=24;h++){
    const major=h%6===0, x=at(h);
    g.appendChild(el("rect",{x:x.toFixed(2),y:(y-(major?7:3.5)).toFixed(2),
      width:0.8,height:(major?7:3.5).toFixed(2),
      fill:"#e8ecf4","fill-opacity":(major?0.34:0.17).toFixed(2)}));
  }
  const xa=at(OPEN), xb=at(CLOSE);
  g.appendChild(el("rect",{x:xa.toFixed(2),y:(y-2).toFixed(2),
    width:(xb-xa).toFixed(2),height:3.6,fill:"#ffb03c","fill-opacity":0.85}));
  g.appendChild(el("rect",{x:xa.toFixed(2),y:(y-9).toFixed(2),
    width:(xb-xa).toFixed(2),height:18,fill:"#ffb03c","fill-opacity":0.10,filter:"url(#soft)"}));
  for(const [x,h] of [[xa,13],[xb,20]])
    g.appendChild(el("rect",{x:x.toFixed(2),y:(y-h).toFixed(2),width:1.2,height:h,
      fill:"#ffd7a0","fill-opacity":0.9}));
  const lab={"font-family":"Mono, monospace","font-size":"12","letter-spacing":"2.2",
    "fill":"#ffb03c","fill-opacity":"0.72"};
  g.appendChild(txt(xa.toFixed(2),(y+26).toFixed(2),"00:00",{...lab,"text-anchor":"start"}));
  g.appendChild(txt(xb.toFixed(2),(y+26).toFixed(2),"05:50",{...lab,"text-anchor":"end"}));
  g.appendChild(txt(x1.toFixed(2),(y+26).toFixed(2),"24:00",
    {...lab,"text-anchor":"end","fill":"#46c9ee","fill-opacity":"0.34"}));
}
</script>
