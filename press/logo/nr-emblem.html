<meta charset="utf-8">
<title>Night Racers — emblem</title>
<style>
  @font-face { font-family:"Shoulders"; src:url("file:///root/.claude/skills/synced/canvas-design/canvas-fonts/BigShoulders-Bold.ttf"); font-weight:700; }
  @font-face { font-family:"Mono"; src:url("file:///root/.claude/skills/synced/canvas-design/canvas-fonts/GeistMono-Regular.ttf"); }
  @font-face { font-family:"Kana"; src:url("file:///usr/share/fonts/truetype/fonts-japanese-gothic.ttf"); }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:900px; height:900px; background:transparent; overflow:hidden; }
</style>
<svg width="900" height="900" viewBox="0 0 900 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#46c9ee" stop-opacity="0.5"/>
      <stop offset="0.5" stop-color="#ffb03c" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ffb03c" stop-opacity="0.2"/>
    </linearGradient>
    <radialGradient id="core" cx="0.5" cy="0.42" r="0.62">
      <stop offset="0" stop-color="#1a1206"/>
      <stop offset="1" stop-color="#05070e"/>
    </radialGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="6"/></filter>
    <path id="rimTop" d="M 450 450 m -322 0 a 322 322 0 0 1 644 0" fill="none"/>
    <path id="rimBot" d="M 450 450 m -296 0 a 296 296 0 0 0 592 0" fill="none"/>
  </defs>

  <circle cx="450" cy="450" r="368" fill="url(#core)"/>
  <circle cx="450" cy="450" r="368" stroke="url(#ring)" stroke-width="2.4"/>
  <circle cx="450" cy="450" r="348" stroke="#e8ecf4" stroke-opacity="0.12" stroke-width="0.9"/>

  <!-- 360 graduations: a full turn, counted -->
  <g id="rim"></g>
  <!-- the disc the night is measured against -->
  <circle cx="450" cy="450" r="176" fill="#ffb03c" fill-opacity="0.07"/>
  <circle cx="450" cy="450" r="176" stroke="#ffb03c" stroke-opacity="0.32" stroke-width="1.2"/>
  <circle cx="450" cy="450" r="176" fill="#ffb03c" fill-opacity="0.05" filter="url(#soft)"/>

  <text x="450" y="452" text-anchor="middle" dominant-baseline="middle"
        font-family="Kana" font-size="97" letter-spacing="2" fill="#ffcf8a">走り屋</text>

  <text font-family="Kana" font-size="24" letter-spacing="14" fill="#e8ecf4" fill-opacity="0.44">
    <textPath href="#rimTop" startOffset="50%" text-anchor="middle">ナイトレーサーズ</textPath>
  </text>
  <text font-family="Mono" font-size="21" letter-spacing="11" fill="#e8ecf4" fill-opacity="0.52">
    <textPath href="#rimBot" startOffset="50%" text-anchor="middle">NIGHT RACERS</textPath>
  </text>
</svg>
<script>
const NS="http://www.w3.org/2000/svg";
const el=(n,a)=>{const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);return e;};
{
  const g=document.getElementById("rim");
  for(let i=0;i<72;i++){
    const a=(i/72)*Math.PI*2-Math.PI/2, major=i%6===0, R=348, L=major?14:7;
    // Both name arcs are left clear. Ticks running through the type is
    // the difference between a graduated bezel and a busy one.
    const deg=(i/72)*360;
    if (deg>144 && deg<216) continue;   // Latin name, bottom
    if (deg<38 || deg>322) continue;    // katakana, top
    g.appendChild(el("line",{
      x1:(450+Math.cos(a)*R).toFixed(2), y1:(450+Math.sin(a)*R).toFixed(2),
      x2:(450+Math.cos(a)*(R-L)).toFixed(2), y2:(450+Math.sin(a)*(R-L)).toFixed(2),
      stroke:"#e8ecf4","stroke-opacity":major?0.36:0.16,"stroke-width":major?1.3:0.8}));
  }
  // four cardinal marks in amber: the fixed points of a turn
  for(const deg of [0,90,180,270]){
    const a=deg*Math.PI/180-Math.PI/2, R=316;
    g.appendChild(el("circle",{cx:(450+Math.cos(a)*R).toFixed(2),cy:(450+Math.sin(a)*R).toFixed(2),
      r:2.2,fill:"#ffb03c","fill-opacity":0.7}));
  }
}
</script>
