<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Night Racer — The machines — portrait</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;900&family=IBM+Plex+Sans+Arabic:wght@700&display=swap">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #0a0b0d; }
  .plate { position: relative; overflow: hidden; background: #f4f5f7; color: #0a0b0d;
           font-family: "Barlow Condensed", "Arial Narrow", Impact, sans-serif; }
  /* Arabic set as Arabic: its own face, and never letter-spaced —
     tracking breaks the joins in a cursive script. */
  .ar { font-family: "IBM Plex Sans Arabic", "Noto Sans Arabic", Tahoma, sans-serif;
        font-weight: 700; letter-spacing: normal; }
  .sfx { font-weight: 900; line-height: 0.82; color: #ffc45c; text-transform: uppercase;
         -webkit-text-stroke: 7px #0a0b0d; paint-order: stroke fill; text-shadow: 14px 14px 0 #0a0b0d; }
  .panel { position: absolute; background: #0a0b0d; padding: 13px; }
  .panel > .in { position: relative; width: 100%; height: 100%; overflow: hidden; background: #0a0b0d; }
  .panel img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .tone { position: absolute; inset: 0; mix-blend-mode: multiply; }
  .burst { position: absolute; inset: 0; }
  .balloon { position: absolute; background: #f4f5f7; border: 8px solid #0a0b0d;
             border-radius: 50% / 36%; box-shadow: 10px 10px 0 #0a0b0d; }
  .tail-o, .tail-i { position: absolute; width: 0; height: 0; }
  .chip { position: absolute; background: #f4f5f7; border: 5px solid #0a0b0d;
          font-weight: 900; text-transform: uppercase; white-space: nowrap; }
</style>
</head>
<body>
<div class="plate" style="width:1080px; height:1350px;">
  <div style="position:absolute; left:0; top:0; width:1080px; height:14px; background:#ffc45c;"></div>
<div class="chip" style="right:44px; top:42px; padding:6px 16px; font-size:26px; letter-spacing:0.12em;">
  <span class="ar" lang="ar" style="letter-spacing:normal;">٣/٤</span>
</div>
  <div style="position:absolute; left:135px; top:84px; font-size:30px; font-weight:700; letter-spacing:0.22em; text-transform:uppercase;">Seventeen of them</div>
  <div style="position:absolute; left:135px; top:118px; font-size:132px; font-weight:900; line-height:0.84; text-transform:uppercase;">The<br>machines</div>
  <div class="ar" lang="ar" dir="rtl" style="position:absolute; right:135px; top:132px; font-size:60px; line-height:1.18; text-align:right;">السيارات</div>

  <div class="panel" style="left:60px; top:430px; width:960px; height:500px; clip-path:polygon(0% 2%, 100% 0%, 100% 98%, 0% 100%);">
  <div class="in" style="clip-path:polygon(0% 2%, 100% 0%, 100% 98%, 0% 100%);">
    <img src="img/drift.jpg" style="object-position:48% 62%;">
    <div class="burst" style="background: repeating-conic-gradient(from 0deg at 44% 76%, #0a0b0d 0deg 0.55deg, transparent 0.55deg 3.6deg);
         -webkit-mask: radial-gradient(circle at 44% 76%, transparent 20%, #000 56%);
         mask: radial-gradient(circle at 44% 76%, transparent 20%, #000 56%); opacity: 0.62;"></div>
    <div class="tone" style="background-image: radial-gradient(#0a0b0d 1.7px, transparent 2.1px); background-size: 11px 11px; opacity: 0.4; -webkit-mask: linear-gradient(#000 0%, #000 30%, transparent 58%); mask: linear-gradient(#000 0%, #000 30%, transparent 58%);"></div>
  </div>
</div>
  <div class="sfx" style="position:absolute; right:110px; top:440px; font-size:104px; transform:rotate(-6deg) skew(-11deg); z-index:4; text-align:right;">Drift!</div>
  <div class="sfx ar" lang="ar" style="position:absolute; right:120px; top:566px; font-size:76px; transform:rotate(-6deg); z-index:4; -webkit-text-stroke:6px #0a0b0d; text-shadow:10px 10px 0 #0a0b0d;">صرييييير</div>

  <div class="balloon" style="left:140px; top:728px; width:548px; padding:26px 30px 20px;">
  <div class="ar" lang="ar" dir="rtl" style="font-size:34px; line-height:1.5; text-align:center;">الغبار اللي وراك؟ هذا أنا</div>
  <div style="margin-top:8px; font-size:24px; font-weight:700; letter-spacing:0.07em; text-transform:uppercase; text-align:center;">That dust behind you? That's me</div>
  <div style="margin-top:10px; font-size:21px; font-weight:900; letter-spacing:0.09em; text-transform:uppercase; text-align:center; color:#ce742a;">Bu Torab &middot; <span class="ar" lang="ar" style="letter-spacing:normal;">بو تراب</span></div>
  <div class="tail-o" style="left:56px; bottom:-52px; border-left:26px solid transparent; border-right:26px solid transparent; border-top:52px solid #0a0b0d;"></div>
         <div class="tail-i" style="left:66px; bottom:-34px; border-left:16px solid transparent; border-right:16px solid transparent; border-top:36px solid #f4f5f7;"></div>
</div>

  <div style="position:absolute; left:135px; right:135px; top:1046px; display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:22px;">
    <div style="display:flex; flex-direction:column; gap:4px;">
      <div style="font-size:64px; font-weight:900; line-height:1;">415</div>
      <div style="font-size:26px; font-weight:700; letter-spacing:0.08em; text-transform:uppercase; color:#ce742a;">km/h &middot; Black Demon</div>
    </div>
    <div style="display:flex; flex-direction:column; gap:4px;">
      <div style="font-size:64px; font-weight:900; line-height:1;">405</div>
      <div style="font-size:26px; font-weight:700; letter-spacing:0.08em; text-transform:uppercase; color:#ce742a;">km/h &middot; Zeta 300 GTR</div>
    </div>
    <div style="display:flex; flex-direction:column; gap:4px;">
      <div style="font-size:64px; font-weight:900; line-height:1;">195</div>
      <div style="font-size:26px; font-weight:700; letter-spacing:0.08em; text-transform:uppercase; color:#ce742a;">km/h &middot; Jahra Pickup</div>
    </div>
  </div>
  <div style="position:absolute; left:0; top:1246px; width:1080px; height:104px; background:#0a0b0d; color:#f4f5f7;
     display:flex; align-items:center; justify-content:space-between; padding:0 44px;">
  <div style="font-size:28px; font-weight:900; letter-spacing:0.16em; text-transform:uppercase;">Hold Space to drift</div>
  <div style="font-size:26px; font-weight:700; letter-spacing:0.12em; text-transform:uppercase; color:#ffc45c;">
    Link in bio &middot; <span class="ar" lang="ar" style="letter-spacing:normal;">الرابط في البايو</span>
  </div>
</div>
</div>
</body>
</html>
