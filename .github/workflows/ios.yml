name: iOS app (Capacitor)

# Wraps the static export as a native iOS shell — the same `out/` the web
# deploy ships, inside a WKWebView, via capacitor.config.ts. See that file for
# why there is no server.url and what changes shape for صوت وين as a result.
#
# UNVERIFIED BY EXECUTION, UNLIKE deploy.yml
#
# Every claim in deploy.yml's own comments — the endpoint, the HMAC, the
# manifest prune, the build-id proof — was measured against the live site from
# a session that could reach it. This workflow cannot be: there is no macOS,
# no Xcode, no Simulator and no Apple signing toolchain anywhere this sandbox
# can reach, so nothing here has actually run end to end. `npx cap add ios`
# and the icon generation WERE run, once, by hand, in this sandbox — Capacitor
# 8 scaffolds through Swift Package Manager, so both succeeded with no
# CocoaPods step at all, which is why none appears below. The xcodebuild and
# signing steps are written from Apple's and Capacitor's own documented
# flags, not from a passing run, and the first real workflow_dispatch is where
# they get proven. Treat a failure here as new information, not a regression.
#
# WHY workflow_dispatch ONLY
#
# deploy.yml runs on every push because ubuntu-latest minutes are cheap and
# staging is meant to track the branch. macOS runners bill at several times
# that rate for a build nothing here can review the output of — running one
# per push would spend real money proving the same pipeline works, repeatedly,
# unwatched. A person asking for it is the same discipline production
# deploys already use.
#
# TWO JOBS, TWO DIFFERENT THINGS THEY PROVE
#
#   build-simulator — always runs on dispatch. Unsigned: iOS Simulator builds
#     need no signing identity at all, so this needs no Apple secrets and
#     proves the web content actually loads in a native shell.
#
#   build-signed — only runs when every Apple secret below is present, and
#     produces a distributable .ipa as a workflow artifact for someone to
#     install on a real device or hand to Transporter — it does not submit to
#     App Store Connect. That step needs its own API key and is not written
#     here; nothing in this session could exercise it even once.
on:
  workflow_dispatch:
    inputs:
      export_method:
        description: "How build-signed exports the .ipa (ignored by build-simulator)"
        type: choice
        default: ad-hoc
        options: [development, ad-hoc, app-store]

jobs:
  build-simulator:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Same build wain deploys, with one override: voice.ts's TTS_URL
      # defaults to the relative /api/tts.php, correct on the web because the
      # page and the bridge share an origin. A bundled app has none, so this
      # points it at the absolute one instead — see capacitor.config.ts.
      # Voice clips are not pre-rendered here (no ELEVENLABS_API_KEY wired
      # into this workflow): sentences render live through the bridge on
      # first play instead of coming from a local cache, same as any visitor
      # before their clip is cached.
      - name: Build static export (produces out/)
        env:
          NEXT_PUBLIC_ELEVENLABS_AGENT_ID: ${{ vars.ELEVENLABS_AGENT_ID }}
          NEXT_PUBLIC_WAIN_TTS_URL: https://www.wainkw.com/api/tts.php
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: npm run build

      # ios/ is gitignored (see .gitignore) and scaffolded fresh every run,
      # for the same reason public/voice/ is not committed: a tracked native
      # project drifts from capacitor.config.ts silently, and nobody editing
      # this repo has Xcode to notice. `cap add` copies out/ into the project
      # as its last step, so it must run after the build above, not before.
      - name: Add the iOS platform
        run: npx cap add ios

      # Everything this writes is either a hard crash or a refused upload if
      # it is missing. The template ships no usage strings at all, so a build
      # without this step is KILLED by iOS the first time anyone taps
      # «استخدم موقعي» on the home page — not a denied permission, a crash —
      # and a Simulator screenshot of the launch screen still passes. It also
      # installs the privacy manifest Apple has required since May 2024, and
      # replaces the template's armv7 device capability with arm64.
      # Proven on Linux by `npm run test:ios`, which scaffolds a real project
      # and reads the result back with a plist parser.
      - name: Make the project submittable (Info.plist, privacy manifest)
        run: npm run ios:patch

      # Easy Mode wants assets/logo.png at the repo root, not public/brand/ —
      # generated here rather than duplicated in git so the two can never
      # drift. The source is the 1024x1024 written by `npm run icon:app`,
      # rendered from the mark itself: feeding Capacitor the old 512 let it
      # upscale, which is how a soft icon reaches a store listing without
      # anyone deciding to ship one. That file is asserted alpha-free at
      # generation time — an icon carrying transparency is refused at UPLOAD,
      # after the archive and the signing have already succeeded.
      - name: Generate app icons and splash screens
        run: |
          mkdir -p assets
          cp public/brand/app-icon-1024.png assets/logo.png
          npx capacitor-assets generate --ios \
            --iconBackgroundColor '#ffffff' --iconBackgroundColorDark '#111111' \
            --splashBackgroundColor '#ffffff' --splashBackgroundColorDark '#111111'

      # No signing identity is needed for iphonesimulator at all — Xcode signs
      # simulator builds with a null identity by default. CODE_SIGNING_ALLOWED
      # is set explicitly anyway so a misconfigured runner cannot silently
      # reach for one.
      - name: Build for the Simulator
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App \
            -sdk iphonesimulator -configuration Debug \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build

      # Proves the app actually launches, not just that it compiled — a
      # native shell whose WebView shows nothing can build cleanly.
      - name: Boot a Simulator and launch the app
        run: |
          set -euo pipefail
          device=$(xcrun simctl list devices available | grep -m1 'iPhone' | sed -E 's/.*\(([-0-9A-F]+)\).*/\1/')
          test -n "$device" || { echo "::error::No available iPhone simulator on this runner"; exit 1; }
          xcrun simctl boot "$device"
          app_path=$(find build/Build/Products -maxdepth 2 -name 'App.app' | head -1)
          test -n "$app_path" || { echo "::error::App.app not found in build output"; exit 1; }
          xcrun simctl install "$device" "$app_path"
          xcrun simctl launch "$device" com.wainkw.app
          sleep 5
          mkdir -p screenshot
          xcrun simctl io "$device" screenshot screenshot/launch.png

      - name: Upload launch screenshot
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-launch
          path: screenshot/launch.png
          retention-days: 14

  build-signed:
    runs-on: macos-latest
    # Gate the whole job, not individual steps: a partially-run signing job
    # that gets as far as importing a certificate before failing on a missing
    # profile is a worse failure than not starting.
    if: >-
      vars.APPLE_TEAM_ID != '' &&
      secrets.APPLE_CERTIFICATE_P12_BASE64 != '' &&
      secrets.APPLE_CERTIFICATE_PASSWORD != '' &&
      secrets.APPLE_PROVISIONING_PROFILE_BASE64 != ''
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static export (produces out/)
        env:
          NEXT_PUBLIC_ELEVENLABS_AGENT_ID: ${{ vars.ELEVENLABS_AGENT_ID }}
          NEXT_PUBLIC_WAIN_TTS_URL: https://www.wainkw.com/api/tts.php
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Add the iOS platform
        run: npx cap add ios

      # Everything this writes is either a hard crash or a refused upload if
      # it is missing. The template ships no usage strings at all, so a build
      # without this step is KILLED by iOS the first time anyone taps
      # «استخدم موقعي» on the home page — not a denied permission, a crash —
      # and a Simulator screenshot of the launch screen still passes. It also
      # installs the privacy manifest Apple has required since May 2024, and
      # replaces the template's armv7 device capability with arm64.
      # Proven on Linux by `npm run test:ios`, which scaffolds a real project
      # and reads the result back with a plist parser.
      - name: Make the project submittable (Info.plist, privacy manifest)
        run: npm run ios:patch

      - name: Generate app icons and splash screens
        run: |
          mkdir -p assets
          cp public/brand/app-icon-1024.png assets/logo.png
          npx capacitor-assets generate --ios \
            --iconBackgroundColor '#ffffff' --iconBackgroundColorDark '#111111' \
            --splashBackgroundColor '#ffffff' --splashBackgroundColorDark '#111111'

      # A dedicated keychain rather than the runner's login keychain: it is
      # thrown away at the end of the job by name, so a step that fails
      # halfway never leaves a signing identity sitting on a shared runner.
      - name: Import the signing certificate
        env:
          P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PASSWORD=$(openssl rand -base64 24)
          echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> "$GITHUB_ENV"
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          echo "$P12_BASE64" | base64 --decode > certificate.p12
          security import certificate.p12 -k build.keychain -P "$P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" build.keychain
          security list-keychain -d user -s build.keychain login.keychain
          rm -f certificate.p12

      - name: Install the provisioning profile
        env:
          PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$PROFILE_BASE64" | base64 --decode > profile.mobileprovision
          uuid=$(security cms -D -i profile.mobileprovision | \
            /usr/libexec/PlistBuddy -c 'Print UUID' /dev/stdin)
          name=$(security cms -D -i profile.mobileprovision | \
            /usr/libexec/PlistBuddy -c 'Print Name' /dev/stdin)
          cp profile.mobileprovision "$HOME/Library/MobileDevice/Provisioning Profiles/$uuid.mobileprovision"
          {
            echo "PROFILE_UUID=$uuid"
            echo "PROFILE_NAME=$name"
          } >> "$GITHUB_ENV"
          rm -f profile.mobileprovision

      - name: Archive
        env:
          TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App \
            -sdk iphoneos -configuration Release \
            -archivePath build/App.xcarchive \
            -derivedDataPath build \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID" \
            archive

      - name: Export the .ipa
        env:
          TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          METHOD: ${{ inputs.export_method }}
        run: |
          cat > ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>${METHOD}</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.wainkw.app</key><string>${PROFILE_NAME}</string>
            </dict>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath build/App.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist ExportOptions.plist

      - name: Upload the signed .ipa
        uses: actions/upload-artifact@v4
        with:
          name: wain-ios-signed
          path: build/export/*.ipa
          retention-days: 14

      # The keychain leaves with the job either way; a failed export must not
      # leave a signing identity behind on a runner GitHub will reuse.
      - name: Remove the temporary keychain
        if: always()
        run: security delete-keychain build.keychain || true
