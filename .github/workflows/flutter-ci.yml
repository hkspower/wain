name: Flutter app (analyze, test, web build)

# Runs on every change to the app or to anything it is generated from. This is
# the cheap, always-on half: the same analyze + test + web build that were run
# by hand in the sandbox that wrote the app. The signed and device builds are
# android-flutter.yml and the iOS job below, both dispatch-only.
#
# WHAT IS AND IS NOT PROVEN, honestly
#   proven here (and in the authoring sandbox): analyze, the unit + widget +
#     protocol suites, and `flutter build web` — 340+ tests, including the
#     search/hangout/helper parity suites that replay the web's own answers.
#   NOT proven by anything in this repository: an Android or iOS binary, a real
#     شوق call (microphone + the ElevenLabs session), real map tiles, a device.
#     The authoring sandbox refuses dl.google.com, api.elevenlabs.io and
#     tile.openstreetmap.org, so those were exercised only against local fakes.
on:
  push:
    branches: [claude/wainkw-design-issues-2bggdi]
    paths:
      - "flutter_app/**"
      - "scripts/*flutter*.mjs"
      - "src/lib/**"
      - "src/app/theme.css"
      - "src/components/**"
      - ".github/workflows/flutter-ci.yml"
  workflow_dispatch:
    inputs:
      testflight:
        description: "Also archive and upload a build to TestFlight (needs the App Store Connect key; see flutter_app/docs/ios-testflight.md)"
        type: boolean
        default: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The drawings are rendered in a real browser.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: The generated half is current
        run: CHROMIUM_PATH="$(node -e "console.log(require('playwright').chromium.executablePath())")" npm run audit:flutter

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true

      - name: flutter pub get
        working-directory: flutter_app
        run: flutter pub get

      - name: flutter analyze
        working-directory: flutter_app
        run: flutter analyze

      - name: flutter test
        working-directory: flutter_app
        run: flutter test

      - name: flutter build web
        working-directory: flutter_app
        run: flutter build web --release --no-wasm-dry-run

      - uses: actions/upload-artifact@v4
        with:
          name: wain-flutter-web
          path: flutter_app/build/web
          retention-days: 7

  # iOS needs a Mac. Dispatch-only and UNVERIFIED BY EXECUTION, the same honest
  # limitation ios.yml states for the Capacitor app: nothing reachable from the
  # session that wrote this can run Xcode. `--no-codesign` proves the project
  # compiles and links; signing is a separate decision (see ios.yml's secrets).
  build-ios:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true
      - name: flutter pub get
        working-directory: flutter_app
        run: flutter pub get
      - name: Build (no codesign)
        working-directory: flutter_app
        run: flutter build ios --release --no-codesign
      - uses: actions/upload-artifact@v4
        with:
          name: wain-flutter-ios-unsigned
          path: flutter_app/build/ios/iphoneos/Runner.app
          retention-days: 7

  # ── Real iOS tests: the Simulator suite and TestFlight ──────────────────────
  #
  # These three jobs were written as their own workflow, ios-flutter.yml, and it
  # could not be started: GitHub answers 404 to a workflow_dispatch for a file
  # that is not on the repository's default branch, and this branch is not it.
  # flutter-ci.yml is registered there, and a dispatch at this branch's ref runs
  # this branch's copy of the file — so the jobs live here, dispatch-only.
  #
  # The real tests for flutter_app/ on iOS, asked for on 1 October: «make real
  # test for app ios», on the iOS Simulator AND on the owner's own iPhone through
  # TestFlight. Owner-side setup (App Store Connect app, API key, secrets) is in
  # flutter_app/docs/ios-testflight.md.
  #
  # UNVERIFIED BY EXECUTION when written: the session that wrote this has no Mac,
  # no Xcode and no Simulator. What it could run, it ran: the integration flows
  # under the Flutter test host with the iOS platform override (6 of 6), the
  # back-swipe regression in the widget suite (red without its fix, green with),
  # and tests/pick-ios-simulator.test.mjs. A failure here is new information.
  #
  # WHY workflow_dispatch ONLY — macOS minutes cost several times Linux ones; the
  # same reasoning as ios.yml and the build-ios job in flutter-ci.yml.
  #
  # THREE JOBS
  #
  #   simulator (×2: the newest «iPhone N Pro» and the smallest iPhone the runner
  #     carries) — `flutter drive` of integration_test/app_test.dart on a booted
  #     Simulator: real engine, real plugins, real network for map tiles, real
  #     gestures. Screenshots of every screen are uploaded. Needs no secrets.
  #
  #   check-testflight — resolves the App Store Connect secrets into a plain
  #     output; a job-level `if:` cannot read `secrets` (ios.yml learned that at
  #     parse time on 29 September).
  #
  #   testflight — only when chosen at dispatch AND the key is configured:
  #     archive with automatic (cloud-managed) signing through the API key, then
  #     export straight to App Store Connect. The build appears in TestFlight
  #     after Apple processes it; install it with the TestFlight app.


  ios-simulator:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        kind: [large, small]
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true

      - name: flutter pub get
        working-directory: flutter_app
        run: flutter pub get

      # Device names move with every runner image, so they are read, not
      # written down (scripts/pick-ios-simulator.mjs).
      - name: Pick the simulator
        id: sim
        run: |
          xcrun simctl list devices available -j | node scripts/pick-ios-simulator.mjs ${{ matrix.kind }} >> "$GITHUB_OUTPUT"
          xcrun simctl list devices available -j | node scripts/pick-ios-simulator.mjs ${{ matrix.kind }}

      - name: Boot it
        run: |
          xcrun simctl boot "${{ steps.sim.outputs.udid }}"
          xcrun simctl bootstatus "${{ steps.sim.outputs.udid }}" -b

      # The microphone test reads this grant back. TCC entries are keyed by
      # bundle id, so the grant can precede the install.
      - name: Grant the microphone to com.wainkw.app
        run: xcrun simctl privacy "${{ steps.sim.outputs.udid }}" grant microphone com.wainkw.app

      # Built on its own, with its own clock, so a slow or stuck Xcode build
      # is told apart from a stuck test: the first dispatch (run 36901958536)
      # sat in one combined «flutter drive» step for over half an hour with no
      # log to read until the job's own timeout ended it. The drive below
      # reuses this build's cache.
      - name: Build for the simulator (debug)
        working-directory: flutter_app
        timeout-minutes: 25
        run: flutter build ios --simulator --debug --target=integration_test/app_test.dart

      # The iPhone 17e hung twice in three runs right AFTER the build, with no
      # test output for 20 minutes and an orphaned `simctl` killed at cleanup
      # (runs 36910871005 attempt 1 and 36928411775): the install or the
      # launch, not a test. The install is its own step now, bounded, and a
      # stuck one reboots the simulator and tries again; the drive then reuses
      # this exact binary instead of rebuilding and reinstalling it.
      - name: Install on the simulator
        working-directory: flutter_app
        timeout-minutes: 12
        run: |
          app=build/ios/iphonesimulator/Runner.app
          udid="${{ steps.sim.outputs.udid }}"
          for attempt in 1 2 3; do
            if perl -e 'alarm shift; exec @ARGV' 150 xcrun simctl install "$udid" "$app"; then
              echo "installed on attempt $attempt"
              exit 0
            fi
            echo "::warning::simctl install did not finish in 150 s (attempt $attempt); rebooting the simulator"
            xcrun simctl shutdown "$udid" || true
            xcrun simctl boot "$udid"
            xcrun simctl bootstatus "$udid" -b
            xcrun simctl privacy "$udid" grant microphone com.wainkw.app || true
          done
          exit 1

      # --verbose goes to the artifact in full; the job log keeps the lines
      # that say where a run is (install, launch, the VM service, each test),
      # so a hang names its own step.
      - name: flutter drive (integration_test/app_test.dart)
        working-directory: flutter_app
        timeout-minutes: 20
        env:
          SHOTS_DIR: build/shots/${{ matrix.kind }}
        run: |
          set -o pipefail
          flutter drive --verbose \
            --driver=test_driver/integration_test.dart \
            --target=integration_test/app_test.dart \
            --use-application-binary=build/ios/iphonesimulator/Runner.app \
            -d "${{ steps.sim.outputs.udid }}" 2>&1 \
            | tee build/drive-verbose-${{ matrix.kind }}.log \
            | grep --line-buffered -E "^flutter: |All tests|Some tests|\[E\]|VMServiceFlutterDriver|[Ii]nstall|[Ll]aunch|Observatory|Dart VM [Ss]ervice|[Ee]rror" \
            | tee build/drive-${{ matrix.kind }}.log

      # permission_handler compiles the microphone in only when its build
      # finds NSMicrophoneUsageDescription (or PERMISSION_MICROPHONE=1);
      # compiled out, every call on iOS would say the mic is blocked. The
      # strategy class only exists in a binary that has it.
      - name: The microphone permission is compiled into the app
        if: always()
        working-directory: flutter_app
        run: |
          app="$(find build/ios -name Runner.app -type d | head -1)"
          echo "app: $app"
          if grep -rqa AudioVideoPermissionStrategy "$app"; then
            echo "AudioVideoPermissionStrategy: present"
          else
            echo "::error::AudioVideoPermissionStrategy is not in $app — the microphone permission was compiled out"
            exit 1
          fi

      - name: Summary
        if: always()
        working-directory: flutter_app
        run: |
          {
            echo "### ${{ steps.sim.outputs.name }} — iOS ${{ steps.sim.outputs.runtime }}"
            echo
            grep -E "All tests passed|Some tests failed|\[E\]|microphone:|device:" build/drive-${{ matrix.kind }}.log | sed 's/^/    /' || true
            echo
            echo "Screenshots: $(ls build/shots/${{ matrix.kind }} 2>/dev/null | wc -l | tr -d ' ') — artifact \`ios-sim-${{ matrix.kind }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-sim-${{ matrix.kind }}
          path: |
            flutter_app/build/shots/${{ matrix.kind }}
            flutter_app/build/drive-${{ matrix.kind }}.log
            flutter_app/build/drive-verbose-${{ matrix.kind }}.log
          retention-days: 14

  check-testflight:
    if: github.event_name == 'workflow_dispatch' && inputs.testflight
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
          KEY: ${{ secrets.ASC_KEY_P8_BASE64 }}
          TEAM: ${{ vars.APPLE_TEAM_ID }}
        run: |
          missing=""
          [ -n "$TEAM" ]   || missing="$missing APPLE_TEAM_ID(variable)"
          [ -n "$KEY_ID" ] || missing="$missing ASC_KEY_ID"
          [ -n "$ISSUER" ] || missing="$missing ASC_ISSUER_ID"
          [ -n "$KEY" ]    || missing="$missing ASC_KEY_P8_BASE64"
          if [ -z "$missing" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::TestFlight skipped — not configured:$missing (see flutter_app/docs/ios-testflight.md)"
            echo "TestFlight skipped — not configured:$missing" >> "$GITHUB_STEP_SUMMARY"
          fi

  testflight:
    needs: check-testflight
    if: needs.check-testflight.outputs.ready == 'true'
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      TEAM: ${{ vars.APPLE_TEAM_ID }}
      KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ISSUER: ${{ secrets.ASC_ISSUER_ID }}
      # A build number per run: App Store Connect refuses a number it has seen
      # for this version, and run_number only goes up. Re-running a run whose
      # upload succeeded is refused for that reason — dispatch a new one.
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true

      - name: flutter pub get
        working-directory: flutter_app
        run: flutter pub get

      - name: Install the App Store Connect key
        env:
          KEY: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          echo "$KEY" | base64 --decode > "$RUNNER_TEMP/asc/AuthKey_$KEY_ID.p8"
          chmod 600 "$RUNNER_TEMP/asc/AuthKey_$KEY_ID.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/asc/AuthKey_$KEY_ID.p8" >> "$GITHUB_ENV"

      # Writes Generated.xcconfig with the version from pubspec.yaml and this
      # run's build number; the archive below compiles the Dart itself
      # through the Runner target's own build phase.
      - name: Configure the Xcode project
        working-directory: flutter_app
        run: flutter build ios --release --config-only --no-codesign --build-number="$BUILD_NUMBER"

      - name: Archive (automatic, cloud-managed signing)
        working-directory: flutter_app/ios
        env:
          # Explicit, so the plugin's manifest cannot miss the app's plist
          # whatever directory xcodebuild resolves packages from.
          PERMISSION_HANDLER_INFO_PLIST: ${{ github.workspace }}/flutter_app/ios/Runner/Info.plist
        run: |
          set -o pipefail
          xcodebuild archive \
            -workspace Runner.xcworkspace -scheme Runner -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM" CODE_SIGN_STYLE=Automatic \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER" 2>&1 | tee "$RUNNER_TEMP/archive.log" | grep -E "error:|warning: .*sign|ARCHIVE (SUCCEEDED|FAILED)" || true
          test -d "$RUNNER_TEMP/Runner.xcarchive/Products/Applications/Runner.app"

      - name: The archived app is the one TestFlight should get
        run: |
          app="$RUNNER_TEMP/Runner.xcarchive/Products/Applications/Runner.app"
          plist="$app/Info.plist"
          id=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$plist")
          ver=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$plist")
          num=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$plist")
          min=$(/usr/libexec/PlistBuddy -c "Print :MinimumOSVersion" "$plist")
          echo "$id $ver ($num), iOS $min+"
          test "$id" = "com.wainkw.app"
          test "$num" = "$BUILD_NUMBER"
          /usr/libexec/PlistBuddy -c "Print :NSMicrophoneUsageDescription" "$plist" >/dev/null
          grep -rqa AudioVideoPermissionStrategy "$app" || { echo "::error::microphone permission compiled out of the archive"; exit 1; }
          echo "TESTFLIGHT_LINE=com.wainkw.app $ver ($num), iOS $min+" >> "$GITHUB_ENV"

      - name: Export and upload to App Store Connect
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>testFlightInternalTestingOnly</key><true/>
          </dict>
          </plist>
          EOF
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER" 2>&1 | tee "$RUNNER_TEMP/export.log"
          grep -q "EXPORT SUCCEEDED\|Upload succeeded\|Uploaded" "$RUNNER_TEMP/export.log"
          {
            echo "### TestFlight: uploaded $TESTFLIGHT_LINE"
            echo
            echo "Apple processes it next (usually 5–30 minutes). Then: App Store Connect → the app → TestFlight → Internal Testing, and install it from the TestFlight app on the iPhone."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: testflight-logs
          path: |
            ${{ runner.temp }}/archive.log
            ${{ runner.temp }}/export.log
            ${{ runner.temp }}/export/*.plist
          retention-days: 14

      - name: Remove the key
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc"
