# Sporta — unattended deploy to Hostinger over FTPS.
#
# This is the "auto, all the time" half: it runs in GitHub's cloud, so it keeps
# publishing when the owner's machine is asleep. The other half is
# `npm run publish:watch`, which auto-publishes from the owner's own machine
# while they work. See DEPLOY-AUTOMATION.md.
#
# INERT UNTIL TWO THINGS EXIST — by design, so merely committing this file can
# never deploy anything:
#   1. the branch `sporta-live` (this workflow only ever triggers on it), and
#   2. the repository secrets FTP_HOST, FTP_USER, FTP_PASSWORD.
# Without the secrets the job stops at the preflight step and uploads nothing.
#
# WHY A DEDICATED BRANCH AND NOT main
# This repository holds several unrelated projects — `main` is an Expo app and
# does not contain sporta-web at all, and the day-to-day work happens on
# `claude/*` branches. Deploying from either would be wrong: one ships the wrong
# project, the other sends every experimental commit straight to a live store
# that takes real payments. `sporta-live` is the promotion point: nothing
# reaches the shop until something is merged into it.
name: Deploy Sporta

on:
  push:
    branches: [sporta-live]
    paths:
      - 'sporta-web/**'
      - '.github/workflows/deploy-sporta.yml'
  # Lets the owner redeploy the current sporta-live from the Actions tab without
  # inventing a commit — the manual escape hatch for a rollback.
  workflow_dispatch:

# Two deploys running at once would interleave two sets of files on the server.
# Queue them instead, and never cancel one mid-upload: a cancelled deploy is a
# half-uploaded site.
concurrency:
  group: sporta-ftps-deploy
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: sporta-web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: sporta-web/package-lock.json

      - name: Preflight — credentials present
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          missing=""
          [ -n "$FTP_HOST" ]     || missing="$missing FTP_HOST"
          [ -n "$FTP_USER" ]     || missing="$missing FTP_USER"
          [ -n "$FTP_PASSWORD" ] || missing="$missing FTP_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing"
            echo "Add them under Settings → Secrets and variables → Actions."
            echo "Get the values from hPanel → Files → FTP Accounts."
            echo "Do NOT guess FTP_HOST — ftp.sporta.com.kw has no DNS record;"
            echo "run 'npm run ftp:doctor' locally to find the right one."
            exit 1
          fi

      - name: Install
        run: npm ci

      # publish-ftps.mjs does the whole job itself: npm run release (SEO + build
      # + PHP bundle), then file-audit.mjs — which REFUSES to upload if anything
      # fails — then the FTPS upload, then it re-downloads .htaccess,
      # knet/.htaccess and index.html and compares them byte for byte.
      # config.js and knet/config.php are on its hard-coded never-touch list, so
      # this can never overwrite the live Supabase or Tranportal credentials.
      - name: Build, audit, publish, verify
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          # Build with the VITE_ vars empty so the bundle configures itself at
          # runtime from config.js on the server, exactly like the zip does.
          VITE_SUPABASE_URL: ''
          VITE_SUPABASE_ANON_KEY: ''
          VITE_PAY_BASE_URL: ''
        run: npm run publish

      - name: Summary
        if: always()
        run: |
          {
            echo "### Sporta deploy"
            echo ""
            echo "- commit: \`${GITHUB_SHA::7}\`"
            echo "- result: ${{ job.status }}"
            echo ""
            echo "Then check the live site: https://www.sporta.com.kw"
          } >> "$GITHUB_STEP_SUMMARY"
