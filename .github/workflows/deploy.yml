name: Deploy Wain to Hostinger

on:
  push:
    branches: [claude/wainkw-design-issues-2bggdi]
  workflow_dispatch: {}

concurrency:
  group: deploy-hostinger
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site (produces out/)
        run: npm run build

      - name: Deploy out/ to Hostinger over FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          # The built static site:
          local-dir: ./out/
          # wainkw.com's document root on Hostinger. If your homepage lives
          # somewhere else (e.g. /domains/wainkw.com/public_html/), change this.
          server-dir: /public_html/
