name: Deploy Wain to Hostinger

on:
  push:
    branches: [claude/wainkw-design-issues-2bggdi]
  workflow_dispatch: {}

concurrency:
  group: deploy-hostinger
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # Fail early with a readable message instead of the FTP action's
      # cryptic "Input required and not supplied: server".
      - name: Check FTP credentials are configured
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          missing=""
          [ -z "$FTP_SERVER" ]   && missing="$missing FTP_SERVER"
          [ -z "$FTP_USERNAME" ] && missing="$missing FTP_USERNAME"
          [ -z "$FTP_PASSWORD" ] && missing="$missing FTP_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing"
            echo "Add them at: Settings -> Secrets and variables -> Actions -> New repository secret"
            echo "Values come from hPanel -> Files -> FTP Accounts."
            echo "FTP_SERVER must be the bare host or IP (e.g. ftp.wainkw.com) - no ftp:// prefix, no path."
            exit 1
          fi
          echo "All three FTP secrets are present."

      - name: Install dependencies
        run: npm ci

      # صوت وين: pre-render the two ElevenLabs voices when the secrets are
      # configured; without them the step logs a notice and the site falls
      # back to the browser's own Arabic voice.
      - name: Generate voice clips (optional)
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVEN_VOICE_SHOUQ: ${{ secrets.ELEVEN_VOICE_SHOUQ }}
          ELEVEN_VOICE_SALEM: ${{ secrets.ELEVEN_VOICE_SALEM }}
        run: node scripts/gen-voice.mjs --ci

      - name: Build static site (produces out/)
        # فهد only renders when this is set; an unset value ships the site
        # without the voice assistant rather than with a broken launcher.
        #
        # The Supabase pair is read at BUILD time, not at run time: this is a
        # static export, so whatever is set here is baked into the bundle and
        # nothing can supply it later. Leave them unset and supabaseEnabled is
        # false for the life of that build — every page still renders from the
        # snapshot in places.ts, but ordering, the queue and the submission
        # form are inert and /admin says so.
        #
        # They were missing from this step entirely, so setting the secrets in
        # GitHub would not have been enough on its own: the build would still
        # have shipped without a back end and the failure is quiet.
        #
        # The anon key is public by design — row level security decides what it
        # can do — but it goes in `secrets` rather than `vars` so it is masked
        # in logs. Never put the service_role key here; it bypasses RLS.
        env:
          NEXT_PUBLIC_ELEVENLABS_AGENT_ID: ${{ vars.ELEVENLABS_AGENT_ID }}
          NEXT_PUBLIC_WAIN_TTS_URL: ${{ vars.WAIN_TTS_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: npm run build

      # Say which back end this build carries, so a deploy that silently went
      # out without one is visible in the log rather than discovered by a
      # customer whose order goes nowhere.
      - name: Report what the build was wired to
        env:
          URL: ${{ vars.SUPABASE_URL }}
          AGENT: ${{ vars.ELEVENLABS_AGENT_ID }}
          TTS: ${{ vars.WAIN_TTS_URL }}
        run: |
          if [ -n "$URL" ]; then
            echo "Supabase: configured"
          else
            echo "::warning::Supabase is NOT configured — this build ships with ordering, the queue and the submission form inert. Set the SUPABASE_URL variable and SUPABASE_ANON_KEY secret to enable them."
          fi
          # Same reasoning as Supabase, and the same quiet failure: unset, the
          # call button still works but falls back to the browser's own speech
          # recognition — one question per call, no conversation, and no شوق.
          # That is a working site, so nothing else would ever report it.
          if [ -n "$AGENT" ]; then
            echo "شوق: agent mode ($AGENT)"
          else
            echo "::warning::NEXT_PUBLIC_ELEVENLABS_AGENT_ID is NOT set — the call button falls back to browser speech recognition instead of talking to شوق. Set the ELEVENLABS_AGENT_ID variable (see docs/wain-ai-agent.md) to enable agent mode."
          fi
          # Not a warning when unset. The bridge is an upgrade to a path that
          # already works: without it a runtime-assembled sentence is read by
          # the browser's own voice, which is the behaviour the site shipped
          # with. Worth stating either way so a deploy says which voice a
          # visitor will actually hear.
          if [ -n "$TTS" ]; then
            echo "صوت وين: live bridge ($TTS) — runtime sentences in her own voice"
          else
            echo "صوت وين: recorded clips only — runtime sentences fall back to the browser voice. Set the WAIN_TTS_URL variable to enable the bridge."
          fi

      - name: Verify build output
        run: |
          test -f out/index.html || { echo "::error::out/index.html missing"; exit 1; }
          test -f out/.htaccess || echo "::warning::out/.htaccess missing - custom 404 will not work"
          echo "Pages built: $(find out -name index.html | wc -l)"

      - name: Deploy out/ to Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # Hostinger supports explicit FTPS. Override by setting a repo
          # variable FTP_PROTOCOL to "ftp" if plain FTP is required.
          protocol: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          port: ${{ vars.FTP_PORT || 21 }}
          local-dir: ./out/
          # wainkw.com's document root. Override with a repo variable
          # FTP_SERVER_DIR if the domain serves from a different folder
          # (e.g. /domains/wainkw.com/public_html/).
          server-dir: ${{ vars.FTP_SERVER_DIR || '/public_html/' }}
          # Never delete unrelated files that already live on the host.
          dangerous-clean-slate: false
