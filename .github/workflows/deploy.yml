name: Deploy Wain to Hostinger

# Deploys through the site's own signed endpoint, not FTP.
#
# WHY THIS CHANGED
#
# The FTP path in this file ran 186 times and succeeded 0 of them, because
# FTP_SERVER / FTP_USERNAME / FTP_PASSWORD were never set. It also carried the
# problem the whole file was built around: FTP writes file by file into a
# SHARED docroot — one that holds another application's eight directories — so
# a wrong `server-dir` publishes wain over the primary domain with a green
# tick, and a half-finished upload leaves a live site referencing assets that
# have not arrived. Two steps here existed only to guess at that directory.
#
# `public_html/api/deploy.php` removes all of it. One signed POST: the artifact
# is checksum-verified before a byte is written, staged outside the web root,
# refused if it contains .php or a traversal or one of the PHP app's
# directories, published atomically per file, and pruned against the previous
# manifest so a build that stops shipping something takes it down with it.
#
# It needs ONE secret, DEPLOY_SECRET — the same value as
# <domain>/storage/deploy.secret on the server. The three FTP secrets are no
# longer used by anything.
#
# WHY THE ARTIFACT GOES TO A RELEASE
#
# The endpoint FETCHES the artifact; it does not accept an upload. So the zip
# has to sit on a public https host that deploy.php's ALLOWED_HOSTS permits,
# and a release asset is the one that costs nothing: `github.com` is already
# allowed, and release assets live outside the git object database — so unlike
# committing the zip, this adds nothing permanent to a repository where 25MB of
# history is already old copies of exactly that file.
#
# The asset is named .bin rather than .zip on purpose. It is fetched from
# GitHub here so the extension does not matter to this workflow — but the same
# artifact is uploaded by hand to the site's own docroot when a person deploys
# without CI, and wain's .htaccess denies `\.(bak|zip|db|sqlite|sqlite3)$`.
# One name for both routes is one fewer thing to get wrong at 2am.

# STAGES
#
# A push stages. Production is a deliberate act.
#
# `staging.wainkw.com` is the same artifact, deployed through its own endpoint
# into its own docroot with its own manifest — a rehearsal of the deploy, not
# only a preview of the pages. It is noindex and nofollow via the export's own
# .htaccess, keyed on the Host, so it cannot compete with the live site.
#
# Production runs only from workflow_dispatch with `target: production`, so
# reaching visitors is something a person chooses rather than something a merge
# does. Promoting means dispatching this workflow AT THE COMMIT THAT WAS
# STAGED — the Run workflow menu takes a ref — and that is sound rather than
# approximate: `generateBuildId` is the commit sha whenever the tree is clean,
# which is the whole reason next.config sets it, so the same commit produces
# the same digest and the run verifies that digest against what it just built.
# Dispatch a DIFFERENT commit and you have shipped something nobody looked at,
# which is the one way to misuse this.
on:
  push:
    branches: [claude/wainkw-design-issues-2bggdi]
  workflow_dispatch:
    inputs:
      target:
        description: "Where to deploy"
        type: choice
        default: staging
        options: [staging, production]

concurrency:
  group: deploy-hostinger
  cancel-in-progress: true

permissions:
  contents: write # to create the release that carries the artifact

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # One place decides which stage this run is, so no later step has to
      # re-derive it from the event and get it subtly different. A push is
      # always staging; production only ever comes from a person choosing it.
      - name: Work out which stage this is
        env:
          TARGET: ${{ inputs.target }}
        run: |
          stage="${TARGET:-staging}"
          if [ "$stage" = "production" ]; then
            host="www.wainkw.com"
            endpoint="https://www.wainkw.com/api/deploy.php"
          else
            stage="staging"
            host="staging.wainkw.com"
            endpoint="https://staging.wainkw.com/api/deploy.php"
          fi
          {
            echo "STAGE=$stage"
            echo "SITE_HOST=$host"
            echo "ENDPOINT=$endpoint"
          } >> "$GITHUB_ENV"
          echo "::notice::Deploying to $stage — https://$host/"

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # Fail early and legibly rather than at the POST, where a missing secret
      # signs an empty string and comes back as a flat `bad_signature`.
      - name: Check the deploy secret is configured
        env:
          DEPLOY_SECRET: ${{ secrets.DEPLOY_SECRET }}
        run: |
          if [ -z "$DEPLOY_SECRET" ]; then
            echo "::error::Missing repository secret DEPLOY_SECRET"
            echo "Add it at: Settings -> Secrets and variables -> Actions -> New repository secret"
            echo "The value is the contents of ~/domains/wainkw.com/storage/deploy.secret"
            echo "on the Hostinger account — the same key api/deploy.php verifies against."
            exit 1
          fi
          echo "DEPLOY_SECRET is present."

      - name: Install dependencies
        run: npm ci

      # صوت وين: pre-render the two ElevenLabs voices when the secrets are
      # configured; without them the step logs a notice and the site falls
      # back to the browser's own Arabic voice.
      #
      # THE CACHE IS NOT AN OPTIMISATION, IT IS WHAT MAKES THIS AFFORDABLE.
      #
      # The library is 324 clips — 162 lines each for شوق and سالم, 13,247
      # characters — rendered one at a time with a deliberate 350ms pause
      # between calls: roughly 13 minutes of wall clock, and about $2.40 at the
      # rate the one real render in docs/voice-sample/ measured. A checkout is
      # fresh, so without a cache that is paid IN FULL on every push to this
      # branch — for a set of sentences that changes a few times a year.
      #
      # gen-voice.mjs already knows how to be incremental: every clip carries a
      # hash of {text, voiceId, model, format, settings} and is re-recorded
      # only when that moves. It just needs last run's files to be there. So
      # the exact key pins everything that can change a clip, and the prefix
      # restore-key hands over the previous library when one of them does —
      # which is the case that matters: editing one line then costs one render,
      # not 324.
      - name: Restore the voice clip library
        id: voice-cache
        uses: actions/cache@v4
        with:
          path: public/voice
          key: voice-${{ hashFiles('src/lib/voice-lines.ts', 'src/lib/arabic.ts', 'src/lib/places.ts', 'scripts/gen-voice.mjs') }}
          restore-keys: voice-

      - name: Generate voice clips (optional)
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVEN_VOICE_SHOUQ: ${{ secrets.ELEVEN_VOICE_SHOUQ }}
          ELEVEN_VOICE_SALEM: ${{ secrets.ELEVEN_VOICE_SALEM }}
        run: node scripts/gen-voice.mjs --ci

      # Said out loud, because the failure this guards against is silent: a
      # build with no clips sounds like a screen reader and passes every check.
      - name: Report صوت وين's coverage
        run: |
          if [ -f public/voice/manifest.json ]; then
            n=$(node -p 'Object.keys(require("./public/voice/manifest.json").clips||{}).length')
            b=$(du -sh public/voice | cut -f1)
            echo "صوت وين: $n recorded clips ($b) ride in this artifact."
          else
            echo "::warning::صوت وين has NO recorded clips — every spoken line falls back to the browser's Arabic voice. Set the ELEVENLABS_API_KEY secret to render them."
          fi
          # public/voice is gitignored, so this must still be empty — the build
          # id is the commit sha only while it is, and _next/static/<commit>/
          # is what deploy:verify proves the deploy with.
          test -z "$(git status --porcelain)" \
            || { echo "::error::The tree is dirty before the build, so the build id will be random and _next/static/<commit>/ will not exist."; git status --porcelain | head; exit 1; }

      - name: Build static site (produces out/)
        # فهد only renders when this is set; an unset value ships the site
        # without the voice assistant rather than with a broken launcher.
        #
        # The Supabase pair is read at BUILD time, not at run time: this is a
        # static export, so whatever is set here is baked into the bundle and
        # nothing can supply it later. Leave them unset and supabaseEnabled is
        # false for the life of that build — every page still renders from the
        # snapshot in places.ts, but ordering, the queue and the submission
        # form are inert and /admin says so.
        #
        # The anon key is public by design — row level security decides what it
        # can do — but it goes in `secrets` rather than `vars` so it is masked
        # in logs. Never put the service_role key here; it bypasses RLS.
        env:
          NEXT_PUBLIC_ELEVENLABS_AGENT_ID: ${{ vars.ELEVENLABS_AGENT_ID }}
          NEXT_PUBLIC_WAIN_TTS_URL: ${{ vars.WAIN_TTS_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: npm run build

      # /privacy promises the visitor there are no cookies, and a promise
      # nothing checks is a promise that expires. Non-blocking on purpose: it
      # needs a browser download, and a runner that cannot fetch one must not
      # be able to hold the site hostage.
      - name: No cookies
        continue-on-error: true
        run: npx playwright install --with-deps chromium && npm run audit:cookies

      # Say which back end this build carries, so a deploy that silently went
      # out without one is visible in the log rather than discovered by a
      # customer whose order goes nowhere.
      - name: Report what the build was wired to
        env:
          URL: ${{ vars.SUPABASE_URL }}
          AGENT: ${{ vars.ELEVENLABS_AGENT_ID }}
          TTS: ${{ vars.WAIN_TTS_URL }}
        run: |
          if [ -n "$URL" ]; then
            echo "Supabase: configured"
          else
            echo "::warning::Supabase is NOT configured — this build ships with ordering, the queue and the submission form inert. Set the SUPABASE_URL variable and SUPABASE_ANON_KEY secret to enable them."
          fi
          if [ -z "$AGENT" ]; then
            echo "شوق: agent mode (built-in default — see docs/wain-ai-agent.md)"
          elif [ "$AGENT" = "none" ]; then
            echo "::warning::ELEVENLABS_AGENT_ID is \"none\" — this build ships the browser speech fallback instead of شوق."
          else
            echo "شوق: agent mode (override: $AGENT)"
          fi
          # The bridge is /api/tts.php on this site's own origin and is the
          # DEFAULT now, so an unset variable is the normal, working case. It
          # used to print "recorded clips only" here, back when the bridge was
          # an n8n webhook needing a URL nobody had set. Warn on "none"
          # instead — the deliberate off switch — exactly as the AGENT block
          # above does, and for the same reason.
          if [ -z "$TTS" ]; then
            echo "صوت وين: live bridge (built-in default /api/tts.php) — runtime sentences in her own voice, once the key is on the server"
          elif [ "$TTS" = "none" ]; then
            echo "::warning::WAIN_TTS_URL is \"none\" — runtime sentences in this build fall back to the browser voice."
          else
            echo "صوت وين: live bridge (override: $TTS)"
          fi

      - name: Verify build output
        run: |
          test -f out/index.html || { echo "::error::out/index.html missing"; exit 1; }
          test -f out/.htaccess || echo "::warning::out/.htaccess missing - custom 404 will not work"
          test -f out/build.json || { echo "::error::out/build.json missing - cannot verify the deploy"; exit 1; }
          # Read the build id off the export rather than assuming it is the
          # commit sha. next.config only uses the sha when `git status` is
          # clean, and it falls back to a random id otherwise — which is the
          # documented behaviour, not a fault. The step above asserts the tree
          # IS clean, so on CI this should always be the sha; reading it from
          # the export anyway means a future step that dirties the tree
          # degrades the proof rather than 404ing a deploy that landed fine.
          build_id=$(find out/_next/static -maxdepth 1 -type d -name '*' \
            ! -name static ! -name chunks ! -name media ! -name css \
            -printf '%f\n' | head -1)
          test -n "$build_id" || { echo "::error::no build-id directory in out/_next/static"; exit 1; }
          {
            echo "DIGEST=$(node -p 'require("./out/build.json").digest')"
            echo "VERSION=$(node -p 'require("./package.json").version')"
            echo "BUILD_ID=$build_id"
          } >> "$GITHUB_ENV"
          echo "Pages built: $(find out -name index.html | wc -l)"
          echo "Build id: $build_id"

      # Zipped from INSIDE out/, so the entries are at the top level. The
      # endpoint extracts to a staging directory and copies from there; a
      # wrapper directory would publish the whole site one level down.
      - name: Pack the artifact
        run: |
          cd out && zip -q -r -X "../wain-${VERSION}.bin" . && cd ..
          echo "SHA256=$(sha256sum "wain-${VERSION}.bin" | cut -d' ' -f1)" >> "$GITHUB_ENV"
          ls -l "wain-${VERSION}.bin"

      # Tagged by commit, so the URL the endpoint fetches names exactly what
      # was built — the same discipline as the commit-pinned URLs used when a
      # person deploys by hand.
      - name: Publish the artifact as a release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="deploy-${GITHUB_SHA}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" \
              --title "Deploy ${GITHUB_SHA:0:8}" \
              --notes "Static export of ${GITHUB_SHA}. Fetched by api/deploy.php; not a user-facing release." \
              --prerelease
          fi
          gh release upload "$tag" "wain-${VERSION}.bin" --clobber
          echo "ARTIFACT_URL=https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}/wain-${VERSION}.bin" >> "$GITHUB_ENV"

      # The signature is over the exact bytes POSTed, so the body is written to
      # a file and both the signing and the request read that same file. Piping
      # a string into openssl and then re-typing it into curl is how a trailing
      # newline gets into one and not the other, and the endpoint answers
      # `bad_signature` with nothing to say which side is wrong.
      - name: Deploy through the signed endpoint
        env:
          DEPLOY_SECRET: ${{ secrets.DEPLOY_SECRET }}
        run: |
          set -euo pipefail
          printf '{"url":"%s","sha256":"%s","version":"%s","ts":%s}' \
            "$ARTIFACT_URL" "$SHA256" "$VERSION" "$(date +%s)" > body.json

          sig=$(openssl dgst -sha256 -hmac "$DEPLOY_SECRET" -r < body.json | cut -d' ' -f1)

          code=$(curl -sS -o response.json -w '%{http_code}' \
            --max-time 300 \
            -H "Content-Type: application/json" \
            -H "X-Deploy-Signature: sha256=${sig}" \
            --data-binary @body.json \
            "$ENDPOINT")

          echo "HTTP $code"
          cat response.json; echo

          if [ "$code" != "200" ]; then
            echo "::error::The deploy endpoint refused this build (HTTP $code)."
            echo "The error field in the response names the step that stopped it:"
            echo "  bad_signature    DEPLOY_SECRET does not match storage/deploy.secret"
            echo "  host_not_allowed github.com missing from ALLOWED_HOSTS or storage/deploy.hosts"
            echo "  checksum_mismatch the release asset is not the file that was built"
            echo "  artifact_touches_protected_path the export contains a name the PHP app owns"
            exit 1
          fi

      # A deploy that reports success and did not land is the failure mode this
      # whole file is built around: the site sat for months serving an
      # index.html whose assets had never been uploaded, and nothing anywhere
      # said so. `build.json` answers "what is actually up there" in one
      # request, with no credentials.
      - name: Verify what actually landed
        run: |
          URL="https://${SITE_HOST}/build.json"
          for attempt in 1 2 3 4 5; do
            live=$(curl -fsS --max-time 20 -H 'Cache-Control: no-cache' "$URL" || echo '')
            got=$(printf '%s' "$live" | node -pe 'JSON.parse(require("fs").readFileSync(0,"utf8")).digest' 2>/dev/null || echo '')
            [ -n "$got" ] && break
            echo "attempt $attempt: build.json not readable yet, waiting…"
            sleep 10
          done

          if [ -z "$got" ]; then
            echo "::error::Deployed, but https://${SITE_HOST}/build.json could not be read."
            exit 1
          fi

          if [ "$got" != "$DIGEST" ]; then
            echo "::error::The endpoint reported success but the live site serves a different build."
            echo "  expected digest: $DIGEST"
            echo "  live digest:     $got"
            echo "Most likely something is caching it — build.json is served no-store by .htaccess,"
            echo "so check that rule before suspecting the deploy."
            exit 1
          fi

          echo "Live at https://${SITE_HOST}/ — digest $got, matches this build."

      # A root file matching proves the root arrived and nothing else: on
      # 9 September build.json read correct while every route but / was a 404,
      # because the subdirectories had not landed. So check something that is
      # NOT at the root, and check the one proof whose NAME carries the commit.
      - name: Check the deploy reached below the root
        run: |
          fail=0
          for path in \
            "/_next/static/${BUILD_ID}/_buildManifest.js" \
            "/explore/" \
            "/places/kuwait-towers/"
          do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "https://${SITE_HOST}${path}")
            if [ "$code" = "200" ]; then
              echo "  ok   $path"
            else
              echo "::error::  $code  $path"
              fail=1
            fi
          done
          [ "$fail" = "0" ] || { echo "::error::The root landed but the tree below it did not."; exit 1; }
          echo "Root, a hashed asset named for this commit, and two nested routes all answer 200."
