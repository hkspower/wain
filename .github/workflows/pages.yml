name: Deploy the Almuhallab Code site

# Publishes the static Almuhallab Code site (almuhallab/) to GitHub Pages.
# Enable once in the repo: Settings -> Pages -> Source: "GitHub Actions".

on:
  push:
    branches: [main]
    paths:
      - 'almuhallab/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

# Pinned to commit SHAs, not tags — see the note in nokhatha-windows.yml.
# This workflow publishes the live site, so an action that could be swapped
# under it could serve anything from the company's own domain.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b   # v5

      - name: Upload site
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa   # v3
        with:
          path: almuhallab

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e   # v4
